<script>
/* ML Memory & Cache Systems Ladder data bank: 8 levels x 8 questions (64 questions) + 16 C++/Python exercises.
   Follows the exact pattern of ml_ladder.html. ES5 compatible. */
window.MLLADDER = {"LEVELS": ["1. Pointers, Addresses & NULL Checks", "2. Heap Lifetimes & Memory Leaks", "3. Use-After-Free & Double-Free", "4. Allocation Math & Raw Byte Traps", "5. Python Tensors, Views & Persistent Buffers", "6. GPU Caching Allocator & Autograd Leaks", "7. Async CUDA Streams & Pinned Memory", "8. LLM KV-Cache & Ring-Buffer Lifetimes"], "BANK": [{"l": 1, "q": "In C and C++, what is a pointer variable (like `float *workspace`) in plain words?", "o": ["A small box that holds the memory address (numbered slot) where the real data lives", "A giant container that holds all the floating-point numbers directly inside its own name", "A special GPU core that multiplies matrices automatically whenever the variable is read", "A backup copy of the entire array that the compiler saves on the hard drive for safety"], "w": "Analogy: a pointer is a sticky note with a warehouse room number written on it, not the warehouse room itself. Copying the pointer only copies the sticky note."}, {"l": 1, "q": "What do `malloc(bytes)` and `calloc(count, size)` return when the system runs out of memory (OOM)?", "o": ["They return `NULL` (address 0) to say no memory block could be reserved", "They automatically pause the program until the user closes another window", "They return a valid pointer to a tiny 1-byte emergency buffer on the stack", "They throw a Python `MemoryError` that skips the rest of the C++ function"], "w": "In C (`malloc`/`calloc`), allocation failure does NOT throw an exception; it quietly returns `NULL` (address `0`). If you don't check for `NULL`, the very next write crashes the process."}, {"l": 1, "q": "What happens in C++ if `workspace = (float**)calloc(n, sizeof(float*))` returns `NULL` and the next line runs `workspace[0] = buf`?", "o": ["Undefined behavior and an immediate `SIGSEGV` crash from writing to address 0", "The array automatically resizes itself to fit item 0 and continues normally", "The write is safely ignored by the CPU and `workspace` stays `NULL` without error", "The value `buf` is stored in a temporary CPU register until memory frees up during standard forward and backward execution passes in production"], "w": "This is CWE-476 (NULL Pointer Dereference) — the exact bug you found and filed in `deepspeedai/DeepSpeed#8565` (`shm.cpp:390`) and `eclipse-mosquitto/mosquitto#3762` (`ctrl_shell.c`)."}, {"l": 1, "q": "How does `calloc(count, size)` differ from `malloc(count * size)` when allocation succeeds?", "o": ["`calloc` zeroes every byte of the new block and checks `count * size` for overflow", "`calloc` allocates memory on the GPU while `malloc` allocates memory on the CPU inside the current process virtual address space at runtime", "`calloc` leaves old garbage bytes in the block so it finishes twice as fast", "`calloc` never returns `NULL` even when all physical RAM is completely full"], "w": "`calloc` both zero-initializes the memory AND checks if `count * size` would overflow `size_t`, whereas `malloc` leaves uninitialized garbage bytes and takes a single already-multiplied size."}, {"l": 1, "q": "Suppose a function allocates 3 buffers in a row (`a = calloc(...)`, `b = calloc(...)`, `c = calloc(...)`). What goes wrong if `c` is `NULL` and you just `return -1;`?", "o": ["Buffers `a` and `b` are leaked because nobody freed them before returning", "Buffers `a` and `b` are freed automatically because the function returned `-1`", "Nothing goes wrong because `calloc` rolls back earlier calls when one fails", "Calling `free(c)` is required or the `NULL` pointer itself will leak memory"], "w": "C++ has no automatic rollback for raw `calloc` calls. If allocation #3 fails after #1 and #2 succeeded, you must `free(a)` and `free(b)` before returning (`free(NULL)` is a safe no-op). You hit this exact compound-guard pattern in `DeepSpeed#8565`."}, {"l": 1, "q": "Is calling `free(NULL)` in C/C++ a crash, or is it safe?", "o": ["It is guaranteed by the C/C++ standard to be a safe no-op (it does nothing)", "It immediately crashes the program with a double-free segmentation fault", "It corrupts the heap allocator's free-list header at address zero", "It frees the most recently allocated block on the current thread by mistake during standard forward and backward execution passes in production"], "w": "Because `free(NULL)` is guaranteed to do nothing safely, a single cleanup block can safely run `free(a); free(b); free(c);` when any one of them failed and is `NULL`!"}, {"l": 1, "q": "Why do C++ static analyzers sometimes miss `if ((p = calloc(n, sz)) == NULL)` if written carelessly?", "o": ["The assignment `p = calloc(...)` is wrapped inside `(...)` on the left of `== NULL`", "The C compiler rewrites `calloc` into `malloc` before the parser reads the file inside the current process virtual address space at runtime", "`NULL` is only defined in Python files and never appears in C or C++ code", "Static analyzers only inspect comments and never look inside `if` conditions"], "w": "Real lesson from your Reagent `C07` detector (`httpd` `suexec.c`): the left-hand side of `== NULL` is the parenthesized assignment `(p = calloc(...))`, so the checker must unwrap the assignment to see that `p` IS guarded."}, {"l": 1, "q": "Why do C and C++ parse `if (!a || !b)` differently inside tree-sitter AST tools?", "o": ["C wraps the `if` test in `parenthesized_expression`, while C++ uses `condition_clause`", "C++ does not allow the `||` operator inside an `if` statement at all", "C evaluates `||` from right to left while C++ evaluates it from left to right whenever the function executes on a 64-bit CPU or GPU target", "C++ turns every pointer into a boolean at compile time and deletes the `if`"], "w": "Real lesson #7 from your Reagent `C07` work on `DeepSpeed/csrc/cpu/comm/shm.cpp`: `.c` and `.cpp` grammars wrap `if` conditions in different AST node types (`parenthesized_expression` vs `condition_clause`)."}, {"l": 2, "q": "What is a memory leak (CWE-401) in plain everyday terms?", "o": ["Rented memory whose last address pointer was lost or overwritten before `free()` was called", "Memory that physically drips electricity out of the RAM stick when the CPU gets hot", "A buffer that was freed twice in the same function, corrupting the allocator", "A variable on the CPU stack that disappears as soon as its function returns"], "w": "Analogy: you rent a storage locker (`malloc`), write the locker number on a single sticky note (`ptr`), and then erase the sticky note to write a different number (`ptr = other`) without ever returning the first locker's key (`free`)."}, {"l": 2, "q": "In `DeepSpeed#8565` (`shm.cpp`), `workspace_buf = malloc(sz)` was passed to `shared_create(workspace_buf)` (which copied its bytes to a file) and then `workspace_buf = mmap_ptr`. Why did that leak?", "o": ["`workspace_buf` was overwritten with `mmap_ptr` before `free(workspace_buf)` was called", "`shared_create` automatically freed `workspace_buf` twice inside the kernel inside the current process virtual address space at runtime", "`malloc(sz)` allocated memory on the stack instead of the heap in `shm.cpp`", "`mmap_ptr` was smaller than `sz`, leaving the tail bytes of `workspace_buf` dangling"], "w": "In `DeepSpeed#8565`, `workspace_buf` held the only pointer to the heap block from line 362. Line 365 reassigned `workspace_buf = (allreduce_workspace*)allreduce_buffer.bytes`, permanently orphaning the heap block! Inserting `free(workspace_buf);` at line 364 fixed it."}, {"l": 2, "q": "What happens when a C++ inference loop calls `float *scratch = (float*)malloc(1048576)` on every token step and forgets `free(scratch)`?", "o": ["Resident memory (RSS) grows by 1 MB per token until the OS OOM-kills the process", "The compiler reuses the exact same 1 MB address on every loop iteration automatically", "Only the last token's 1 MB stays in RAM because loop variables auto-free `malloc`", "The program slows down on step 1 but memory usage stays completely flat forever"], "w": "Notice the distinction: the pointer variable `scratch` lives on the stack and resets each iteration, but the 1 MB block it pointed to lives on the HEAP and stays allocated forever unless `free(scratch)` is called."}, {"l": 2, "q": "Even if you DO call `free(scratch)` at the end of every token step, why do high-speed ML kernels pre-allocate one `workspace` buffer outside the loop instead?", "o": ["Calling `malloc`/`free` every step takes locks, fragments the heap, and thrashes CPU caches", "`free()` only works once per program and fails if called inside a `for` loop", "Heap memory cannot hold floating-point numbers if allocated more than once", "Pre-allocating outside the loop uses more total RAM than leaking inside the loop during standard forward and backward execution passes in production"], "w": "Allocating and freeing megabytes on every token step forces OS page faults, allocator lock contention, and cold L1/L2 caches. Pre-allocating a reusable workspace once (and growing it only when `needed > capacity`) is standard in PyTorch/DeepSpeed."}, {"l": 2, "q": "Why did your Reagent `C05` leak detector initially miss `T *p = (T*)malloc(n)` before you added `_semantic_parent()`?", "o": ["The `(T*)` cast wrapped the `malloc` call, hiding the outer assignment node", "Casting `malloc` to `(T*)` automatically registers the pointer with a garbage collector", "`malloc` inside a C++ file returns a reference instead of a raw pointer", "Tree-sitter deletes all cast expressions when parsing C and C++ source files"], "w": "In C/C++ ASTs, `(T*)malloc(n)` makes the parent of `malloc(n)` a `cast_expression`, not the `init_declarator` or `assignment_expression`. Walking up through casts (`_semantic_parent`) caught the real DeepSpeed `shm.cpp` leak!"}, {"l": 2, "q": "In C++, what is RAII (`std::unique_ptr` / `std::vector`) and why does it prevent early-return memory leaks?", "o": ["It ties heap memory to a stack object whose destructor automatically frees it on any return or throw", "It disables the heap completely and forces all tensors of any size onto the CPU stack", "It runs a background garbage-collection thread that scans RAM every 10 seconds whenever the function executes on a 64-bit CPU or GPU target", "It ignores allocation failures so the function never has to return early on error"], "w": "When a stack object (`std::unique_ptr<float[]>`) goes out of scope — whether by normal `return`, early error `return`, or an exception — the C++ compiler automatically emits the destructor call that frees the heap block."}, {"l": 2, "q": "When a function transfers ownership of a newly allocated buffer to its caller (`return buf;`), should the function call `free(buf)` before returning on the success path?", "o": ["No: on the success path the caller now owns `buf`; only error paths inside the function should `free(buf)`", "Yes: every function that calls `malloc` must always call `free` before `return buf`", "Yes, because `free(buf)` only marks the buffer as read-only for the caller", "No, and error paths inside the function should never call `free(buf)` either during standard forward and backward execution passes in production"], "w": "If you `free(buf)` and then `return buf;`, you hand the caller a dangling (already-freed) pointer! Clean pattern: free `buf` on early error exits, and return `buf` intact on the success path."}, {"l": 2, "q": "In Python, CPython uses reference counting (`ob_refcnt`) plus a cycle detector. Why can Python objects still 'leak' memory in a long-running ML server?", "o": ["Appending tensors or caches to a global/module list or dict keeps their reference count > 0 forever", "Python never frees any variable until the entire computer is rebooted inside the current process virtual address space at runtime", "Reference counting only works for strings and never frees lists or numbers", "The garbage collector deletes objects that are still in use if RAM gets above 50%"], "w": "If an unbounded dict, cache, or history list (`self.history.append(tensor)`) keeps a live reference to an object, its reference count never hits 0, so Python is forbidden from freeing it."}, {"l": 3, "q": "What actually happens to a pointer variable `p` when you call `free(p)` in C/C++?", "o": ["The heap block is returned to the allocator, but `p` still holds the old address (now a dangling pointer)", "`free(p)` automatically sets `p = NULL` in every function across the whole program", "The CPU physically erases the variable `p` from the stack so it cannot be read", "Nothing happens until the end of `main()`, when all `free()` calls run together"], "w": "Because `p` is passed by value to `free(p)`, `free` cannot change `p` itself! `p` still holds the exact same address number on your sticky note, even though the warehouse room now belongs to someone else."}, {"l": 3, "q": "In your CFEngine `RemoveFilament` fix (`cfengine/core#6358`), what went wrong after `if (StringSetSize(filament->items) == 0) { StringSetDestroy(filament->items); free(filament); }`?", "o": ["There was no `return;`, so execution fell through to read `filament->db_id` (UAF) and `free(filament)` again (double-free)", "The `if` condition checked `== 0` instead of `< 0`, so the branch never ran", "`free(filament)` was called before `StringSetDestroy(filament->items)` inside the `if` block", "`OpenDB` allocated a new `filament` pointer without checking for `NULL` first during standard forward and backward execution passes in production"], "w": "That single missing `return;` after the early-exit cleanup caused BOTH a CWE-416 Use-After-Free (`OpenDB(&db, filament->db_id)`) AND a CWE-415 Double-Free at the end of `RemoveFilament`! Adding `return;` fixed both."}, {"l": 3, "q": "Why is a Double-Free (`free(p)` followed later by `free(p)` again, CWE-415) so dangerous in C/C++?", "o": ["It corrupts the allocator's free-list metadata or frees a block already handed out to a new object", "It simply returns `false` on the second `free(p)` and wastes one CPU cycle inside the current process virtual address space at runtime", "It zeroes out the memory block a second time, which is safe but slightly slower", "It only affects 16-bit microcontrollers and is ignored on 64-bit Linux systems"], "w": "When `free(p)` runs the first time, the allocator puts that block onto its free-list (and may immediately hand it to another `malloc`). Calling `free(p)` a second time either corrupts the free-list links or yanks memory out from under the new owner!"}, {"l": 3, "q": "Why can a Use-After-Free (CWE-416) appear to 'pass all unit tests' on a developer's laptop and then crash or corrupt weights in production?", "o": ["Freed memory often keeps its old bytes briefly until another thread or allocation overwrites that slot", "Unit tests always run on the GPU where `free()` is completely disabled", "Compilers automatically delete `free()` calls when compiling in debug mode whenever the function executes on a 64-bit CPU or GPU target", "Production servers use 32-bit floats while laptops only use 64-bit floats"], "w": "Reading `filament->db_id` right after `free(filament)` might read the old bytes still sitting in RAM during a quiet single-threaded test — which is why running under AddressSanitizer (`-fsanitize=address`, ASan) is critical to catch UAF immediately!"}, {"l": 3, "q": "How does AddressSanitizer (ASan) catch a Use-After-Free the instant it happens, even if no other `malloc` has reused the memory yet?", "o": ["It places freed blocks in a quarantine queue and marks their shadow-memory bytes as poisoned", "It runs the program 1,000 times with random inputs until a segmentation fault occurs", "It replaces every pointer with a string containing the variable's source-code name", "It disables `free()` completely so no memory is ever returned during the test"], "w": "ASan maintains 1 byte of 'shadow memory' per 8 bytes of real RAM and quarantines freed blocks. Every pointer dereference checks the shadow byte first; touching a poisoned (freed) address aborts immediately with a full stack trace."}, {"l": 3, "q": "In PyTorch / C++ tensor internals, what happens if you grab a raw pointer `float *p = tensor.data_ptr<float>()` and then call `tensor.resize_(bigger_shape)`?", "o": ["`resize_` allocates a new larger buffer and frees the old one, leaving `p` as a dangling pointer (UAF)", "`p` automatically updates its own address to point at the newly allocated buffer inside the current process virtual address space at runtime", "`resize_` refuses to run whenever any raw pointer variable exists in the function", "The new elements are stored in a linked list so the old pointer `p` stays valid forever"], "w": "A raw pointer (`float *p`) or cached byte-offset view does NOT know when `Storage` reallocates. If `resize_` grows past current capacity, the old backing buffer is freed and `p` now points to freed memory!"}, {"l": 3, "q": "What defensive habit after `free(p)` prevents a later cleanup path in the same struct or function from double-freeing `p`?", "o": ["Immediately set `p = NULL;` right after `free(p);` (and return if it is an early-exit branch)", "Call `malloc(0)` and assign the result to `p` so it points to a fresh block", "Add `p++` after `free(p)` so the pointer points to the next byte instead whenever the function executes on a 64-bit CPU or GPU target", "Wrap the second `free(p)` in a `try / catch` block to ignore the crash"], "w": "Setting `p = NULL;` after `free(p);` turns any later `free(p)` into `free(NULL)` (a safe no-op) and turns any accidental dereference `*p` into an immediate, deterministic NULL fault instead of silent heap corruption."}, {"l": 3, "q": "In `cf-agent/abstract_dir.c`, why wasn't `if (local) { free(dir); } else { RemoteDirClose(dir); }` a Use-After-Free?", "o": ["`free(dir)` and `RemoteDirClose(dir)` sit in mutually exclusive `if` / `else` branches, so both never run on the same call", "`RemoteDirClose(dir)` does not actually read `dir` and only logs a message", "`free(dir)` in C only takes effect after the `else` branch finishes running", "`local` is always `false` in C programs so `free(dir)` is dead code during standard forward and backward execution passes in production"], "w": "Real lesson from your Reagent `C02` branch-exclusivity fix: a static scanner that only checks line order without checking whether two statements sit in mutually exclusive `if`/`else` branches will false-positive on safe code."}, {"l": 4, "q": "What is an Integer-Overflow-to-Buffer-Overflow (`IO2BO`, CWE-190 -> CWE-787) bug in `malloc(n * sizeof(float))`?", "o": ["A huge `n` makes `n * 4` wrap around past the integer limit to a tiny number, allocating a tiny buffer that the loop then overflows", "`sizeof(float)` changes from 4 to 8 at runtime when `n` is larger than 1,000", "`malloc` automatically converts negative numbers into `NULL` without overflowing", "Multiplying inside `malloc` is a syntax error in C++ unless cast to `double`"], "w": "Suppose 32-bit `size_t` max is `4,294,967,295` (`0xFFFFFFFF`). If `n = 1,073,741,825`, then `n * 4 = 4,294,967,300`, which wraps around modulo $2^{32}$ to just **4 bytes**! `malloc(4)` succeeds, and writing `n` floats smashes the heap."}, {"l": 4, "q": "Why is the overflow check `if (n * sizeof(float) < n)` BROKEN in C/C++ for guarding `malloc(n * sizeof(float))`?", "o": ["Multiplication by 4 can wrap around multiple times and still land on a number `>= n`, or trigger signed undefined behavior", "The `<` operator in C/C++ only compares the lowest 8 bits of each number", "`sizeof(float)` is a floating-point number so `<` rounds both sides to zero whenever the function executes on a 64-bit CPU or GPU target", "The check is too strict and rejects every `n` greater than 100"], "w": "The safe, non-overflowing guard divides the constant limit BEFORE multiplying: `if (elem_size != 0 && n > SIZE_MAX / elem_size) return NULL;` — or simply use `calloc(n, elem_size)`, which checks this internally!"}, {"l": 4, "q": "In your Reagent `C06` triage on `cfengine/core` (`StrList_Insert`), why was `new_cap = old_cap * 2` NOT an exploitable integer overflow on real 64-bit systems?", "o": ["`old_cap` came from a prior real allocation that already succeeded in RAM, so OOM happens long before `old_cap * 2` can approach `SIZE_MAX`", "Multiplying by 2 in C can never overflow any integer type under any circumstance", "`realloc` ignores its size argument and always doubles the buffer safely", "64-bit integers have infinite range and no maximum value during standard forward and backward execution passes in production during standard forward and backward execution passes in production"], "w": "Great systems reasoning from your ledger: to wrap `old_cap * 2` near `SIZE_MAX` ($2^{64}-1$), a prior allocation of $2^{63}$ bytes (8 exabytes!) would have had to succeed first, which is physically impossible."}, {"l": 4, "q": "In your `pytorch/executorch#23399` finding (`QuantizedKVCache`), why did passing `bfloat16` `k_val` into `torch.ops.llama.update_cache` fatally abort the whole Python process?", "o": ["The cache buffer was hardcoded to `float32` (4 bytes), so the C++ op's `element_size()` check failed `ET_CHECK_MSG` and called `abort()`", "Python does not support `bfloat16` tensors on CPU under any version of PyTorch inside the current process virtual address space at runtime", "`update_cache` ran out of GPU memory and threw a catchable `torch.cuda.OutOfMemoryError`", "The model weights were deleted when `QuantizedKVCache.from_float()` was called"], "w": "In `executorch#23399`, `self.cache_fp_type` was hardcoded to `torch.float32` (4 bytes/elem), while on-device LLM inference passed `bf16`/`fp16` (2 bytes/elem). The C++ `ET_CHECK_MSG` on `element_size()` aborted the entire process (not catchable by `try/except`)!"}, {"l": 4, "q": "What is the SECOND, even sneakier bug when a C++ custom op checks ONLY `src.element_size() == dst.element_size()` before calling `memcpy(dst_ptr, src_ptr, nbytes)`?", "o": ["`float16` and `bfloat16` both have `element_size() == 2`, so `memcpy` passes the check and silently reinterprets `bf16` bits as bogus `fp16` numbers!", "`memcpy` refuses to copy 2-byte elements and raises a hardware alignment fault", "`float16` and `bfloat16` have identical bit layouts so `memcpy` works fine between them", "`element_size()` returns the total tensor byte count instead of bytes per element"], "w": "Both `fp16` (1 sign, 5 exponent, 10 mantissa bits) and `bf16` (1 sign, 8 exponent, 7 mantissa bits) are 2 bytes (`element_size() == 2`)! A raw `memcpy` gated only on byte width silently scrambles every number with zero error unless `scalar_type()` (dtype) is also checked or cast first."}, {"l": 4, "q": "Why did existing unit tests in `executorch` never catch the `QuantizedKVCache` `bf16`/`fp16` crash before your audit?", "o": ["Every unit test in CI fed `float32` inputs, even though real on-device LLM deployment runs in `bf16` or `fp16`", "The unit tests were marked `@unittest.skip` on all platforms", "`QuantizedKVCache` was never imported anywhere in the repository", "The bug only happens when the sequence length is greater than 1,000,000 tokens during standard forward and backward execution passes in production"], "w": "Classic training/CI vs. deployment blind spot: CI tests defaulted to `torch.float32` (which happened to match the hardcoded `self.cache_fp_type = torch.float32`), while real quantized LLM runs use `bf16`/`fp16`."}, {"l": 4, "q": "What was the clean 2-line fix in `QuantizedKVCache._update_and_return_float_values()` (`executorch#23399`) that fixed BOTH the custom C++ `memcpy` path and the fallback `index_put_` path?", "o": ["Cast `k_val = k_val.to(k_out.dtype)` and `v_val = v_val.to(v_out.dtype)` once up front before either update branch runs", "Wrap `torch.ops.llama.update_cache` in a Python `try / except Exception:` block inside the current process virtual address space at runtime", "Delete the `ET_CHECK_MSG` assertion in C++ so `memcpy` copies 2-byte values into 4-byte slots", "Force the entire LLM model to run in `float64` on mobile devices"], "w": "Casting `k_val` and `v_val` to `k_out.dtype` / `v_out.dtype` up front guarantees that both byte-width (`element_size()`) AND bit-format (`scalar_type()`) match the dequantized destination buffer on both paths!"}, {"l": 4, "q": "In C++, why is `memcpy(dst, src, count)` a common bug when `dst` and `src` are `float*` arrays of length `count`?", "o": ["`memcpy`'s third argument is `n_bytes`, so passing `count` instead of `count * sizeof(float)` copies only the first quarter of the array!", "`memcpy` only works on `char*` strings and crashes if given `float*` pointers", "`memcpy` automatically multiplies its third argument by `sizeof(float)` twice whenever the function executes on a 64-bit CPU or GPU target", "`memcpy` swaps `dst` and `src` whenever `count` is an odd number"], "w": "`memcpy(void *dst, const void *src, size_t nbytes)` always counts raw BYTES, never elements. For `count` floats (4 bytes each), passing `count` copies only `count` bytes (`count / 4` floats) and leaves the rest uncopied!"}, {"l": 5, "q": "In PyTorch, when you slice a tensor `view = x[0:4]`, does `view` get its own new copy of the numbers in RAM/VRAM?", "o": ["No: `view` is a new header (`TensorImpl`) pointing to the exact same underlying `Storage` buffer", "Yes: slicing a tensor in PyTorch always calls `malloc` and copies the 4 numbers", "Only on the CPU; on the GPU slicing always makes a full deep copy", "It deletes `x` so that only `view` can read those 4 numbers from that point on"], "w": "A PyTorch `Tensor` has two parts: a lightweight metadata header (`shape`, `stride`, `storage_offset`, `dtype`) and a heavy `Storage` byte buffer. Slicing `x[0:4]` creates a new header sharing the exact same `Storage`!"}, {"l": 5, "q": "In your GPT-Neo `StaticCache` local-attention bug fix (`gpt_neo_static_cache_fix.md`), why did `past_len = cache_layer.cumulative_length` BEFORE `cache.update(...)` give the WRONG `past_len` tate_dict()` omits it!", "PyTorch immediately deletes any `self.*` tensor attribute that is not registered within 1 second", "`self.m_list` gets trained by the optimizer as if it were a learnable `nn.Parameter` weight", "`register_buffer` is only needed for strings and integers, never for tensors during standard forward and backward execution passes in production"], "w": "`nn.Module.to()`, `.half()`, `.cuda()`, and `.state_dict()` only walk `_parameters`, `_buffers`, and child `_modules`. A plain `self.t = tensor` attribute is invisible to all of them!"}, {"l": 5, "q": "In your `Kornia` `AdaptiveDiscriminatorAugmentation` (`ADA`) finding, why did resuming training from a `state_dict()` checkpoint silently break discriminator training?", "o": ["The probability `p`, EMA stat, and step counter were plain Python floats/ints not saved in `state_dict`, so resuming reset `p` from `0.8` back to `1e-5`", "`state_dict()` saved `p` twice and multiplied them together on reload", "Kornia's `load_state_dict()` deleted all convolutional weights in the discriminator", "The learning rate was set to `NaN` whenever `state_dict()` was called on GPU"], "w": "Real T4 finding from your ledger (`20261019_063000_kornia-ada-state-dict-finding.md`): any stateful module whose behavior evolves over training steps (`p`, running EMA, step counters) MUST persist that state in `state_dict` / `register_buffer` or checkpoint resume silently corrupts training."}, {"l": 5, "q": "In your `TorchMetrics` `WrapperMetric` finding (`20261019_190000_torchmetrics-wrapper-persistent-finding.md`), why did calling `wrapper.persistent(True)` still return an empty `state_dict()`?", "o": ["`WrapperMetric.persistent()` only looped over `self._defaults` (empty on the outer wrapper) and forgot to forward `.persistent(mode)` to the inner wrapped metric(s)!", "`state_dict()` in PyTorch never saves buffers on subclasses of `nn.Module`", "`persistent(True)` actually means 'delete all buffers before saving' whenever the function executes on a 64-bit CPU or GPU target whenever the function executes on a 64-bit CPU or GPU target", "The inner metric's tensors were stored on disk instead of in RAM"], "w": "Because `BootStrapper`, `MultioutputWrapper`, `MinMaxMetric`, etc. hold their real metric state on `self.metric` (a child module) and have `self._defaults = {}` on the outer wrapper, `WrapperMetric.persistent(True)` was a complete no-op until forwarded to child metrics!"}, {"l": 5, "q": "Why does calling `.contiguous()` on a transposed PyTorch tensor `t = x.transpose(0, 1)` sometimes allocate new memory and sometimes return `t` untouched?", "o": ["`transpose` only swaps the `stride` metadata without moving bytes in RAM; `.contiguous()` allocates and copies bytes only if the strides are no longer in row-major order", "`.contiguous()` allocates new memory on odd-numbered calls and reuses memory on even-numbered calls", "`.contiguous()` only allocates memory when the tensor contains `NaN` or `Inf` values", "`transpose(0, 1)` already copies all bytes in RAM, so `.contiguous()` never allocates during standard forward and backward execution passes in production during standard forward and backward execution passes in production"], "w": "When a C++/CUDA kernel requires contiguous row-major memory (`ptr[i * cols + j]`), calling `t.contiguous()` checks `t.is_contiguous()`. If `False` (as after `transpose`), it allocates a fresh buffer and copies the elements into row-major order."}, {"l": 5, "q": "In your `Project-MONAI` finding (`20261019_180000_monai-first-call-config-mutation.md`), why did calling a transform (`ImageHistogram` / `RandDeformGrid(spacing=None)`) on a second image with a different shape crash?", "o": ["The first call overwrote `self.spacing` / `self.bins` in-place on `self` with values sized for the first image's shape!", "MONAI transforms automatically delete themselves after being called once inside the current process virtual address space at runtime", "Python garbage-collected the second image before the transform started", "The transform converted all images into 1D strings on the first call"], "w": "Mutating `self.config_attr` lazily on the first forward call turns a reusable stateless transform into a shape-locked trap when the next sample has a different resolution or channel count."}, {"l": 6, "q": "Why doesn't PyTorch call NVIDIA's raw `cudaMalloc` and `cudaFree` directly on every tensor creation and destruction?", "o": ["Raw `cudaMalloc`/`cudaFree` synchronize the entire GPU and stall all streams for hundreds of microseconds, so PyTorch reuses blocks inside `CUDACachingAllocator`", "NVIDIA GPUs only allow `cudaMalloc` to be called once per hour by the operating system", "`cudaFree` does not exist in CUDA C++; GPU memory can never be freed once allocated", "`CUDACachingAllocator` stores all tensors on the CPU hard drive instead of GPU VRAM"], "w": "Calling raw OS/driver `cudaMalloc` or `cudaFree` forces a global device synchronization across the GPU. PyTorch's `CUDACachingAllocator` keeps freed GPU blocks in a fast C++ pool so the next tensor of similar size reuses a block in nanoseconds without calling the CUDA driver!"}, {"l": 6, "q": "In PyTorch CUDA memory stats, what is the difference between `memory_allocated()` and `memory_reserved()`?", "o": ["`allocated` is VRAM currently held by live tensors; `reserved` is total VRAM held by PyTorch's caching pool (`allocated` + cached free blocks)", "`allocated` is CPU RAM and `reserved` is GPU VRAM", "`reserved` is always smaller than `allocated` because it excludes model weights", "They are two names for the exact same counter in `CUDACachingAllocator` during standard forward and backward execution passes in production during standard forward and backward execution passes in production"], "w": "When a tensor is deleted in Python (`del x`), `memory_allocated()` drops immediately, but `memory_reserved()` stays unchanged because the block sits in `CUDACachingAllocator`'s free pool ready for the next tensor! `nvidia-smi` shows `memory_reserved()` (plus CUDA context overhead)."}, {"l": 6, "q": "What does `torch.cuda.empty_cache()` actually do — and what does it NOT do?", "o": ["It returns unused cached blocks from PyTorch's free pool back to the CUDA driver, but it CANNOT free any memory still held by live tensors", "It deletes all live tensors and model weights on the GPU so training starts over with 0 bytes used inside the current process virtual address space at runtime", "It doubles the physical VRAM on the graphics card by compressing float32 tensors into int4", "It fixes memory leaks caused by appending live `loss` tensors to a Python list"], "w": "`empty_cache()` only releases blocks sitting idle in the caching allocator's free list (`reserved - allocated`). If your training loop leaked live tensor references, `empty_cache()` frees zero bytes of those leaked tensors and just slows the loop down!"}, {"l": 6, "q": "How does external fragmentation cause a `CUDA out of memory` error even when `reserved - allocated` shows 4 GB of free cached VRAM?", "o": ["The 4 GB of free pool memory is chopped into many small non-adjacent blocks, so a single contiguous 512 MB tensor request cannot fit in any one block", "The GPU refuses to use the last 4 GB of VRAM unless the monitor cable is unplugged", "`CUDACachingAllocator` forgets to search its free list whenever more than 2 blocks are free whenever the function executes on a 64-bit CPU or GPU target", "PyTorch reserves 4 GB exclusively for error messages and stack traces"], "w": "Every tensor needs a single contiguous virtual address range. If varying sequence lengths leave 4,000 separate 1 MB free blocks scattered between live blocks, a 512 MB request misses every free block and fails if `cudaMalloc` has no room left on the device!"}, {"l": 6, "q": "When `CUDACachingAllocator` finds a 10 MB free block in its pool for a 2 MB tensor request, what does it do so the remaining 8 MB isn't wasted?", "o": ["It splits the 10 MB block into a 2 MB active block (returned to the caller) and an 8 MB free remainder block (put back into the free pool)", "It throws away the remaining 8 MB permanently until the process exits", "It refuses to use the 10 MB block and calls `cudaMalloc(2 MB)` instead", "It shrinks the tensor to 0 bytes so it doesn't have to touch the 10 MB block"], "w": "Block splitting (and coalescing adjacent freed blocks back together when both halves are freed) is the core mechanism of `CUDACachingAllocator` (`BlockPool` in `CUDACachingAllocator.cpp`)."}, {"l": 6, "q": "Why does writing `epoch_losses.append(loss)` inside a PyTorch training loop cause GPU VRAM to climb on every batch until it crashes with OOM?", "o": ["`loss` is a live autograd Tensor with a `.grad_fn` pointer that keeps the entire step's forward activation graph alive in VRAM!", "A Python float inside `epoch_losses` takes 500 MB of GPU memory per number inside the current process virtual address space at runtime", "`append()` copies the model's weights onto a new GPU every time it is called", "Lists in Python are stored inside the GPU's L1 cache by default"], "w": "One of the most common real-world PyTorch GPU memory leaks: `loss` points to `grad_fn`, which points to the saved activations of every layer in that batch! Appending `loss.detach().item()` (or `float(loss.detach())`) stores a plain 8-byte CPU number and lets the entire GPU graph free immediately."}, {"l": 6, "q": "When `CUDACachingAllocator` cannot find a big enough free block in its pool and `cudaMalloc` also fails with OOM, what is its built-in retry step before raising `OutOfMemoryError`?", "o": ["It calls `release_cached_blocks()` (returning all idle free-pool blocks to CUDA) and retries `cudaMalloc` once", "It deletes random model weights until enough VRAM is free for the new tensor", "It silently moves the tensor to CPU RAM without telling the program whenever the function executes on a 64-bit CPU or GPU target", "It waits 60 seconds and asks the user to type a smaller batch size"], "w": "Inside `CUDACachingAllocator.cpp`, an OOM from `cudaMalloc` triggers an automatic `release_cached_blocks()` (the C++ body of `empty_cache()`) so fragmented idle blocks are merged back in the CUDA driver before retrying `cudaMalloc`."}, {"l": 6, "q": "How do CUDA Virtual Memory Management (`expandable_segments:True` in `PYTORCH_CUDA_ALLOC_CONF`) and PagedAttention (vLLM) solve VRAM fragmentation?", "o": ["They map physical VRAM pages into contiguous virtual ranges (or fixed-size KV blocks) so non-adjacent physical chunks can back a grown tensor without copying", "They disable GPU caching completely and run `cudaMalloc` on every single token", "They truncate every prompt to 16 tokens so all tensors have the exact same size", "They store the KV cache as JPEG images to avoid floating-point allocations during standard forward and backward execution passes in production during standard forward and backward execution passes in production"], "w": "`expandable_segments:True` uses `cuMemAddressReserve` + `cuMemMap` so physical 2 MB pages can be stitched onto an existing virtual range without reallocating+copying, while PagedAttention splits KV caches into fixed-size pages (zero external fragmentation!)."}, {"l": 7, "q": "What does it mean that CUDA kernel launches and `cudaMemcpyAsync` are 'asynchronous' with respect to the CPU?", "o": ["The CPU queues the command onto the GPU stream and immediately moves to the next line of CPU code BEFORE the GPU has even started or finished the work", "The GPU runs the kernel backwards from the last line to the first line", "The CPU freezes and waits until the GPU finishes every calculation before running the next line", "The kernel runs on a random GPU in the data center without telling the CPU"], "w": "Analogy: the CPU is a restaurant manager putting an order slip on a conveyor belt (`CUDA stream`) for the kitchen (`GPU`). The manager immediately walks to the next line of Python/C++ while the kitchen is still cooking 5 orders back!"}, {"l": 7, "q": "Why does `cudaMemcpyAsync(gpu_ptr, cpu_ptr, bytes, H2D, stream)` require `cpu_ptr` to be in **pinned (page-locked)** host memory (`pin_memory=True` / `cudaHostAlloc` / `mlock`)?", "o": ["The GPU's DMA engine copies directly from physical RAM addresses; if the OS paged `cpu_ptr` out to disk mid-copy, the DMA would read garbage or fault!", "Pageable CPU memory can only store integers and cannot store floating-point tensors", "Pinned memory is stored inside the GPU fan controller instead of system RAM whenever the function executes on a 64-bit CPU or GPU target whenever the function executes on a 64-bit CPU or GPU target", "`cudaMemcpyAsync` deletes `cpu_ptr` before copying it unless it is pinned"], "w": "Without page-locking (`mlock` / `cudaHostAlloc`), the OS virtual-memory manager can move or swap a physical RAM page to disk while the GPU's Direct Memory Access (DMA) hardware is reading that physical address in the background!"}, {"l": 7, "q": "In DeepSpeed's `csrc/pin_memory/page_alloc.cpp` (`ds_page_aligned_alloc`, which you analyzed in Reagent `C02`), what must happen if `mlock(ptr, size)` returns non-zero (fails to pin)?", "o": ["It must call `free(ptr)` to release the heap buffer and immediately `return nullptr;` so the unpinned buffer is neither leaked nor used after free", "It must call `free(ptr)` and then fall through to `return ptr;` so the caller gets the freed address", "It must ignore the `mlock` failure and leak `ptr` by allocating a second buffer", "It must call `free(ptr)` twice to clear both virtual and physical memory during standard forward and backward execution passes in production during standard forward and backward execution passes in production"], "w": "In `ds_page_aligned_alloc`, if `mlock(ptr, size) != 0` (e.g., the user hit Linux's `ulimit -l` `RLIMIT_MEMLOCK` cap), the function logs the error, calls `free(ptr)`, and returns `nullptr` immediately."}, {"l": 7, "q": "What is the classic **Cross-Stream Use-After-Free** bug in `CUDACachingAllocator` when Tensor `x` is created on `stream_A`, passed to a kernel on `stream_B`, and `del x` runs on the CPU right after?", "o": ["`del x` marks `x`'s block free on `stream_A` immediately, so a new tensor on `stream_A` can reuse and overwrite `x`'s VRAM while `stream_B`'s kernel is still reading `x`!", "The GPU crashes with a blue screen whenever two streams exist in the same process inside the current process virtual address space at runtime inside the current process virtual address space at runtime", "`del x` waits for every stream on all GPUs to finish by calling `cudaDeviceSynchronize()`", "`stream_B` automatically makes a deep copy of `x` on the CPU hard drive"], "w": "Because the CPU finishes queueing `kernel<<<..., stream_B>>>(x)` in microseconds and hits `del x` while `stream_B` is still busy, `CUDACachingAllocator` thinks `x`'s block is safe to reuse on `stream_A`! A new tensor on `stream_A` then stomps on `x`'s bytes mid-kernel!"}, {"l": 7, "q": "How does calling `x.record_stream(stream_B)` in PyTorch prevent that Cross-Stream Use-After-Free bug?", "o": ["It attaches a CUDA event on `stream_B` to `x`'s block so `CUDACachingAllocator` will not hand that block out again until `stream_B` passes that event", "It copies `x` back to the CPU and runs `stream_B`'s kernel in pure Python", "It permanently locks `x`'s VRAM block so it can never be freed for the rest of the program", "It merges `stream_A` and `stream_B` into a single synchronous CPU thread"], "w": "`x.record_stream(stream_B)` tells `CUDACachingAllocator`: 'When `x` is freed, insert a CUDA event on `stream_B` and keep this block in a pending-events list until `cudaEventQuery` confirms `stream_B` has finished using it!'"}, {"l": 7, "q": "What happens if you allocate a CPU tensor `cpu_buf`, launch an async copy `gpu_buf.copy_(cpu_buf, non_blocking=True)`, and immediately overwrite `cpu_buf[0] = 999` on the next Python line?", "o": ["A CPU- vs-DMA race condition: `gpu_buf` may receive `999` instead of the original value because the async DMA copy had not read `cpu_buf[0]` yet!", "`copy_(non_blocking=True)` always finishes copying before returning to Python", "PyTorch raises a `RuntimeError` if you touch `cpu_buf` within 10 minutes of `copy_`", "`gpu_buf` and `cpu_buf` become permanently linked so changing one always changes the other during standard forward and backward execution passes in production"], "w": "With `non_blocking=True` on pinned memory, `copy_` returns to Python while the PCIe DMA engine is still queued! Overwriting or freeing `cpu_buf` before recording/waiting on a stream event corrupts the in-flight transfer."}, {"l": 7, "q": "Why shouldn't you set `pin_memory=True` on every single tensor in your entire program?", "o": ["Pinned memory locks physical RAM pages so the OS cannot swap them out; pinning too much starves the OS and other processes of physical RAM", "Pinned memory is 100x slower for the CPU to read than normal memory inside the current process virtual address space at runtime inside the current process virtual address space at runtime", "Only 1 tensor per computer is allowed to use `pin_memory=True`", "Pinned memory only works with 8-bit integers and corrupts 32-bit floats"], "w": "Page-locked (pinned) host memory is a scarce OS resource (often capped by `RLIMIT_MEMLOCK`) and takes much longer to allocate than regular heap memory. Use a reusable pinned staging buffer (or DataLoader `pin_memory=True` ring) for H2D/D2H transfers."}, {"l": 7, "q": "In CUDA Graphs (`torch.cuda.CUDAGraph`), how are memory addresses handled across graph replays?", "o": ["Every kernel in a captured CUDA Graph has its input/output GPU pointers baked in at capture time, so replaying the graph reads and writes those exact fixed VRAM addresses", "A CUDA Graph calls `cudaMalloc` fresh from the OS on every single replay", "CUDA Graphs move all tensors to random addresses on each replay for security whenever the function executes on a 64-bit CPU or GPU target whenever the function executes on a 64-bit CPU or GPU target", "CUDA Graphs only capture Python `print()` statements and ignore GPU memory"], "w": "Because a captured CUDA Graph bakes raw virtual pointers directly into the recorded command buffer, freeing or reallocating an input/output tensor outside the graph's private memory pool causes a silent GPU Use-After-Free on every replay!"}, {"l": 8, "q": "During LLM text generation, what is the purpose of the KV-Cache (Key/Value Cache)?", "o": ["It stores the Key and Value vectors of all past tokens so generating token `t+1` only computes K/V for the 1 new token instead of recomputing all `t` previous tokens", "It caches the entire English dictionary on the hard drive so the tokenizer runs faster", "It backs up the model's weights to a cloud database after every generated word", "It compresses the user's prompt by deleting every second word before attention runs"], "w": "Without a KV-Cache, generating 1,000 tokens recomputes the past tokens on every step ($O(T^2)$ redundant K/V projections). With a KV-Cache, each step appends 1 new K and V vector to the cache."}, {"l": 8, "q": "In HuggingFace `transformers`, what is the structural difference between `StaticLayer` (`StaticCache`) and `DynamicLayer` (`DynamicCache`)?", "o": ["`StaticLayer` pre-allocates a fixed `[B, H, max_len, D]` buffer and tracks length with `cumulative_length`; `DynamicLayer` grows `self.keys` with `torch.cat` so its length IS `self.keys.shape[-2]`", "`StaticLayer` only works on CPU while `DynamicLayer` only works on NVIDIA GPUs inside the current process virtual address space at runtime inside the current process virtual address space at runtime", "`DynamicLayer` pre-allocates a fixed buffer and `StaticLayer` uses `torch.cat` on every token", "There is no difference; they are two aliases for the exact same class"], "w": "This storage-model difference is the exact root cause of TWO real bugs in your ledger: the `DynamicCache.reset()` bug (`transformers#48509/#48809`) AND the GPT-Neo `StaticCache` local-window bug (`gpt_neo_static_cache_fix.md`)!"}, {"l": 8, "q": "In your `DynamicCache.reset()` finding (`transformers#48509` / `#48809`), why did inheriting `CacheLayerMixin.reset()` (`self.keys.zero_()`, `self.values.zero_()`) corrupt `DynamicLayer`?", "o": ["Zeroing `self.keys` in-place kept its old shape `[B, H, 6, D]` and kept `is_initialized=True`, so `get_seq_length()` still returned `6` and the next prompt `torch.cat`-ed onto 6 stale zero vectors!", "`self.keys.zero_()` threw a `TypeError` because PyTorch tensors do not have a `.zero_()` method", "Zeroing `self.keys` deleted the model's embedding weights on the GPU whenever the function executes on a 64-bit CPU or GPU target whenever the function executes on a 64-bit CPU or GPU target whenever the function executes on a 64-bit CPU or GPU target", "`DynamicLayer.reset()` was never called when `DynamicCache.reset()` ran"], "w": "Because `DynamicLayer` has no separate length counter — its sequence length IS `self.keys.shape[-2]` (`0` only when `not self.is_initialized` or `self.keys is None`) — `.zero_()` left 6 phantom zero-tokens in the cache!"}, {"l": 8, "q": "Even worse: in `QuantizedLayer` (subclass of `DynamicLayer`), what happened after the buggy `.reset()` left `self.is_initialized = True`?", "o": ["On the next `update()`, seeing `is_initialized == True` took the dequantize branch and RESURRECTED the pre-reset `_quantized_keys` history from the previous conversation!", "It crashed immediately with a division-by-zero error inside the quantizer", "It returned all `NaN` values because quantized integers cannot be zeroed", "It worked fine on `QuantizedLayer` and only failed on unquantized `DynamicLayer` during standard forward and backward execution passes in production during standard forward and backward execution passes in production"], "w": "Your `d29d19a` verification on `transformers`: `QuantizedLayer` stored past tokens in `self._quantized_keys` (untouched by `self.keys.zero_()`!). Leaving `is_initialized = True` caused the next conversation to dequantize and leak the previous user's prompt history!"}, {"l": 8, "q": "In your GPT-Neo `StaticCache` bug (`gpt_neo_static_cache_fix.md`), why did `key_length = key.size(-2)` break local sliding-window attention when using `StaticCache`?", "o": ["With `StaticCache`, `key.size(-2)` is always the full pre-allocated `max_cache_len` (e.g. 256), NOT the number of real tokens written so far, placing the causal mask window at the end of the empty buffer!", "`key.size(-2)` returns the head dimension instead of the sequence dimension in GPT-Neo", "`StaticCache` sorts the keys in alphabetical order after every token step", "Local attention does not use keys or values at all"], "w": "In `DynamicCache`, `key.size(-2)` equals the number of tokens seen so far. In `StaticCache`, `key` is pre-allocated to `max_cache_len` (say 256) from step 1! Assuming `key.size(-2)` is the active token count slices the causal mask at `[255:256]` instead of `[0:1]`."}, {"l": 8, "q": "In your `TorchMetrics` `Running` finding (`20261019_053000_torchmetrics-running-state-dict-finding.md`), why did a rolling-window metric give wrong answers after `load_state_dict()`?", "o": ["It saved the ring-buffer tensor `val_list` in `state_dict`, but stored the write cursor / fill count as plain Python attributes that were NOT saved, overwriting the wrong slot on resume!", "`load_state_dict()` reversed the order of `val_list` every time a checkpoint was loaded", "The window size was multiplied by 2 every time `state_dict()` was called whenever the function executes on a 64-bit CPU or GPU target whenever the function executes on a 64-bit CPU or GPU target", "`Running` deleted `val_list` whenever `compute()` was called"], "w": "A ring buffer (circular buffer) is defined by BOTH its backing array AND its write cursor (`window_pos` / `count`). Saving the array without the cursor means resuming after 7 updates resets the cursor to 0 and overwrites the wrong historical entries!"}, {"l": 8, "q": "What is the general 'Storage-Model Mismatch' pattern that connects `DynamicCache.reset()`, `QuantizedLayer.reset()`, `GPT-Neo StaticCache`, and `TorchMetrics Running`?", "o": ["Every buffer has a representation invariant (how length, capacity, and valid slots are tracked); a bug happens whenever `reset()`, `update()`, or `state_dict()` updates the buffer but forgets its companion metadata (or vice versa)", "All four bugs were caused by using 16-bit floats instead of 64-bit floats", "All four bugs only happen when running on Windows without a GPU installed", "Every cache bug can be fixed by adding `torch.cuda.empty_cache()` at the end of `forward()` during standard forward and backward execution passes in production during standard forward and backward execution passes in production during standard forward and backward execution passes in production"], "w": "That is the master systems lesson: a buffer is NEVER just a pointer or tensor — it is a coupled pair `(storage_buffer, validity_metadata)` such as `(keys, is_initialized)`, `(static_buf, cumulative_length)`, or `(ring_buf, write_cursor, count)`. Whenever an operation mutates one half without the other, silent corruption follows!"}, {"l": 8, "q": "According to your Standing Protocols (`Rule M-1`, `Rule M-2`, `Rule F-1`), what must you do before calling any of these memory or cache hypotheses a real `T3`/`T4` finding?", "o": ["Validate the harness with a must-fail control, reproduce end-to-end through the real target API (RED before fix, GREEN after fix), and run the project's test suite", "Read the source code carefully by hand and file the issue immediately as a `T1` static read inside the current process virtual address space at runtime inside the current process virtual address space at runtime", "Ask an LLM whether the code looks buggy and trust its confidence score", "Only window.MLEX = [{"id": "null_guard", "l": 1, "title": "1.1 Unchecked calloc() NULL Dereference (DeepSpeed #8565 & Mosquitto #3762)", "real_bug": "deepspeedai/DeepSpeed#8565 (csrc/cpu/comm/shm.cpp:375-390) & eclipse-mosquitto/mosquitto#3762 (apps/mosquitto_ctrl/ctrl_shell.c:830)", "desc": "In C/C++, `calloc(num_workers, elem_bytes)` asks the operating system for a zeroed heap block. When memory is exhausted (`avail_bytes < num_workers * elem_bytes`), `calloc` returns `NULL` (in our Python model, `None`). The buggy starter code never checks for `NULL` and immediately indexes `workspace[i] = worker_addrs[i]`, crashing with a `SIGSEGV` (`TypeError` in Python). Fix `init_shm_workspace(num_workers, elem_bytes, avail_bytes, worker_addrs)` so that:\n1. If `num_workers <= 0` or `calloc` returns `NULL`/`None` (which happens when `num_workers * elem_bytes > avail_bytes`), it immediately returns `None` (`NULL` in C++).\n2. Otherwise, it copies each `worker_addrs[i]` into `workspace[i]` and returns `workspace`.", "py_name": "init_shm_workspace", "py_starter": "def sim_calloc(count, elem_bytes, avail_bytes):\n    total_bytes = count * elem_bytes\n    if count <= 0 or total_bytes > avail_bytes:\n        return None\n    return [0] * count\n\ndef init_shm_workspace(num_workers, elem_bytes, avail_bytes, worker_addrs):\n    workspace = sim_calloc(num_workers, elem_bytes, avail_bytes)\n    # BUG (DeepSpeed shm.cpp:390): no NULL/None check before writing workspace[i]!\n    for i in range(num_workers):\n        workspace[i] = worker_addrs[i]\n    return workspace\n", "py_sol": "def sim_calloc(count, elem_bytes, avail_bytes):\n    total_bytes = count * elem_bytes\n    if count <= 0 or total_bytes > avail_bytes:\n        return None\n    return [0] * count\n\ndef init_shm_workspace(num_workers, elem_bytes, avail_bytes, worker_addrs):\n    workspace = sim_calloc(num_workers, elem_bytes, avail_bytes)\n    if workspace is None:\n        return None\n    for i in range(num_workers):\n        workspace[i] = worker_addrs[i]\n    return workspace\n", "cpp_name": "init_shm_workspace", "cpp_starter": "// Simulated C++ heap allocator for in-browser execution\nint* sim_calloc(int count, int elem_bytes, int avail_bytes, int* out_buf) {\n    long long total_bytes = (long long)count * (long long)elem_bytes;\n    if (count <= 0 || total_bytes > (long long)avail_bytes) {\n        return NULL;\n    }\n    for (int k = 0; k < count; k++) { out_buf[k] = 0; }\n    return out_buf;\n}\n\nint init_shm_workspace(int num_workers, int elem_bytes, int avail_bytes, const int* worker_addrs, int* backing_buf) {\n    int* workspace = sim_calloc(num_workers, elem_bytes, avail_bytes, backing_buf);\n    // BUG (DeepSpeed shm.cpp:390): workspace is dereferenced without checking if (!workspace)!\n    for (int i = 0; i < num_workers; i++) {\n        workspace[i] = worker_addrs[i];\n    }\n    return 1; // 1 = success, -1 = NULL allocation failure\n}\n", "cpp_sol": "// Simulated C++ heap allocator for in-browser execution\nint* sim_calloc(int count, int elem_bytes, int avail_bytes, int* out_buf) {\n    long long total_bytes = (long long)count * (long long)elem_bytes;\n    if (count <= 0 || total_bytes > (long long)avail_bytes) {\n        return NULL;\n    }\n    for (int k = 0; k < count; k++) { out_buf[k] = 0; }\n    return out_buf;\n}\n\nint init_shm_workspace(int num_workers, int elem_bytes, int avail_bytes, const int* worker_addrs, int* backing_buf) {\n    int* workspace = sim_calloc(num_workers, elem_bytes, avail_bytes, backing_buf);\n    if (workspace == NULL) {\n        return -1;\n    }\n    for (int i = 0; i < num_workers; i++) {\n        workspace[i] = worker_addrs[i];\n    }\n    return 1;\n}\n", "hint": "Check `if workspace is None: return None` (in Python) or `if (workspace == NULL) { return -1; }` (in C++) immediately after `sim_calloc(...)`, BEFORE the `for` loop.", "tests": [{"a": "[3, 8, 64, [101, 102, 103]]", "e": "[101, 102, 103]"}, {"a": "[4, 8, 16, [10, 20, 30, 40]]", "e": "None"}, {"a": "[0, 8, 64, []]", "e": "None"}, {"a": "[2, 16, 32, [777, 888]]", "e": "[777, 888]", "h": 1}, {"a": "[2, 16, 31, [777, 888]]", "e": "None", "h": 1}], "v": [["num_workers (int)", "How many distributed worker processes need a slot in the `workspace` pointer table (`size` in DeepSpeed's `shm_initialize`)."], ["elem_bytes (int)", "Byte size of a single slot in the table (in C++, `sizeof(struct allreduce_workspace*)`, which is 8 bytes on a 64-bit CPU)."], ["avail_bytes (int)", "How many free bytes remain in system heap memory right now. If `num_workers * elem_bytes > avail_bytes`, allocation fails."], ["worker_addrs (list / const int*)", "The shared-memory buffer addresses (`workspace_buf_other` in DeepSpeed) to store into each slot `workspace[i]`."], ["total_bytes (int / long long)", "Total bytes requested from the heap: `count * elem_bytes`. Cast to `long long` in C++ so the multiplication does not overflow 32-bit `int`."], ["workspace (list or None / int*)", "The pointer returned by `sim_calloc`. Holds a valid zeroed array on success, or `None` / `NULL` (address 0) when allocation fails."], ["i (int)", "Loop index stepping through each worker slot from `0` to `num_workers - 1`."]], "lines_py": [["def sim_calloc(count, elem_bytes, avail_bytes):", "Defines `sim_calloc`: models C's `calloc(count, elem_bytes)` against a finite heap budget `avail_bytes`."], ["    total_bytes = count * elem_bytes", "Multiplies element count `count` by per-element byte size `elem_bytes` to compute total requested heap bytes."], ["    if count <= 0 or total_bytes > avail_bytes:", "Checks whether the request is non-positive (`<= 0`) or exceeds remaining free heap (`> avail_bytes`)."], ["        return None", "Models C's `return NULL;`: returns `None` (no memory block) when allocation fails."], ["    return [0] * count", "Models `calloc` zero-initializing all `count` slots of the newly allocated block."], ["def init_shm_workspace(num_workers, elem_bytes, avail_bytes, worker_addrs):", "Entry function mirroring `shm_initialize` in `deepspeed/csrc/cpu/comm/shm.cpp` (`DeepSpeed#8565`)."], ["    workspace = sim_calloc(num_workers, elem_bytes, avail_bytes)", "Requests the zeroed pointer table from `sim_calloc`. `workspace` is now either a list of `num_workers` zeros OR `None`."], ["    if workspace is None:", "THE FIX (CWE-476 NULL guard): Checks for allocation failure BEFORE indexing `workspace[i]`."], ["        return None", "Aborts cleanly and returns `None` (`NULL`) instead of crashing with a `TypeError` / `SIGSEGV`."], ["    for i in range(num_workers):", "Loops `i` from `0` to `num_workers - 1` (safe now because `workspace` is proven non-null)."], ["        workspace[i] = worker_addrs[i]", "Writes worker `i`'s shared-memory address into slot `workspace[i]` (`shm.cpp:390`)."], ["    return workspace", "Returns the initialized `workspace` array to the caller."]], "lines_cpp": [["// Simulated C++ heap allocator for in-browser execution", "Comment header: models `calloc` against a controlled heap budget `avail_bytes` so we can deterministically trigger OOM in tests."], ["int* sim_calloc(int count, int elem_bytes, int avail_bytes, int* out_buf) {", "Defines `sim_calloc`: takes element count `count`, bytes per element `elem_bytes`, available heap `avail_bytes`, and backing storage `out_buf`; returns `int*` (or `NULL` on failure)."], ["    long long total_bytes = (long long)count * (long long)elem_bytes;", "Promotes both `32-bit int` operands to `64-bit long long` before multiplying so `count * elem_bytes` cannot overflow 32 bits."], ["    if (count <= 0 || total_bytes > (long long)avail_bytes) {", "Checks whether the caller asked for `<= 0` elements or more bytes than remain in the heap (`avail_bytes`)."], ["        return NULL;", "Models standard C `calloc` on OOM: returns `NULL` (memory address `0x0`) instead of throwing a C++ exception."], ["    }", "Closes the OOM / invalid-count failure branch."], ["    for (int k = 0; k < count; k++) { out_buf[k] = 0; }", "Models `calloc`'s zero-initialization guarantee: writes `0` into every slot `out_buf[0 .. count-1]`."], ["    return out_buf;", "Returns the valid non-null base pointer `out_buf` to the caller."], ["}", "Ends `sim_calloc`."], ["int init_shm_workspace(int num_workers, int elem_bytes, int avail_bytes, const int* worker_addrs, int* backing_buf) {", "Entry function modeling `shm_initialize` in `deepspeed/csrc/cpu/comm/shm.cpp` (`DeepSpeed#8565`)."], ["    int* workspace = sim_calloc(num_workers, elem_bytes, avail_bytes, backing_buf);", "Requests `num_workers` slots of `elem_bytes` bytes each. `workspace` receives either a valid pointer or `NULL`."], ["    if (workspace == NULL) {", "THE FIX (CWE-476 NULL guard): Explicitly tests if `workspace` is `NULL` before touching `workspace[i]`."], ["        return -1;", "Returns error status `-1` cleanly instead of crashing the process with `SIGSEGV` at address `0x0`."], ["    }", "Closes the `NULL`-check guard block."], ["    for (int i = 0; i < num_workers; i++) {", "Loops `i` across all `num_workers` slots (`0` through `num_workers - 1`)."], ["        workspace[i] = worker_addrs[i];", "Dereferences `workspace + i` to store worker `i`'s shared-memory address (`shm.cpp:390`). Safe now because `workspace != NULL`."], ["    }", "Ends the worker table initialization loop."], ["    return 1;", "Returns `1` indicating `workspace` was allocated and populated without error."], ["}", "Ends `init_shm_workspace`."]]}, {"id": "compound_guard", "l": 1, "title": "1.2 Compound Multi-Buffer Allocation & Partial-OOM Cleanup (DeepSpeed #8565 Commit 2)", "real_bug": "deepspeedai/DeepSpeed#8565 (shm.cpp:375-384 — 5 sibling calloc() calls needing a compound guard + cleanup)", "desc": "In `DeepSpeed#8565`, `shm_initialize` actually made 5 sibling `calloc()` calls in one block (`workspace`, `symmetric_buffer[0]`, `symmetric_buffer[1]`, etc.). When a function allocates multiple buffers in sequence (`buf_sizes = [sz0, sz1, ...]`) from a heap with `avail_bytes` free:\n- Allocation `i` succeeds if `sz_i > 0` and `used_bytes + sz_i <= avail_bytes` (consuming `sz_i` bytes from the heap).\n- If ANY allocation in `buf_sizes` fails (say buffer #2 exceeds remaining `avail_bytes`), you cannot just return early! Buffers #0 and #1 were already allocated and MUST be freed, or you leak them!\nWrite `alloc_all_or_cleanup(buf_sizes, avail_bytes)` that returns `[ok, active_allocs, bytes_leaked]`:\n- If every buffer in `buf_sizes` fits within `avail_bytes` (and every `sz > 0`), return `[True, len(buf_sizes), 0]`.\n- If any buffer fails (`sz <= 0` or not enough `avail_bytes` left), free all previously allocated buffers in that call and return `[False, 0, 0]`. (The buggy starter forgets to free earlier buffers on partial failure, returning non-zero `bytes_leaked`!)", "py_name": "alloc_all_or_cleanup", "py_starter": "def alloc_all_or_cleanup(buf_sizes, avail_bytes):\n    allocated = []\n    used_bytes = 0\n    for sz in buf_sizes:\n        if sz <= 0 or used_bytes + sz > avail_bytes:\n            # BUG: returns False on partial OOM without freeing earlier buffers in `allocated`!\n            return [False, len(allocated), used_bytes]\n        allocated.append(sz)\n        used_bytes += sz\n    return [True, len(allocated), 0]\n", "py_sol": "def alloc_all_or_cleanup(buf_sizes, avail_bytes):\n    allocated = []\n    used_bytes = 0\n    for sz in buf_sizes:\n        if sz <= 0 or used_bytes + sz > avail_bytes:\n            while len(allocated) > 0:\n                freed_sz = allocated.pop()\n                used_bytes -= freed_sz\n            return [False, len(allocated), used_bytes]\n        allocated.append(sz)\n        used_bytes += sz\n    return [True, len(allocated), 0]\n", "cpp_name": "alloc_all_or_cleanup", "cpp_starter": "void alloc_all_or_cleanup(const int* buf_sizes, int n_bufs, int avail_bytes, int* out_status) {\n    int active_count = 0;\n    int used_bytes = 0;\n    for (int i = 0; i < n_bufs; i++) {\n        int sz = buf_sizes[i];\n        if (sz <= 0 || used_bytes + sz > avail_bytes) {\n            // BUG: returns on partial OOM without freeing the `active_count` buffers already allocated!\n            out_status[0] = 0;\n            out_status[1] = active_count;\n            out_status[2] = used_bytes;\n            return;\n        }\n        active_count += 1;\n        used_bytes += sz;\n    }\n    out_status[0] = 1;\n    out_status[1] = active_count;\n    out_status[2] = 0;\n}\n", "cpp_sol": "void alloc_all_or_cleanup(const int* buf_sizes, int n_bufs, int avail_bytes, int* out_status) {\n    int active_count = 0;\n    int used_bytes = 0;\n    for (int i = 0; i < n_bufs; i++) {\n        int sz = buf_sizes[i];\n        if (sz <= 0 || used_bytes + sz > avail_bytes) {\n            for (int j = 0; j < i; j++) {\n                active_count -= 1;\n                used_bytes -= buf_sizes[j];\n            }\n            out_status[0] = 0;\n            out_status[1] = active_count;\n            out_status[2] = used_bytes;\n            return;\n        }\n        active_count += 1;\n        used_bytes += sz;\n    }\n    out_status[0] = 1;\n    out_status[1] = active_count;\n    out_status[2] = 0;\n}\n", "hint": "Inside the failure `if` branch (`sz <= 0 or used_bytes + sz > avail_bytes`), unwind/clear `allocated` and subtract each freed size from `used_bytes` (so `len(allocated)` and `used_bytes` both become `0`) before returning `[False, len(allocated), used_bytes]`.", "tests": [{"a": "[[16, 16, 16], 64]", "e": "[True, 3, 0]"}, {"a": "[[16, 16, 32], 40]", "e": "[False, 0, 0]"}, {"a": "[[32, 0, 16], 64]", "e": "[False, 0, 0]"}, {"a": "[[10, 20, 30, 40], 100]", "e": "[True, 4, 0]", "h": 1}, {"a": "[[10, 20, 30, 40], 99]", "e": "[False, 0, 0]", "h": 1}], "v": [["buf_sizes (list[int] / const int*)", "Byte sizes of the sibling buffers that must all be allocated together (like `workspace`, `symmetric_buffer[0..1]`, `ernie_buffer[0..1]` in DeepSpeed)."], ["avail_bytes (int)", "Total free heap bytes available before the first allocation starts."], ["allocated (list[int]) / active_count (int)", "Tracks each buffer that has already been allocated so far during this call."], ["used_bytes (int)", "Running sum of heap bytes currently held by `allocated` buffers."], ["sz (int)", "Size in bytes of the current buffer being requested in the loop."], ["freed_sz (int)", "Size of a previously allocated buffer being released during partial-OOM rollback."]], "lines_py": [["def alloc_all_or_cleanup(buf_sizes, avail_bytes):", "Allocates all sibling buffers in `buf_sizes` within `avail_bytes`, or rolls back all earlier allocations if any one fails."], ["    allocated = []", "List tracking the byte sizes of buffers currently live on the heap during this call."], ["    used_bytes = 0", "Running total of heap bytes consumed by live buffers in `allocated`."], ["    for sz in buf_sizes:", "Attempts to allocate each sibling buffer `sz` in sequence (like the 5 `calloc` calls in `DeepSpeed#8565`)."], ["        if sz <= 0 or used_bytes + sz > avail_bytes:", "Detects if the current allocation request `sz` is invalid or exceeds remaining heap `avail_bytes - used_bytes`."], ["            while len(allocated) > 0:", "THE FIX: Loops over all previously allocated buffers that succeeded before this failure."], ["                freed_sz = allocated.pop()", "Models `free(buf_j)`: pops the buffer from the active list."], ["                used_bytes -= freed_sz", "Returns `freed_sz` bytes back to the heap so `used_bytes` returns to `0`."], ["            return [False, len(allocated), used_bytes]", "Returns `[False, 0, 0]`: partial OOM handled cleanly with 0 dangling buffers and 0 leaked bytes."], ["        allocated.append(sz)", "Allocation succeeded: records `sz` as a live heap buffer."], ["        used_bytes += sz", "Adds `sz` to total heap bytes currently in use."], ["    return [True, len(allocated), 0]", "All sibling buffers succeeded: returns `[True, len(buf_sizes), 0]`."]], "lines_cpp": [["void alloc_all_or_cleanup(const int* buf_sizes, int n_bufs, int avail_bytes, int* out_status) {", "Allocates `n_bufs` sibling buffers (`buf_sizes[0..n_bufs-1]`) all-or-nothing within `avail_bytes`, writing `[ok, active_count, used_bytes]` into `out_status`."], ["    int active_count = 0;", "Initializes count of currently live heap buffers to `0`."], ["    int used_bytes = 0;", "Initializes total heap bytes consumed by live buffers to `0`."], ["    for (int i = 0; i < n_bufs; i++) {", "Steps `i` through each sibling buffer allocation request (like the 5 `calloc` calls in `DeepSpeed#8565`)."], ["        int sz = buf_sizes[i];", "Reads the requested byte size `sz` for sibling buffer `i`."], ["        if (sz <= 0 || used_bytes + sz > avail_bytes) {", "Checks if allocation `i` fails (`sz <= 0` or `used_bytes + sz` exceeds `avail_bytes`)."], ["            for (int j = 0; j < i; j++) {", "THE FIX: Walks backwards/forwards over every prior buffer `j` (`0 .. i-1`) that ALREADY succeeded before buffer `i` failed."], ["                active_count -= 1;", "Models calling `free(buf[j])`: decrements the live buffer count."], ["                used_bytes -= buf_sizes[j];", "Reclaims `buf_sizes[j]` bytes back to the heap so zero bytes leak on partial OOM."], ["            }", "Ends the rollback cleanup loop (`active_count` and `used_bytes` are both back to `0`)."], ["            out_status[0] = 0;", "Records `ok = 0` (`False`) in `out_status[0]`."], ["            out_status[1] = active_count;", "Records `0` dangling active allocations in `out_status[1]`."], ["            out_status[2] = used_bytes;", "Records `0` leaked heap bytes in `out_status[2]`."], ["            return;", "Exits early after full cleanup."], ["        }", "Closes the partial-OOM failure branch."], ["        active_count += 1;", "Buffer `i` succeeded: increments live allocation count."], ["        used_bytes += sz;", "Adds `sz` to total heap bytes currently in use."], ["    }", "Ends the loop over all `n_bufs` sibling buffers."], ["    out_status[0] = 1;", "All `n_bufs` buffers succeeded: writes `ok = 1` (`True`)."], ["    out_status[1] = active_count;", "Writes total live buffers (`n_bufs`) to `out_status[1]`."], ["    out_status[2] = 0;", "Writes `0` leaked bytes to `out_status[2]`."], ["}", "Ends `alloc_all_or_cleanup`."]]}, {"id": "reassigned_leak", "l": 2, "title": "2.1 Pointer Reassigned Before free() (DeepSpeed #8565 Commit 1)", "real_bug": "deepspeedai/DeepSpeed#8565 (csrc/cpu/comm/shm.cpp:362-365 — workspace_buf malloc overwritten by mmap pointer)", "desc": "In `deepspeedai/DeepSpeed#8565` (`csrc/cpu/comm/shm.cpp:362-365`), `shm_initialize` did:\n```cpp\nworkspace_buf = (struct allreduce_workspace*)malloc(sizeof(struct allreduce_workspace)); // line 362\nshared_create(&allreduce_buffer, ..., workspace_buf, ...); // line 364: writes bytes to shm fd\nworkspace_buf = (struct allreduce_workspace*)allreduce_buffer.bytes; // line 365: OVERWRITES pointer!\n```\nBecause `workspace_buf` was reassigned at line 365 without calling `free(workspace_buf)` first, the heap block from line 362 was permanently leaked! In `setup_shared_workspace(init_val, shm_mapped_val, heap_bytes_used, block_bytes)`, we allocate a temporary staging block of `block_bytes` (adding `block_bytes` to `heap_bytes_used`), copy `init_val` into shared memory, and then point `workspace_buf` at the shared-memory value `shm_mapped_val`. Fix the function so the temporary heap staging block is freed (`heap_bytes_used` decremented by `block_bytes`) BEFORE `workspace_buf` is reassigned to `shm_mapped_val`, returning `[workspace_buf, synced_to_shm, heap_bytes_used]`.", "py_name": "setup_shared_workspace", "py_starter": "def setup_shared_workspace(init_val, shm_mapped_val, heap_bytes_used, block_bytes):\n    # Line 362: malloc temporary staging block on the heap\n    workspace_buf = init_val\n    heap_bytes_used += block_bytes\n    # Line 364: shared_create copies staging block contents into shared memory\n    synced_to_shm = workspace_buf\n    # BUG (Line 365 of shm.cpp): reassigns workspace_buf without freeing the staging block first!\n    workspace_buf = shm_mapped_val\n    return [workspace_buf, synced_to_shm, heap_bytes_used]\n", "py_sol": "def setup_shared_workspace(init_val, shm_mapped_val, heap_bytes_used, block_bytes):\n    # Line 362: malloc temporary staging block on the heap\n    workspace_buf = init_val\n    heap_bytes_used += block_bytes\n    # Line 364: shared_create copies staging block contents into shared memory\n    synced_to_shm = workspace_buf\n    # FIX: free(workspace_buf) before reassigning workspace_buf to the shared-memory mapping!\n    heap_bytes_used -= block_bytes\n    workspace_buf = shm_mapped_val\n    return [workspace_buf, synced_to_shm, heap_bytes_used]\n", "cpp_name": "setup_shared_workspace", "cpp_starter": "void setup_shared_workspace(int init_val, int shm_mapped_val, int heap_bytes_used, int block_bytes, int* out_res) {\n    int workspace_buf = init_val;\n    heap_bytes_used += block_bytes; // malloc(sizeof(allreduce_workspace))\n    int synced_to_shm = workspace_buf; // shared_create(..., workspace_buf, ...)\n    // BUG (shm.cpp:365): overwrites workspace_buf without free(workspace_buf)!\n    workspace_buf = shm_mapped_val;\n    out_res[0] = workspace_buf;\n    out_res[1] = synced_to_shm;\n    out_res[2] = heap_bytes_used;\n}\n", "cpp_sol": "void setup_shared_workspace(int init_val, int shm_mapped_val, int heap_bytes_used, int block_bytes, int* out_res) {\n    int workspace_buf = init_val;\n    heap_bytes_used += block_bytes; // malloc(sizeof(allreduce_workspace))\n    int synced_to_shm = workspace_buf; // shared_create(..., workspace_buf, ...)\n    // FIX: free(workspace_buf) right after shared_create, before reassigning workspace_buf\n    heap_bytes_used -= block_bytes;\n    workspace_buf = shm_mapped_val;\n    out_res[0] = workspace_buf;\n    out_res[1] = synced_to_shm;\n    out_res[2] = heap_bytes_used;\n}\n", "hint": "Right after `synced_to_shm = workspace_buf` (and before `workspace_buf = shm_mapped_val`), free the temporary heap staging block by subtracting `block_bytes`: `heap_bytes_used -= block_bytes`.", "tests": [{"a": "[42, 99, 0, 128]", "e": "[99, 42, 0]"}, {"a": "[7, 500, 1024, 256]", "e": "[500, 7, 1024]"}, {"a": "[1, 2, 64, 64]", "e": "[2, 1, 64]", "h": 1}], "v": [["init_val (int)", "Initial value written into the temporary heap staging buffer (`workspace_buf` at line 362 of `shm.cpp`)."], ["shm_mapped_val (int)", "Value living inside the `mmap`-ed shared memory buffer (`allreduce_buffer.bytes` at line 365 of `shm.cpp`)."], ["heap_bytes_used (int)", "Total heap bytes currently allocated by the process before and after this function runs."], ["block_bytes (int)", "Size in bytes of `struct allreduce_workspace` allocated by `malloc`."], ["workspace_buf (int)", "The pointer variable that first holds the `malloc` staging buffer and is then reassigned to point at `allreduce_buffer.bytes`."], ["synced_to_shm (int)", "Captures the staging value that `shared_create` wrote into the shared-memory file descriptor."]], "lines_py": [["def setup_shared_workspace(init_val, shm_mapped_val, heap_bytes_used, block_bytes):", "Models `shm_initialize` in `deepspeed/csrc/cpu/comm/shm.cpp:362-365` (`DeepSpeed#8565` Commit 1)."], ["    # Line 362: malloc temporary staging block on the heap", "Comment marking line 362 of `shm.cpp` where `workspace_buf` is first allocated via `malloc`."], ["    workspace_buf = init_val", "Models `workspace_buf = (struct allreduce_workspace*)malloc(sizeof(struct allreduce_workspace))`."], ["    heap_bytes_used += block_bytes", "Charges `block_bytes` to the process heap for the temporary staging buffer."], ["    # Line 364: shared_create copies staging block contents into shared memory", "Comment marking line 364 where `shared_create` writes `workspace_buf` contents to the shm file descriptor."], ["    synced_to_shm = workspace_buf", "Copies the staging data into shared memory (`shared_create` does not keep or free `workspace_buf`)."], ["    # FIX: free(workspace_buf) before reassigning workspace_buf to the shared-memory mapping!", "Comment explaining why freeing before pointer reassignment prevents CWE-401."], ["    heap_bytes_used -= block_bytes", "THE FIX (`free(workspace_buf);`): Releases the heap staging block BEFORE `workspace_buf` is reassigned."], ["    workspace_buf = shm_mapped_val", "Line 365: Reassigns `workspace_buf = (struct allreduce_workspace*)allreduce_buffer.bytes`."], ["    return [workspace_buf, synced_to_shm, heap_bytes_used]", "Returns `[shm_mapped_val, init_val, original_heap_bytes_used]` with zero leaked bytes."]], "lines_cpp": [["void setup_shared_workspace(int init_val, int shm_mapped_val, int heap_bytes_used, int block_bytes, int* out_res) {", "Models `shm_initialize` in `deepspeed/csrc/cpu/comm/shm.cpp:362-365` (`DeepSpeed#8565` Commit 1)."], ["    int workspace_buf = init_val;", "Line 362 of `shm.cpp`: `workspace_buf = (struct allreduce_workspace*)malloc(sizeof(struct allreduce_workspace))`."], ["    heap_bytes_used += block_bytes; // malloc(sizeof(allreduce_workspace))", "Charges `block_bytes` to the process heap for the temporary staging buffer."], ["    int synced_to_shm = workspace_buf; // shared_create(..., workspace_buf, ...)", "Line 364 of `shm.cpp`: `shared_create` writes the contents of `workspace_buf` into the shared-memory file descriptor."], ["    // FIX: free(workspace_buf) right after shared_create, before reassigning workspace_buf", "Explanatory comment: `shared_create` neither stores nor frees `workspace_buf`, so we must free the staging block now."], ["    heap_bytes_used -= block_bytes;", "THE FIX (`free(workspace_buf);`): Releases the heap staging block BEFORE `workspace_buf` is overwritten on the next line."], ["    workspace_buf = shm_mapped_val;", "Line 365 of `shm.cpp`: Reassigns `workspace_buf` to `(struct allreduce_workspace*)allreduce_buffer.bytes`."
