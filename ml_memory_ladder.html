], ["    out_res[0] = workspace_buf;", "Stores the final `workspace_buf` value (`shm_mapped_val`) in `out_res[0]`."], ["    out_res[1] = synced_to_shm;", "Stores the value synced into shared memory (`init_val`) in `out_res[1]`."], ["    out_res[2] = heap_bytes_used;", "Stores net `heap_bytes_used` in `out_res[2]` (zero leaked bytes!)."], ["}", "Ends `setup_shared_workspace`."]]}, {"id": "loop_scratch_leak", "l": 2, "title": "2.2 Per-Step Scratch Allocation Leak vs. Reusable Workspace Growth", "real_bug": "Reagent C05 loop-reassignment leak pattern & inference workspace pooling", "desc": "During autoregressive LLM decoding, each step `i` requests a scratch buffer of `step_bytes[i]` bytes. The buggy starter allocates a brand-new buffer on every step and overwrites `workspace_cap = req` without freeing the previous step's buffer, accumulating `total_allocated += req` on every single token! Fix `run_step_workspace(step_bytes)` to implement a **reusable high-water-mark workspace**:\n- Maintain `workspace_cap` (initially `0`) and `live_bytes` (initially `0`, the currently allocated workspace size) and `realloc_count` (initially `0`).\n- On each step `req` in `step_bytes`: if `req > workspace_cap`, free the old workspace (if any), allocate a new one of size `req` (so `workspace_cap = req`, `live_bytes = req`, and `realloc_count += 1`). If `req <= workspace_cap`, reuse the existing workspace without allocating (`realloc_count` unchanged, `live_bytes` stays `workspace_cap`).\n- Return `[live_bytes, realloc_count]` after all steps finish.", "py_name": "run_step_workspace", "py_starter": "def run_step_workspace(step_bytes):\n    workspace_cap = 0\n    live_bytes = 0\n    realloc_count = 0\n    for req in step_bytes:\n        # BUG: allocates a new buffer every step and leaks the old one!\n        workspace_cap = req\n        live_bytes += req\n        realloc_count += 1\n    return [live_bytes, realloc_count]\n", "py_sol": "def run_step_workspace(step_bytes):\n    workspace_cap = 0\n    live_bytes = 0\n    realloc_count = 0\n    for req in step_bytes:\n        if req > workspace_cap:\n            live_bytes -= workspace_cap\n            workspace_cap = req\n            live_bytes += workspace_cap\n            realloc_count += 1\n    return [live_bytes, realloc_count]\n", "cpp_name": "run_step_workspace", "cpp_starter": "void run_step_workspace(const int* step_bytes, int n_steps, int* out_res) {\n    int workspace_cap = 0;\n    int live_bytes = 0;\n    int realloc_count = 0;\n    for (int i = 0; i < n_steps; i++) {\n        int req = step_bytes[i];\n        // BUG: allocates on every step without freeing or reusing workspace!\n        workspace_cap = req;\n        live_bytes += req;\n        realloc_count += 1;\n    }\n    out_res[0] = live_bytes;\n    out_res[1] = realloc_count;\n}\n", "cpp_sol": "void run_step_workspace(const int* step_bytes, int n_steps, int* out_res) {\n    int workspace_cap = 0;\n    int live_bytes = 0;\n    int realloc_count = 0;\n    for (int i = 0; i < n_steps; i++) {\n        int req = step_bytes[i];\n        if (req > workspace_cap) {\n            live_bytes -= workspace_cap;\n            workspace_cap = req;\n            live_bytes += workspace_cap;\n            realloc_count += 1;\n        }\n    }\n    out_res[0] = live_bytes;\n    out_res[1] = realloc_count;\n}\n", "hint": "Only reallocate when `req > workspace_cap`. Inside `if req > workspace_cap:`, subtract the old `workspace_cap` from `live_bytes` (freeing the old block), set `workspace_cap = req`, add the new `workspace_cap` to `live_bytes`, and increment `realloc_count`.", "tests": [{"a": "[[128, 128, 128, 128]]", "e": "[128, 1]"}, {"a": "[[64, 128, 96, 256, 128]]", "e": "[256, 3]"}, {"a": "[[]]", "e": "[0, 0]"}, {"a": "[[512, 256, 128]]", "e": "[512, 1]", "h": 1}], "v": [["step_bytes (list[int] / const int*)", "Scratch buffer byte sizes needed on each inference step `i`."], ["workspace_cap (int)", "Current capacity (in bytes) of the reusable scratch buffer."], ["live_bytes (int)", "Total heap bytes currently held by our process (must equal `workspace_cap`, never the sum of all steps!)."], ["realloc_count (int)", "How many times we had to call `free` + `malloc` to grow the workspace."], ["req (int)", "Scratch bytes required by the current step."]], "lines_py": [["def run_step_workspace(step_bytes):", "Manages a reusable scratch buffer across `len(step_bytes)` inference steps."], ["    workspace_cap = 0", "Current capacity in bytes of the reusable scratch workspace (`0` before first step)."], ["    live_bytes = 0", "Current heap bytes occupied by the workspace (`0` initially)."], ["    realloc_count = 0", "Counts how many times we had to allocate/reallocate on the heap."], ["    for req in step_bytes:", "Iterates over each inference step's scratch size requirement `req`."], ["        if req > workspace_cap:", "THE FIX: Only reallocates when `req` exceeds the existing `workspace_cap`."], ["            live_bytes -= workspace_cap", "Frees the old smaller workspace buffer so it is not leaked on reassignment."], ["            workspace_cap = req", "Updates `workspace_cap` to the new high-water mark `req`."], ["            live_bytes += workspace_cap", "Allocates the new `workspace_cap`-byte buffer on the heap."], ["            realloc_count += 1", "Increments `realloc_count` (steps with `req <= workspace_cap` reuse the buffer with 0 allocations)."], ["    return [live_bytes, realloc_count]", "Returns `[live_bytes, realloc_count]` at the end of all steps."]], "lines_cpp": [["void run_step_workspace(const int* step_bytes, int n_steps, int* out_res) {", "Simulates a reusable scratch workspace across `n_steps` inference steps."], ["    int workspace_cap = 0;", "Current capacity in bytes of the reusable workspace buffer (initially `0`)."], ["    int live_bytes = 0;", "Heap bytes currently allocated for the workspace (initially `0`)."], ["    int realloc_count = 0;", "Counts how many times the workspace had to be reallocated."], ["    for (int i = 0; i < n_steps; i++) {", "Loops over each inference step `i` from `0` to `n_steps - 1`."], ["        int req = step_bytes[i];", "Reads the scratch byte size `req` needed on step `i`."], ["        if (req > workspace_cap) {", "THE FIX: Only reallocates when step `i` needs more bytes than the current `workspace_cap`."], ["            live_bytes -= workspace_cap;", "Calls `free(workspace)` on the previous smaller buffer so it is not leaked when we grow."], ["            workspace_cap = req;", "Updates `workspace_cap` to the new high-water mark `req`."], ["            live_bytes += workspace_cap;", "Allocates the new `workspace_cap`-byte buffer on the heap."], ["            realloc_count += 1;", "Increments the reallocation counter."], ["        }", "Closes the growth branch (when `req <= workspace_cap`, the existing buffer is reused in 0 allocations!)."], ["    }", "Ends the step loop."], ["    out_res[0] = live_bytes;", "Writes final `live_bytes` (`== max(step_bytes)`) to `out_res[0]`."], ["    out_res[1] = realloc_count;", "Writes total `realloc_count` to `out_res[1]`."], ["}", "Ends `run_step_workspace`."]]}, {"id": "early_exit_uaf", "l": 3, "title": "3.1 Missing return After Early-Exit free() -> UAF + Double-Free (CFEngine #6358)", "real_bug": "cfengine/core#6358 (libpromises/dbm_test_api.c — RemoveFilament missing return after early-exit free)", "desc": "In `cfengine/core#6358` (`libpromises/dbm_test_api.c`), `RemoveFilament` had an early-exit check for an empty filament:\n```c\nif (StringSetSize(filament->items) == 0) {\n    StringSetDestroy(filament->items);\n    free(filament);\n    // BUG: missing `return;` here!\n}\nbool success = OpenDB(&db, filament->db_id); // USE-AFTER-FREE read of filament->db_id!\n...\nStringSetDestroy(filament->items);\nfree(filament); // DOUBLE-FREE of filament and filament->items!\n```\nWrite `remove_filament(item_count, db_id)` that tracks `[freed_count, uaf_reads, db_opened]`:\n- When `item_count == 0`, destroy/free the filament (`freed_count += 1`) and **return immediately** `[freed_count, uaf_reads, db_opened]` (which is `[1, 0, 0]`).\n- When `item_count > 0`, open the DB (if `freed_count > 0`, increment `uaf_reads += 1`; set `db_opened = db_id`), then free the filament (`freed_count += 1`) and return `[freed_count, uaf_reads, db_opened]`.", "py_name": "remove_filament", "py_starter": "def remove_filament(item_count, db_id):\n    freed_count = 0\n    uaf_reads = 0\n    db_opened = 0\n    if item_count == 0:\n        freed_count += 1\n        # BUG (cfengine/core#6358): missing return after early-exit free!\n    if freed_count > 0:\n        uaf_reads += 1\n    db_opened = db_id\n    freed_count += 1\n    return [freed_count, uaf_reads, db_opened]\n", "py_sol": "def remove_filament(item_count, db_id):\n    freed_count = 0\n    uaf_reads = 0\n    db_opened = 0\n    if item_count == 0:\n        freed_count += 1\n        return [freed_count, uaf_reads, db_opened]\n    if freed_count > 0:\n        uaf_reads += 1\n    db_opened = db_id\n    freed_count += 1\n    return [freed_count, uaf_reads, db_opened]\n", "cpp_name": "remove_filament", "cpp_starter": "void remove_filament(int item_count, int db_id, int* out_res) {\n    int freed_count = 0;\n    int uaf_reads = 0;\n    int db_opened = 0;\n    if (item_count == 0) {\n        freed_count += 1;\n        // BUG (cfengine/core#6358): missing return after early-exit free!\n    }\n    if (freed_count > 0) {\n        uaf_reads += 1;\n    }\n    db_opened = db_id;\n    freed_count += 1;\n    out_res[0] = freed_count;\n    out_res[1] = uaf_reads;\n    out_res[2] = db_opened;\n}\n", "cpp_sol": "void remove_filament(int item_count, int db_id, int* out_res) {\n    int freed_count = 0;\n    int uaf_reads = 0;\n    int db_opened = 0;\n    if (item_count == 0) {\n        freed_count += 1;\n        out_res[0] = freed_count;\n        out_res[1] = uaf_reads;\n        out_res[2] = db_opened;\n        return;\n    }\n    if (freed_count > 0) {\n        uaf_reads += 1;\n    }\n    db_opened = db_id;\n    freed_count += 1;\n    out_res[0] = freed_count;\n    out_res[1] = uaf_reads;\n    out_res[2] = db_opened;\n}\n", "hint": "Inside `if item_count == 0:`, right after `freed_count += 1`, return `[freed_count, uaf_reads, db_opened]` (or write `out_res` and `return;` in C++) so execution does not fall through to the rest of the function.", "tests": [{"a": "[0, 7]", "e": "[1, 0, 0]"}, {"a": "[5, 7]", "e": "[1, 0, 7]"}, {"a": "[0, 99]", "e": "[1, 0, 0]", "h": 1}, {"a": "[1, 42]", "e": "[1, 0, 42]", "h": 1}], "v": [["item_count (int)", "Number of items in `filament->items` (`StringSetSize(filament->items)` in CFEngine)."], ["db_id (int)", "Database identifier field `filament->db_id` stored inside the heap struct `filament`."], ["freed_count (int)", "How many times `free(filament)` has been called (`1` = clean single free; `2` = CWE-415 double-free!)."], ["uaf_reads (int)", "How many times `filament->db_id` was read AFTER `filament` was already freed (`> 0` = CWE-416 use-after-free!)."], ["db_opened (int)", "Which `db_id` was passed to `OpenDB` (`0` if the empty filament exited early as intended)."]], "lines_py": [["def remove_filament(item_count, db_id):", "Models `RemoveFilament` in `cfengine/core#6358` (`libpromises/dbm_test_api.c`)."], ["    freed_count = 0", "Counter tracking how many times `free(filament)` has executed."], ["    uaf_reads = 0", "Counter tracking Use-After-Free reads of `filament->db_id` after `free(filament)`."], ["    db_opened = 0", "Tracks which `db_id` was passed to `OpenDB` (`0` if skipped)."], ["    if item_count == 0:", "Early-exit condition when `StringSetSize(filament->items) == 0`."], ["        freed_count += 1", "Destroys `filament->items` and calls `free(filament)`."], ["        return [freed_count, uaf_reads, db_opened]", "THE FIX (`cfengine/core#6358`): Returns immediately after freeing so execution cannot fall through to `OpenDB` (UAF) and the final `free(filament)` (double-free)!"], ["    if freed_count > 0:", "Detects if `filament` was already freed before reaching `OpenDB(&db, filament->db_id)`."], ["        uaf_reads += 1", "Increments `uaf_reads` if the early-exit branch fell through without returning."], ["    db_opened = db_id", "Opens `filament->db_id` on the normal non-empty path."], ["    freed_count += 1", "Normal end-of-function `free(filament)`."], ["    return [freed_count, uaf_reads, db_opened]", "Returns `[1, 0, db_id]` on the normal path."]], "lines_cpp": [["void remove_filament(int item_count, int db_id, int* out_res) {", "Models `RemoveFilament` in `cfengine/core#6358` (`libpromises/dbm_test_api.c`)."], ["    int freed_count = 0;", "Tracks how many times `free(filament)` has been called."], ["    int uaf_reads = 0;", "Tracks Use-After-Free reads of `filament->db_id` after `free(filament)`."], ["    int db_opened = 0;", "Records whether `OpenDB(&db, filament->db_id)` ran."], ["    if (item_count == 0) {", "Early-exit branch when `StringSetSize(filament->items) == 0`."], ["        freed_count += 1;", "Runs `StringSetDestroy(filament->items); free(filament);`."], ["        out_res[0] = freed_count;", "Writes `freed_count = 1` into `out_res[0]`."], ["        out_res[1] = uaf_reads;", "Writes `uaf_reads = 0` into `out_res[1]`."], ["        out_res[2] = db_opened;", "Writes `db_opened = 0` into `out_res[2]`."], ["        return;", "THE FIX (`cfengine/core#6358`): Returns immediately so execution cannot fall through to `OpenDB` (UAF) and the second `free(filament)` (double-free)!"], ["    }", "Closes the `item_count == 0` early-exit block."], ["    if (freed_count > 0) {", "Checks if `filament` was already freed when reaching `OpenDB(&db, filament->db_id)`."], ["        uaf_reads += 1;", "Flags a CWE-416 Use-After-Free read if the early-exit branch forgot to return."], ["    }", "Closes the UAF detector check."], ["    db_opened = db_id;", "Models `OpenDB(&db, filament->db_id)` reading `db_id` from the live `filament` struct."], ["    freed_count += 1;", "Normal end-of-function `StringSetDestroy(filament->items); free(filament);`."], ["    out_res[0] = freed_count;", "Writes `freed_count` (`1`) to `out_res[0]`."], ["    out_res[1] = uaf_reads;", "Writes `uaf_reads` (`0`) to `out_res[1]`."], ["    out_res[2] = db_opened;", "Writes `db_opened` (`db_id`) to `out_res[2]`."], ["}", "Ends `remove_filament`."]]}, {"id": "tensor_view_uaf", "l": 3, "title": "3.2 Dangling Tensor View Pointer After Backing Storage Reallocation", "real_bug": "PyTorch C++ TensorImpl / Storage resize_() dangling data_ptr view hazard", "desc": "In C++ tensor libraries (like ATen / PyTorch), a tensor `view` does not own its own array; it stores a pointer to the backing `Storage` buffer plus an `offset` and `length`. When `storage` is resized to `new_total_len` (because a cache or tensor grew), the allocator allocates a brand-new buffer of length `new_total_len` (copying old values and zero-filling new slots) and **frees the old buffer**! If `view` still reads from its saved `old_storage_ref` instead of rebinding to the newly reallocated `storage`, reading the view accesses freed memory (or stale values written before an update to the new storage). Fix `resize_and_read_view(init_data, new_total_len, write_idx, write_val, view_offset, view_len)` so that after `storage` is reallocated to `new_total_len` and `storage[write_idx] = write_val` is written, the slice is read from the **new** `storage` at `[view_offset : view_offset + view_len]` (and not from the freed `old_storage`!).", "py_name": "resize_and_read_view", "py_starter": "def resize_and_read_view(init_data, new_total_len, write_idx, write_val, view_offset, view_len):\n    storage = list(init_data)\n    # A view caches a reference to the backing storage buffer BEFORE resize\n    view_backing = storage\n    if new_total_len > len(storage):\n        # Reallocates a new buffer and frees the old one (marked with -999999 poison)\n        new_storage = storage + [0] * (new_total_len - len(storage))\n        for k in range(len(storage)):\n            storage[k] = -999999  # ASan poison on freed old storage!\n        storage = new_storage\n    storage[write_idx] = write_val\n    # BUG: view_backing still points at the old freed (poisoned) storage buffer!\n    return view_backing[view_offset : view_offset + view_len]\n", "py_sol": "def resize_and_read_view(init_data, new_total_len, write_idx, write_val, view_offset, view_len):\n    storage = list(init_data)\n    view_backing = storage\n    if new_total_len > len(storage):\n        new_storage = storage + [0] * (new_total_len - len(storage))\n        for k in range(len(storage)):\n            storage[k] = -999999  # ASan poison on freed old storage!\n        storage = new_storage\n        view_backing = storage\n    storage[write_idx] = write_val\n    return view_backing[view_offset : view_offset + view_len]\n", "cpp_name": "resize_and_read_view", "cpp_starter": "void resize_and_read_view(const int* init_data, int init_len, int new_total_len, int write_idx, int write_val, int view_offset, int view_len, int* out_slice) {\n    int old_buf[64];\n    int new_buf[64];\n    for (int i = 0; i < init_len; i++) { old_buf[i] = init_data[i]; }\n    int* storage = old_buf;\n    int* view_backing = storage; // raw data_ptr cached before resize\n    if (new_total_len > init_len) {\n        for (int i = 0; i < init_len; i++) { new_buf[i] = storage[i]; }\n        for (int i = init_len; i < new_total_len; i++) { new_buf[i] = 0; }\n        for (int i = 0; i < init_len; i++) { old_buf[i] = -999999; } // ASan poison freed old_buf\n        storage = new_buf;\n        // BUG: view_backing still points to freed old_buf!\n    }\n    storage[write_idx] = write_val;\n    for (int j = 0; j < view_len; j++) {\n        out_slice[j] = view_backing[view_offset + j];\n    }\n}\n", "cpp_sol": "void resize_and_read_view(const int* init_data, int init_len, int new_total_len, int write_idx, int write_val, int view_offset, int view_len, int* out_slice) {\n    int old_buf[64];\n    int new_buf[64];\n    for (int i = 0; i < init_len; i++) { old_buf[i] = init_data[i]; }\n    int* storage = old_buf;\n    int* view_backing = storage;\n    if (new_total_len > init_len) {\n        for (int i = 0; i < init_len; i++) { new_buf[i] = storage[i]; }\n        for (int i = init_len; i < new_total_len; i++) { new_buf[i] = 0; }\n        for (int i = 0; i < init_len; i++) { old_buf[i] = -999999; }\n        storage = new_buf;\n        view_backing = storage;\n    }\n    storage[write_idx] = write_val;\n    for (int j = 0; j < view_len; j++) {\n        out_slice[j] = view_backing[view_offset + j];\n    }\n}\n", "hint": "Whenever `storage` is reallocated (`storage = new_storage` / `storage = new_buf`), rebind `view_backing = storage` so the view does not point to the poisoned/freed old buffer.", "tests": [{"a": "[[10, 20], 4, 2, 30, 0, 3]", "e": "[10, 20, 30]"}, {"a": "[[5, 6, 7], 3, 1, 99, 0, 3]", "e": "[5, 99, 7]"}, {"a": "[[1, 2], 6, 5, 42, 1, 5]", "e": "[2, 0, 0, 0, 42]", "h": 1}], "v": [["init_data (list[int] / const int*)", "Initial elements inside the tensor's backing storage before `resize_`."], ["new_total_len (int)", "New capacity requested for `storage`. If larger than `len(init_data)`, a reallocation occurs."], ["write_idx (int)", "Element index updated in `storage` after the resize."], ["write_val (int)", "New value written to `storage[write_idx]`."], ["view_offset (int)", "Starting element index of the tensor view (`storage_offset()`)."], ["view_len (int)", "Number of elements visible through the tensor view."], ["storage (list[int] / int*)", "Current backing buffer owned by the tensor's `StorageImpl`."], ["view_backing (list[int] / int*)", "Raw pointer (`data_ptr`) held by the view. Becomes a dangling pointer if `storage` reallocates without rebinding `view_backing`!"]], "lines_py": [["def resize_and_read_view(init_data, new_total_len, write_idx, write_val, view_offset, view_len):", "Simulates reading a tensor view after its backing `Storage` is resized (`resize_`)."], ["    storage = list(init_data)", "Allocates the initial backing storage list from `init_data`."], ["    view_backing = storage", "The tensor view caches a reference (`data_ptr`) to `storage` before `resize_`."], ["    if new_total_len > len(storage):", "Checks if `new_total_len` exceeds current capacity, requiring a storage reallocation."], ["        new_storage = storage + [0] * (new_total_len - len(storage))", "Allocates a new larger buffer copying old elements and zero-filling the new tail slots."], ["        for k in range(len(storage)):", "Loops over every slot of the old buffer being freed."], ["            storage[k] = -999999  # ASan poison on freed old storage!", "Models `free(old_storage)` + AddressSanitizer poisoning (`-999999`) of freed memory."], ["        storage = new_storage", "Updates the storage owner to point at `new_storage`."], ["        view_backing = storage", "THE FIX: Rebinds `view_backing` to the newly allocated `storage` so the view does not read poisoned/freed memory!"], ["    storage[write_idx] = write_val", "Writes `write_val` into slot `write_idx` of the active storage."], ["    return view_backing[view_offset : view_offset + view_len]", "Slices `[view_offset : view_offset + view_len]` from the valid `view_backing` buffer."]], "lines_cpp": [["void resize_and_read_view(const int* init_data, int init_len, int new_total_len, int write_idx, int write_val, int view_offset, int view_len, int* out_slice) {", "Simulates a C++ tensor view (`data_ptr + view_offset`) across a backing `Storage` reallocation (`resize_`)."], ["    int old_buf[64];", "Stack array modeling the initial heap allocation of the tensor's `Storage`."], ["    int new_buf[64];", "Stack array modeling the newly allocated larger heap block when `resize_` grows the `Storage`."], ["    for (int i = 0; i < init_len; i++) { old_buf[i] = init_data[i]; }", "Copies the initial tensor elements `init_data[0..init_len-1]` into `old_buf`."], ["    int* storage = old_buf;", "Sets `storage` pointer to point at the initial buffer `old_buf`."], ["    int* view_backing = storage;", "Caches the raw pointer `view_backing` (like `float* p = tensor.data_ptr<float>()`)."], ["    if (new_total_len > init_len) {", "Checks if `resize_(new_total_len)` exceeds the old capacity `init_len` and requires reallocation."], ["        for (int i = 0; i < init_len; i++) { new_buf[i] = storage[i]; }", "Copies the existing `init_len` elements from the old buffer into the newly allocated `new_buf`."], ["        for (int i = init_len; i < new_total_len; i++) { new_buf[i] = 0; }", "Zero-initializes the newly grown tail slots `init_len .. new_total_len - 1`."], ["        for (int i = 0; i < init_len; i++) { old_buf[i] = -999999; }", "Models `free(old_buf)` + AddressSanitizer poisoning (`-999999`) of the freed memory block."], ["        storage = new_buf;", "Updates the owning `Storage` pointer to point at `new_buf`."], ["        view_backing = storage;", "THE FIX: Rebinds `view_backing` to the new `storage` pointer so the view does not read freed `old_buf`!"], ["    }", "Closes the reallocation block."], ["    storage[write_idx] = write_val;", "Writes `write_val` into slot `write_idx` of the active `storage`."], ["    for (int j = 0; j < view_len; j++) {", "Loops `j` from `0` to `view_len - 1` to read out the tensor view slice."], ["        out_slice[j] = view_backing[view_offset + j];", "Reads element `view_offset + j` from `view_backing` into `out_slice[j]`."], ["    }", "Ends the view read loop."], ["}", "Ends `resize_and_read_view`."]]}, {"id": "alloc_overflow", "l": 4, "title": "4.1 Integer Overflow in Allocation Byte Size (Reagent C06 IO2BO)", "real_bug": "Reagent C06 (c06_alloc_size_overflow/alloc_size_overflow.py — CWE-190/680 malloc(n * sizeof(T)) wraparound)", "desc": "In 32-bit unsigned arithmetic (or 32-bit GPU index math), integers wrap around modulo $2^{32} = 4,294,967,296$ (`UINT32_MAX = 4,294,967,295`). Look at what the buggy starter does when `n_elems = 1,073,741,825` and `elem_bytes = 4`:\n`(1073741825 * 4) & 0xFFFFFFFF` wraps around to just **`4` bytes**! So the allocator thinks you only asked for `4` bytes (which is `<= budget_bytes`), allocates a tiny 4-byte buffer, and then the caller writes 1 billion floats past the end of the buffer (Heap Buffer Overflow, CWE-787)! Fix `safe_tensor_alloc_bytes(n_elems, elem_bytes, uint32_max, budget_bytes)` using the exact division guard from your Reagent `C06` detector:\n- If `n_elems < 0` or `elem_bytes <= 0`, return `-1`.\n- Check `if n_elems > uint32_max // elem_bytes:` BEFORE multiplying! If it would overflow `uint32_max`, return `-1`.\n- Compute `total_bytes = n_elems * elem_bytes`. If `total_bytes > budget_bytes`, return `-1`.\n- Otherwise return `total_bytes`.", "py_name": "safe_tensor_alloc_bytes", "py_starter": "def safe_tensor_alloc_bytes(n_elems, elem_bytes, uint32_max, budget_bytes):\n    if n_elems < 0 or elem_bytes <= 0:\n        return -1\n    # BUG (CWE-190 IO2BO): 32-bit multiplication wraps around BEFORE checking budget_bytes!\n    total_bytes = (n_elems * elem_bytes) & uint32_max\n    if total_bytes > budget_bytes:\n        return -1\n    return total_bytes\n", "py_sol": "def safe_tensor_alloc_bytes(n_elems, elem_bytes, uint32_max, budget_bytes):\n    if n_elems < 0 or elem_bytes <= 0:\n        return -1\n    if n_elems > uint32_max // elem_bytes:\n        return -1\n    total_bytes = n_elems * elem_bytes\n    if total_bytes > budget_bytes:\n        return -1\n    return total_bytes\n", "cpp_name": "safe_tensor_alloc_bytes", "cpp_starter": "long long safe_tensor_alloc_bytes(long long n_elems, long long elem_bytes, long long uint32_max, long long budget_bytes) {\n    if (n_elems < 0 || elem_bytes <= 0) {\n        return -1;\n    }\n    // BUG (CWE-190 IO2BO): 32-bit multiplication wraps around BEFORE checking budget_bytes!\n    long long total_bytes = (n_elems * elem_bytes) & uint32_max;\n    if (total_bytes > budget_bytes) {\n        return -1;\n    }\n    return total_bytes;\n}\n", "cpp_sol": "long long safe_tensor_alloc_bytes(long long n_elems, long long elem_bytes, long long uint32_max, long long budget_bytes) {\n    if (n_elems < 0 || elem_bytes <= 0) {\n        return -1;\n    }\n    if (n_elems > uint32_max / elem_bytes) {\n        return -1;\n    }\n    long long total_bytes = n_elems * elem_bytes;\n    if (total_bytes > budget_bytes) {\n        return -1;\n    }\n    return total_bytes;\n}\n", "hint": "Add `if n_elems > uint32_max // elem_bytes: return -1` (in Python) or `if (n_elems > uint32_max / elem_bytes) return -1;` (in C++) BEFORE computing `total_bytes = n_elems * elem_bytes`.", "tests": [{"a": "[100, 4, 4294967295, 1024]", "e": "400"}, {"a": "[1073741825, 4, 4294967295, 1024]", "e": "-1"}, {"a": "[300, 4, 4294967295, 1024]", "e": "-1"}, {"a": "[0, 4, 4294967295, 1024]", "e": "0", "h": 1}, {"a": "[1073741824, 4, 4294967295, 4294967295]", "e": "-1", "h": 1}], "v": [["n_elems (int / long long)", "Number of tensor elements requested (potentially untrusted input from a model file or network packet)."], ["elem_bytes (int / long long)", "Byte width of one element (`sizeof(float) == 4`, `sizeof(double) == 8`)."], ["uint32_max (int / long long)", "Maximum value representable by a 32-bit unsigned size (`4294967295`, i.e. `0xFFFFFFFF`)."], ["budget_bytes (int / long long)", "Maximum bytes the allocator is allowed to hand out."], ["total_bytes (int / long long)", "Computed byte count `n_elems * elem_bytes`. In the buggy version, `& uint32_max` models 32-bit unsigned wraparound (`1073741825 * 4 -> 4`!)."]], "lines_py": [["def safe_tensor_alloc_bytes(n_elems, elem_bytes, uint32_max, budget_bytes):", "Validates and computes `n_elems * elem_bytes` without 32-bit unsigned integer wraparound (`Reagent C06`)."], ["    if n_elems < 0 or elem_bytes <= 0:", "Rejects negative element counts or non-positive element byte widths."], ["        return -1", "Returns `-1` on invalid arguments."], ["    if n_elems > uint32_max // elem_bytes:", "THE FIX (`Reagent C06` IO2BO guard): Checks `n_elems > uint32_max // elem_bytes` via division BEFORE multiplying!"], ["        return -1", "Returns `-1` when `n_elems * elem_bytes` would overflow `uint32_max`."], ["    total_bytes = n_elems * elem_bytes", "Safe to multiply now: guaranteed not to wrap around 32-bit `uint32_max`."], ["    if total_bytes > budget_bytes:", "Checks whether the true byte size exceeds `budget_bytes`."], ["        return -1", "Returns `-1` if the allocation exceeds the memory budget."], ["    return total_bytes", "Returns the verified byte count."]], "lines_cpp": [["long long safe_tensor_alloc_bytes(long long n_elems, long long elem_bytes, long long uint32_max, long long budget_bytes) {", "Computes a safe byte size for allocating `n_elems` items of `elem_bytes` each, guarding against 32-bit `size_t` overflow (`Reagent C06`)."], ["    if (n_elems < 0 || elem_bytes <= 0) {", "Rejects negative element counts or non-positive element byte widths."], ["        return -1;", "Returns `-1` on invalid dimensions."], ["    }", "Closes the negative/zero dimension guard."], ["    if (n_elems > uint32_max / elem_bytes) {", "THE FIX (CWE-190 / CWE-680 IO2BO division guard): Checks if `n_elems * elem_bytes` would exceed `uint32_max` BEFORE multiplying!"], ["        return -1;", "Rejects the overflowing request immediately (`1073741825 * 4` would have wrapped to `4` bytes!)."], ["    }", "Closes the integer-overflow guard."], ["    long long total_bytes = n_elems * elem_bytes;", "Multiplies `n_elems * elem_bytes`, now proven not to wrap around `uint32_max`."], ["    if (total_bytes > budget_bytes) {", "Checks whether the true byte count exceeds the allocator's `budget_bytes`."], ["        return -1;", "Returns `-1` when the request exceeds available memory budget."], ["    }", "Closes the budget check."], ["    return total_bytes;", "Returns the verified, overflow-free allocation size in bytes."], ["}", "Ends `safe_tensor_alloc_bytes`."]]}, {"id": "kv_dtype_memcpy", "l": 4, "title": "4.2 Raw C++ memcpy Gated Only on Byte-Width vs. Dtype (ExecuTorch #23399)", "real_bug": "pytorch/executorch#23399 (QuantizedKVCache._update_and_return_float_values fatal ET_CHECK_MSG abort on bf16/fp16)", "desc": "In `pytorch/executorch#23399`, `QuantizedKVCache` dequantized its cache into a buffer of dtype `cache_dtype` (e.g. `'fp32'`, 4 bytes) and then updated slot `input_pos` with incoming `k_val` of dtype `in_dtype` (e.g. `'bf16'`, 2 bytes) using a raw C++ `memcpy` gated ONLY on byte width (`element_size()`):\n- When `in_dtype` was `'bf16'` (2 bytes) and `cache_dtype` was `'fp32'` (4 bytes), the C++ op saw `2 != 4` and called `abort()` (crashing the entire process)!\n- Even worse: if `in_dtype` was `'bf16'` (2 bytes) and `cache_dtype` was `'fp16'` (2 bytes), a byte-width-only `memcpy` saw `2 == 2` and copied the raw bits without converting, corrupting the numbers!\nIn `update_kv_cache_slot(cache_vals, cache_dtype, k_val, in_dtype, input_pos)`, the simulated C++ op `raw_cpp_memcpy_slot` returns `'ABORT_BYTE_WIDTH_MISMATCH'` if the byte sizes differ, or `'CORRUPT_RAW_BITS'` if the byte sizes match (`'bf16'` vs `'fp16'`) but the dtypes differ! Fix `update_kv_cache_slot` by casting `in_dtype` to `cache_dtype` (setting `cast_dtype = cache_dtype` and rounding `k_val` with `cast_value(k_val, cache_dtype)`) BEFORE calling `raw_cpp_memcpy_slot`.", "py_name": "update_kv_cache_slot", "py_starter": "def dtype_bytes(dt):\n    return 4 if dt == 'fp32' else 2\n\ndef cast_value(val, target_dtype):\n    # Models PyTorch's k_val.to(k_out.dtype) format conversion\n    return round(val, 2) if target_dtype != 'fp32' else round(val, 5)\n\ndef raw_cpp_memcpy_slot(cache_vals, cache_dtype, val, val_dtype, pos):\n    if dtype_bytes(val_dtype) != dtype_bytes(cache_dtype):\n        return 'ABORT_BYTE_WIDTH_MISMATCH'\n    if val_dtype != cache_dtype:\n        return 'CORRUPT_RAW_BITS'\n    out = list(cache_vals)\n    out[pos] = val\n    return out\n\ndef update_kv_cache_slot(cache_vals, cache_dtype, k_val, in_dtype, input_pos):\n    # BUG (executorch#23399): passes k_val with un-cast in_dtype straight into raw C++ memcpy!\n    return raw_cpp_memcpy_slot(cache_vals, cache_dtype, k_val, in_dtype, input_pos)\n", "py_sol": "def dtype_bytes(dt):\n    return 4 if dt == 'fp32' else 2\n\ndef cast_value(val, target_dtype):\n    # Models PyTorch's k_val.to(k_out.dtype) format conversion\n    return round(val, 2) if target_dtype != 'fp32' else round(val, 5)\n\ndef raw_cpp_memcpy_slot(cache_vals, cache_dtype, val, val_dtype, pos):\n    if dtype_bytes(val_dtype) != dtype_bytes(cache_dtype):\n        return 'ABORT_BYTE_WIDTH_MISMATCH'\n    if val_dtype != cache_dtype:\n        return 'CORRUPT_RAW_BITS'\n    out = list(cache_vals)\n    out[pos] = val\n    return out\n\ndef update_kv_cache_slot(cache_vals, cache_dtype, k_val, in_dtype, input_pos):\n    k_cast = cast_value(k_val, cache_dtype)\n    return raw_cpp_memcpy_slot(cache_vals, cache_dtype, k_cast, cache_dtype, input_pos)\n", "cpp_name": "update_kv_cache_slot", "cpp_starter": "// dtype codes: 0 = fp32 (4B), 1 = fp16 (2B), 2 = bf16 (2B)\nint dtype_bytes(int dt) { return (dt == 0) ? 4 : 2; }\n\nint raw_cpp_memcpy_slot(int* cache_vals, int cache_dtype, int val, int val_dtype, int pos) {\n    if (dtype_bytes(val_dtype) != dtype_bytes(cache_dtype)) {\n        return -999; // ET_CHECK_MSG FATAL ABORT (byte width mismatch)\n    }\n    if (val_dtype != cache_dtype) {\n        return -888; // Silent bit reinterpretation (bf16 bits copied into fp16 slot)\n    }\n    cache_vals[pos] = val;\n    return 1;\n}\n\nint update_kv_cache_slot(int* cache_vals, int cache_dtype, int k_val, int in_dtype, int input_pos) {\n    // BUG (executorch#23399): passes un-cast in_dtype straight to raw C++ memcpy op!\n    return raw_cpp_memcpy_slot(cache_vals, cache_dtype, k_val, in_dtype, input_pos);\n}\n", "cpp_sol": "// dtype codes: 0 = fp32 (4B), 1 = fp16 (2B), 2 = bf16 (2B)\nint dtype_bytes(int dt) { return (dt == 0) ? 4 : 2; }\n\nint raw_cpp_memcpy_slot(int* cache_vals, int cache_dtype, int val, int val_dtype, int pos) {\n    if (dtype_bytes(val_dtype) != dtype_bytes(cache_dtype)) {\n        return -999; // ET_CHECK_MSG FATAL ABORT (byte width mismatch)\n    }\n    if (val_dtype != cache_dtype) {\n        return -888; // Silent bit reinterpretation (bf16 bits copied into fp16 slot)\n    }\n    cache_vals[pos] = val;\n    return 1;\n}\n\nint update_kv_cache_slot(int* cache_vals, int cache_dtype, int k_val, int in_dtype, int input_pos) {\n    int cast_dtype = cache_dtype;\n    return raw_cpp_memcpy_slot(cache_vals, cache_dtype, k_val, cast_dtype, input_pos);\n}\n", "hint": "In `update_kv_cache_slot`, convert `k_val` first with `k_cast = cast_value(k_val, cache_dtype)` and pass `k_cast, cache_dtype` (instead of `k_val, in_dtype`) into `raw_cpp_memcpy_slot`.", "tests": [{"a": "[[1.0, 2.0, 3.0], 'fp32', 9.5, 'bf16', 1]", "e": "[1.0, 9.5, 3.0]"}, {"a": "[[1.0, 2.0, 3.0], 'fp16', 4.25, 'bf16', 2]", "e": "[1.0, 2.0, 4.25]"}, {"a": "[[1.0, 2.0], 'fp32', 7.125, 'fp32', 0]", "e": "[7.125, 2.0]"}, {"a": "[[0.0, 0.0], 'fp32', 3.14159, 'fp16', 0]", "e": "[3.14159, 0.0]", "h": 1}], "v": [["cache_vals (list[float] / int*)", "The dequantized KV-cache buffer (`k_out` in `QuantizedKVCache`)."], ["cache_dtype (str / int)", "The dtype of `cache_vals` (`self.cache_fp_type`, hardcoded to `'fp32'` in ExecuTorch)."], ["k_val (float / int)", "Incoming live key activation produced by the current attention layer."], ["in_dtype (str / int)", "Runtime dtype of `k_val` (often `'bf16'` or `'fp16'` during on-device LLM inference)."], ["input_pos (int)", "Token sequence position where `k_val` should be written inside `cache_vals`."], ["k_cast (float)", "Value of `k_val` after explicit dtype conversion `k_val.to(k_out.dtype)`."]], "lines_py": [["def dtype_bytes(dt):", "Helper returning the byte width (`element_size()`) of dtype `dt`."], ["    return 4 if dt == 'fp32' else 2", "`'fp32'` is 4 bytes; both `'fp16'` and `'bf16'` are 2 bytes."], ["def cast_value(val, target_dtype):", "Models PyTorch's `k_val.to(k_out.dtype)` numeric format conversion."], ["    # Models PyTorch's k_val.to(k_out.dtype) format conversion", "Comment explaining dtype conversion precision."], ["    return round(val, 2) if target_dtype != 'fp32' else round(val, 5)", "Rounds value according to the target floating-point precision."], ["def raw_cpp_memcpy_slot(cache_vals, cache_dtype, val, val_dtype, pos):", "Models `torch.ops.llama.update_cache` in `pytorch/executorch#23399`."], ["    if dtype_bytes(val_dtype) != dtype_bytes(cache_dtype):", "Checks if `val_dtype` and `cache_dtype` have different byte widths (`element_size()`)."], ["        return 'ABORT_BYTE_WIDTH_MISMATCH'", "Models `ET_CHECK_MSG` fatally aborting the Python process when 2-byte `bf16` hits 4-byte `fp32`!"], ["    if val_dtype != cache_dtype:", "Checks if byte widths match (`bf16` vs `fp16`, both 2B) but bit layouts differ."], ["        return 'CORRUPT_RAW_BITS'", "Models raw `memcpy` silently reinterpreting `bf16` bits as bogus `fp16` numbers!"], ["    out = list(cache_vals)", "Copies the cache list so we can update slot `pos`."], ["    out[pos] = val", "Writes `val` into slot `pos` of the cache."], ["    return out", "Returns the updated cache buffer."], ["def update_kv_cache_slot(cache_vals, cache_dtype, k_val, in_dtype, input_pos):", "Models `QuantizedKVCache._update_and_return_float_values()` in `pytorch/executorch#23399`."], ["    k_cast = cast_value(k_val, cache_dtype)", "THE FIX (`executorch#23399`): Converts `k_val` to `cache_dtype` up front (`k_val = k_val.to(k_out.dtype)`)."], ["    return raw_cpp_memcpy_slot(cache_vals, cache_dtype, k_cast, cache_dtype, input_pos)", "Passes `k_cast` with `cache_dtype` into the C++ `memcpy` op so both byte width and bit format match!"]], "lines_cpp": [["// dtype codes: 0 = fp32 (4B), 1 = fp16 (2B), 2 = bf16 (2B)", "Encoding of scalar types (`ScalarType`): `0` is 4-byte `float32`, `1` is 2-byte `float16`, `2` is 2-byte `bfloat16`."], ["int dtype_bytes(int dt) { return (dt == 0) ? 4 : 2; }", "Models `tensor.element_size()`: returns `4` for `fp32` and `2` for both `fp16` and `bf16`."], ["int raw_cpp_memcpy_slot(int* cache_vals, int cache_dtype, int val, int val_dtype, int pos) {", "Models `torch.ops.llama.update_cache` in `pytorch/executorch#23399`, which performs a raw C++ `memcpy` into the KV cache."], ["    if (dtype_bytes(val_dtype) != dtype_bytes(cache_dtype)) {", "Models `ET_CHECK_MSG(k_val.element_size() == k_out.element_size())` in C++."], ["        return -999; // ET_CHECK_MSG FATAL ABORT (byte width mismatch)", "When `bf16` (2B) is passed into an `fp32` (4B) cache, `ET_CHECK_MSG` calls `abort()` and kills the whole process!"], ["    }", "Closes the byte-width check."], ["    if (val_dtype != cache_dtype) {", "Checks what happens when byte widths match (`bf16` 2B vs `fp16` 2B) but scalar types differ."], ["        return -888; // Silent bit reinterpretation (bf16 bits copied into fp16 slot)", "Raw `memcpy` copies `bf16` exponent/mantissa bits directly into an `fp16` buffer, silently corrupting every number!"], ["    }", "Closes the dtype format check."], ["    cache_vals[pos] = val;", "Writes `val` into slot `pos` of `cache_vals` once byte width and dtype format match."], ["    return 1;", "Returns `1` indicating a clean cache update."], ["}", "Ends `raw_cpp_memcpy_slot`."], ["int update_kv_cache_slot(int* cache_vals, int cache_dtype, int k_val, int in_dtype, int input_pos) {", "Models `QuantizedKVCache._update_and_return_float_values()` in `pytorch/executorch#23399`."], ["    int cast_dtype = cache_dtype;", "THE FIX (`executorch#23399`): Casts incoming `k_val` (`k_val = k_val.to(k_out.dtype)`) to `cache_dtype` up front before updating."], ["    return raw_cpp_memcpy_slot(cache_vals, cache_dtype, k_val, cast_dtype, input_pos);", "Calls the C++ update op with the cast tensor so both `element_size()` and `scalar_type()` match `cache_dtype`."], ["}", "Ends `update_kv_cache_slot`."]]}, {"id": "inplace_counter_alias", "l": 5, "title": "5.1 In-Place Tensor Counter Aliasing (GPT-Neo StaticCache Window Fix)", "real_bug": "huggingface/transformers GPT-Neo StaticCache local attention window (gpt_neo_static_cache_fix.md)", "desc": "In `StaticLayer` (HuggingFace `transformers`), `cumulative_length` is a 1-element tensor `[past_tokens]` that `static_cache_update` increments **in-place** (`cumulative_length[0] += new_tokens`).\nIn GPT-Neo's `_attn`, the code snapshotted `past_len_ref = cumulative_length` BEFORE calling `static_cache_update`, and then after `update` built the token positions `[past_len_ref[0] + i for i in range(new_tokens)]`.\nBecause `past_len_ref = cumulative_length` did NOT clone the tensor (both variables pointed to the exact same 1-element list/storage!), the in-place `+= new_tokens` inside `static_cache_update` mutated `past_len_ref[0]` too — shifting every position index forward by `new_tokens`!\nFix `gpt_neo_local_window_positions(cumulative_length, new_tokens)` by snapshotting the integer value (or cloning `cumulative_length`) BEFORE `static_cache_update` mutates `cumulative_length` in-place, and return `[positions, cumulative_length[0]]`.", "py_name": "gpt_neo_local_window_positions", "py_starter": "def static_cache_update(cumulative_length, new_tokens):\n    # Mutates the 1-element tensor/list IN-PLACE (just like StaticLayer.update)\n    cumulative_length[0] += new_tokens\n\ndef gpt_neo_local_window_positions(cumulative_length, new_tokens):\n    # BUG (GPT-Neo StaticCache): aliases cumulative_length without cloning before in-place update!\n    past_len_box = cumulative_length\n    static_cache_update(cumulative_length, new_tokens)\n    positions = [past_len_box[0] + i for i in range(new_tokens)]\n    return [positions, cumulative_length[0]]\n", "py_sol": "def static_cache_update(cumulative_length, new_tokens):\n    # Mutates the 1-element tensor/list IN-PLACE (just like StaticLayer.update)\n    cumulative_length[0] += new_tokens\n\ndef gpt_neo_local_window_positions(cumulative_length, new_tokens):\n    # FIX: clone/snapshot the pre-update value BEFORE static_cache_update mutates in-place!\n    past_len = cumulative_length[0]\n    static_cache_update(cumulative_length, new_tokens)\n    positions = [past_len + i for i in range(new_tokens)]\n    return [positions, cumulative_length[0]]\n", "cpp_name": "gpt_neo_local_window_positions", "cpp_starter": "void static_cache_update(int* cumulative_length, int new_tokens) {\n    cumulative_length[0] += new_tokens; // in-place tensor mutation\n}\n\nvoid gpt_neo_local_window_positions(int init_cum_len, int new_tokens, int* out_positions, int* out_new_cum_len) {\n    int cumulative_length[1] = { init_cum_len };\n    // BUG: aliases pointer to cumulative_length instead of copying the value before in-place update!\n    int* past_len_ptr = cumulative_length;\n    static_cache_update(cumulative_length, new_tokens);\n    for (int i = 0; i < new_tokens; i++) {\n        out_positions[i] = past_len_ptr[0] + i;\n    }\n    *out_new_cum_len = cumulative_length[0];\n}\n", "cpp_sol": "void static_cache_update(int* cumulative_length, int new_tokens) {\n    cumulative_length[0] += new_tokens; // in-place tensor mutation\n}\n\nvoid gpt_neo_local_window_positions(int init_cum_len, int new_tokens, int* out_positions, int* out_new_cum_len) {\n    int cumulative_length[1] = { init_cum_len };\n    int past_len = cumulative_length[0];\n    static_cache_update(cumulative_length, new_tokens);\n    for (int i = 0; i < new_tokens; i++) {\n        out_positions[i] = past_len + i;\n    }\n    *out_new_cum_len = cumulative_length[0];\n}\n", "hint": "Copy the value `past_len = cumulative_length[0]` (or `past_len_box = list(cumulative_length)` / `.clone()`) BEFORE calling `static_cache_update(cumulative_length, new_tokens)`.", "tests": [{"a": "[[0], 4]", "e": "[[0, 1, 2, 3], 4]"}, {"a": "[[4], 2]", "e": "[[4, 5], 6]"}, {"a": "[[10], 1]", "e": "[[10], 11]"}, {"a": "[[256], 3]", "e": "[[256, 257, 258], 259]", "h": 1}], "v": [["cumulative_length (list[int] / int*)", "1-element tensor `[count]` owned by `StaticLayer` that tracks how many valid tokens are in the pre-allocated static buffer."], ["new_tokens (int)", "Number of query/key tokens arriving in the current forward pass (`query_length`)."], ["past_len_box (list[int]) / past_len_ptr (int*)", "BUGGY alias pointing to the exact same memory box as `cumulative_length`."], ["past_len (int)", "FIXED independent snapshot (`.clone()`) of the token count taken BEFORE `static_cache_update` mutates `cumulative_length[0]` in place."], ["positions (list[int] / int*)", "The absolute token indices `[past_len, past_len + 1, ...]` used to slice the local attention causal mask."]], "lines_py": [["def static_cache_update(cumulative_length, new_tokens):", "Models `StaticLayer.update()` in HuggingFace `transformers`."], ["    # Mutates the 1-element tensor/list IN-PLACE (just like StaticLayer.update)", "Comment noting that `StaticLayer.update` uses in-place `+=` on `self.cumulative_length`."], ["    cumulative_length[0] += new_tokens", "Increments `cumulative_length[0]` in-place, mutating any alias sharing the same list/storage!"], ["def gpt_neo_local_window_positions(cumulative_length, new_tokens):", "Models GPT-Neo `_attn` computing token positions with `StaticCache` (`gpt_neo_static_cache_fix.md`)."], ["    # FIX: clone/snapshot the pre-update value BEFORE static_cache_update mutates in-place!", "Comment explaining why `past_len` must be cloned before `static_cache_update`."], ["    past_len = cumulative_length[0]", "THE FIX: Extracts/clones the integer value `cumulative_length[0]` BEFORE `static_cache_update` mutates `cumulative_length` in-place!"], ["    static_cache_update(cumulative_length, new_tokens)", "Advances `cumulative_length[0]` in-place by `+ new_tokens`."], ["    positions = [past_len + i for i in range(new_tokens)]", "Builds the true causal window positions `[past_len, past_len + 1, ...]` from the pre-update snapshot."], ["    return [positions, cumulative_length[0]]", "Returns `[positions, updated_cumulative_length]`."]], "lines_cpp": [["void static_cache_update(int* cumulative_length, int new_tokens) {", "Models `StaticLayer.update()` in HuggingFace `transformers`, which takes the 1-element `cumulative_length` tensor."], ["    cumulative_length[0] += new_tokens; // in-place tensor mutation", "Increments `cumulative_length[0]` IN-PLACE (`self.cumulative_length += q_len`), mutating the underlying storage buffer."], ["}", "Ends `static_cache_update`."], ["void gpt_neo_local_window_positions(int init_cum_len, int new_tokens, int* out_positions, int* out_new_cum_len) {", "Models GPT-Neo `_attn` computing causal mask positions with `StaticCache` (`gpt_neo_static_cache_fix.md`)."], ["    int cumulative_length[1] = { init_cum_len };", "Initializes the 1-element tensor storage `cumulative_length` with `init_cum_len` past tokens."], ["    int past_len = cumulative_length[0];", "THE FIX: Clones/copies the scalar value `cumulative_length[0]` into an independent variable `past_len` BEFORE `static_cache_update` mutates `cumulative_length` in-place!"], ["    static_cache_update(cumulative_length, new_tokens);", "Advances `cumulative_length[0]` in-place by `+ new_tokens`."], ["    for (int i = 0; i < new_tokens; i++) {", "Loops `i` across each of the `new_tokens` query tokens in the current forward pass."], ["        out_positions[i] = past_len + i;", "Computes token `i`'s true absolute position `past_len + i` using the pre-update snapshot."], ["    }", "Ends the position calculation loop."], ["    *out_new_cum_len = cumulative_length[0];", "Writes the post-update `cumulative_length[0]` to `*out_new_cum_len`."], ["}", "Ends `gpt_neo_local_window_positions`."]]}, {"id": "persistent_buffer_state", "l": 5, "title": "5.2 Stateful Module Buffers Missing From state_dict() Resume (Kornia ADA & TorchMetrics)", "real_bug": "kornia/kornia AdaptiveDiscriminatorAugmentation (p reset 0.8 -> 1e-5) & Lightning-AI/torchmetrics WrapperMetric.persistent", "desc": "In `kornia`'s `AdaptiveDiscriminatorAugmentation` (`ADA`), the augmentation probability `p` starts at `init_p` (`0.0`) and adapts every `update_interval` steps by `+delta` (clamped to `[0.0, 1.0]`), while `step_count` counts total steps.\nWhen training is interrupted after `steps_before_save` steps, the trainer saves `state = get_state_dict(...)` and loads it into a fresh module before running `steps_after_resume` more steps.\nThe buggy starter omits `p` and `step_count` from `state_dict` (leaving it empty `{}`), so resuming from a checkpoint silently resets `p` back to `init_p` and loses the remainder of `step_count % update_interval`!\nFix `simulate_ada_resume(init_p, delta, update_interval, steps_before_save, steps_after_resume)` so `state_dict` saves and restores both `'p'` and `'step_count'`, making the resumed run produce the exact same `[round(p, 6), step_count]` as an uninterrupted run of `steps_before_save + steps_after_resume` steps!", "py_name": "simulate_ada_resume", "py_starter": "def step_ada(state, delta, update_interval):\n    state['step_count'] += 1\n    if state['step_count'] % update_interval == 0:\n        state['p'] = min(1.0, max(0.0, state['p'] + delta))\n\ndef simulate_ada_resume(init_p, delta, update_interval, steps_before_save, steps_after_resume):\n    mod1 = {'p': init_p, 'step_count': 0}\n    for _ in range(steps_before_save):\n        step_ada(mod1, delta, update_interval)\n    # BUG (Kornia ADA): state_dict forgets to persist 'p' and 'step_count'!\n    checkpoint = {}\n    # Fresh module created on resume:\n    mod2 = {'p': init_p, 'step_count': 0}\n    mod2.update(checkpoint)\n    for _ in range(steps_after_resume):\n        step_ada(mod2, delta, update_interval)\n    return [round(mod2['p'], 6), mod2['step_count']]\n", "py_sol": "def step_ada(state, delta, update_interval):\n    state['step_count'] += 1\n    if state['step_count'] % update_interval == 0:\n        state['p'] = min(1.0, max(0.0, state['p'] + delta))\n\ndef simulate_ada_resume(init_p, delta, update_interval, steps_before_save, steps_after_resume):\n    mod1 = {'p': init_p, 'step_count': 0}\n    for _ in range(steps_before_save):\n        step_ada(mod1, delta, update_interval)\n    checkpoint = {'p': mod1['p'], 'step_count': mod1['step_count']}\n    mod2 = {'p': init_p, 'step_count': 0}\n    mod2.update(checkpoint)\n    for _ in range(steps_after_resume):\n        step_ada(mod2, delta, update_interval)\n    return [round(mod2['p'], 6), mod2['step_count']]\n", "cpp_name": "simulate_ada_resume", "cpp_starter": "void step_ada(double* p, int* step_count, double delta, int update_interval) {\n    *step_count += 1;\n    if ((*step_count % update_interval) == 0) {\n        double np = *p + delta;\n        if (np > 1.0) np = 1.0;\n        if (np < 0.0) np = 0.0;\n        *p = np;\n    }\n}\n\nvoid simulate_ada_resume(double init_p, double delta, int update_interval, int steps_before_save, int steps_after_resume, double* out_p, int* out_steps) {\n    double p1 = init_p;\n    int sc1 = 0;\n    for (int i = 0; i < steps_before_save; i++) {\n        step_ada(&p1, &sc1, delta, update_interval);\n    }\n    // Fresh module on resume:\n    double p2 = init_p;\n    int sc2 = 0;\n    // BUG (Kornia ADA): p1 and sc1 were not registered in state_dict, so p2 and sc2 reset to init_p and 0!\n    for (int j = 0; j < steps_after_resume; j++) {\n        step_ada(&p2, &sc2, delta, update_interval);\n    }\n    *out_p = p2;\n    *out_steps = sc2;\n}\n", "cpp_sol": "void step_ada(double* p, int* step_count, double delta, int update_interval) {\n    *step_count += 1;\n    if ((*step_count % update_interval) == 0) {\n        double np = *p + delta;\n        if (np > 1.0) np = 1.0;\n        if (np < 0.0) np = 0.0;\n        *p = np;\n    }\n}\n\nvoid simulate_ada_resume(double init_p, double delta, int update_interval, int steps_before_save, int steps_after_resume, double* out_p, int* out_steps) {\n    double p1 = init_p;\n    int sc1 = 0;\n    for (int i = 0; i < steps_before_save; i++) {\n        step_ada(&p1, &sc1, delta, update_interval);\n    }\n    double p2 = p1;\n    int sc2 = sc1;\n    for (int j = 0; j < steps_after_resume; j++) {\n        step_ada(&p2, &sc2, delta, update_interval);\n    }\n    *out_p = p2;\n    *out_steps = sc2;\n}\n", "hint": "Save both `'p'` and `'step_count'` into `checkpoint = {'p': mod1['p'], 'step_count': mod1['step_count']}` (and in C++, initialize `p2 = p1; sc2 = sc1;` from the saved checkpoint).", "tests": [{"a": "[0.0, 0.1, 4, 8, 4]", "e": "[0.3, 12]"}, {"a": "[0.0, 0.2, 4, 3, 1]", "e": "[0.2, 4]"}, {"a": "[0.5, 0.25, 2, 4, 2]", "e": "[1.0, 6]"}, {"a": "[0.1, 0.05, 5, 7, 3]", "e": "[0.2, 10]", "h": 1}], "v": [["init_p (float / double)", "Initial augmentation probability at step 0 (e.g. `1e-5` or `0.0`)."], ["delta (float / double)", "Amount added to `p` every `update_interval` steps."], ["update_interval (int)", "Number of steps between probability updates."], ["steps_before_save (int)", "Training steps run on `mod1` before saving `state_dict`."], ["steps_after_resume (int)", "Training steps run on `mod2` after loading `state_dict`."], ["checkpoint (dict)", "Serialized `state_dict` dictionary. Must contain both `'p'` and `'step_count'` so resume is lossless!"]], "lines_py": [["def step_ada(state, delta, update_interval):", "Models one training step of Kornia's `AdaptiveDiscriminatorAugmentation` (`ADA`)."], ["    state['step_count'] += 1", "Increments the module's step counter by 1."], ["    if state['step_count'] % update_interval == 0:", "Every `update_interval` steps, adjusts the augmentation probability `p`."], ["        state['p'] = min(1.0, max(0.0, state['p'] + delta))", "Adds `delta` to `p` and clamps the result to `[0.0, 1.0]`."], ["def simulate_ada_resume(init_p, delta, update_interval, steps_before_save, steps_after_resume):", "Simulates saving and resuming `ADA` across a checkpoint after `steps_before_save` steps."], ["    mod1 = {'p': init_p, 'step_count': 0}", "Constructs the initial module instance `mod1` before training starts."], ["    for _ in range(steps_before_save):", "Loops for `steps_before_save` steps before checkpointing."], ["        step_ada(mod1, delta, update_interval)", "Advances `mod1` by one training step."], ["    checkpoint = {'p': mod1['p'], 'step_count': mod1['step_count']}", "THE FIX (`Kornia ADA` finding): Saves BOTH `'p'` and `'step_count'` in `state_dict` so neither resets on reload!"], ["    mod2 = {'p': init_p, 'step_count': 0}", "Constructs a fresh module instance `mod2` when resuming the job."], ["    mod2.update(checkpoint)", "Loads the saved `checkpoint` (`load_state_dict`) into `mod2`."], ["    for _ in range(steps_after_resume):", "Loops for `steps_after_resume` steps after checkpoint reload."], ["        step_ada(mod2, delta, update_interval)", "Advances `mod2` seamlessly from the restored `p` and `step_count`."], ["    return [round(mod2['p'], 6), mod2['step_count']]", "Returns the final probability and total step count."]], "lines_cpp": [["void step_ada(double* p, int* step_count, double delta, int update_interval) {", "Models one training step of Kornia's `AdaptiveDiscriminatorAugmentation` (`ADA`)."], ["    *step_count += 1;", "Increments the total step counter `*step_count` by 1."], ["    if ((*step_count % update_interval) == 0) {", "Checks if the current step is an exact multiple of `update_interval`."], ["        double np = *p + delta;", "Computes the new augmentation probability `*p + delta`."], ["        if (np > 1.0) np = 1.0;", "Clamps the probability at the upper bound `1.0`."], ["        if (np < 0.0) np = 0.0;", "Clamps the probability at the lower bound `0.0`."], ["        *p = np;", "Writes the clamped probability back into `*p`."], ["    }", "Closes the interval update block."], ["}", "Ends `step_ada`."], ["void simulate_ada_resume(double init_p, double delta, int update_interval, int steps_before_save, int steps_after_resume, double* out_p, int* out_steps) {", "Simulates running `steps_before_save` steps, saving `state_dict`, loading into a fresh module, and running `steps_after_resume` steps."], ["    double p1 = init_p;", "Initializes first module's augmentation probability `p1` to `init_p`."], ["    int sc1 = 0;", "Initializes first module's step counter `sc1` to `0`."], ["    for (int i = 0; i < steps_before_save; i++) {", "Runs `steps_before_save` training steps on the first module instance."], ["        step_ada(&p1, &sc1, delta, update_interval);", "Updates `p1` and `sc1` in place."], ["    }", "Ends the pre-checkpoint training loop."], ["    double p2 = p1;", "THE FIX (Part 1 — `Kornia ADA` finding): Persists and restores `p1` into the resumed module's `p2` via `state_dict`!"], ["    int sc2 = sc1;", "THE FIX (Part 2): Persists and restores `sc1` into `sc2` so the interval phase `step_count % update_interval` is not lost!"], ["    for (int j = 0; j < steps_after_resume; j++) {", "Runs `steps_after_resume` training steps on the resumed module instance."], ["        step_ada(&p2, &sc2, delta, update_interval);", "Advances `p2` and `sc2` seamlessly from the restored checkpoint state."], ["    }", "Ends the post-resume training loop."], ["    *out_p = p2;", "Writes the final probability `p2` to `*out_p`."], ["    *out_steps = sc2;", "Writes the final step count `sc2` to `*out_steps`."], ["}", "Ends `simulate_ada_resume`."]]}, {"id": "cuda_pool_alloc", "l": 6, "title": "6.1 CUDACachingAllocator Best-Fit Block Splitting & OOM Cache Eviction", "real_bug": "PyTorch c10/cuda/CUDACachingAllocator.cpp (BlockPool best-fit search, block splitting, and release_cached_blocks retry)", "desc": "Model PyTorch's `CUDACachingAllocator` servicing a single request for `req_bytes` (already rounded to 512B alignment):\nYou are given `free_blocks` (a list of idle cached block sizes currently in the pool), `active_bytes` (VRAM held by live tensors), `req_bytes` (size needed), and `max_vram` (total physical GPU memory).\nnote that `reserved_bytes = active_bytes + sum(free_blocks)`.\nImplement the 3-step `CUDACachingAllocator` algorithm in `cuda_caching_alloc(free_blocks, active_bytes, req_bytes, max_vram)`:\n1. **Best-fit pool hit**: If one or more blocks in `free_blocks` have size `>= req_bytes`, pick the **smallest** such block (`best`). Remove `best` from `free_blocks`. If `best > req_bytes`, **split** it by appending the remainder `best - req_bytes` to `free_blocks`. Add `req_bytes` to `active_bytes`.\n2. **Driver `cudaMalloc` (pool miss)**: If no block in `free_blocks` is `>= req_bytes`, check if `active_bytes + sum(free_blocks) + req_bytes <= max_vram`. If yes, `cudaMalloc` succeeds directly: add `req_bytes` to `active_bytes` (leaving `free_blocks` untouched).\n3. **OOM Retry (`release_cached_blocks`)**: Otherwise, evict all cached free blocks (`free_blocks = []`, returning their VRAM to the driver) and check if `active_bytes + req_bytes <= max_vram`. If yes, `cudaMalloc` now succeeds (`active_bytes += req_bytes`). If even that exceeds `max_vram`, return `[-1, -1, -1]` (true OOM!).\nOn success (steps 1, 2, or 3), return `[active_bytes, active_bytes + sum(free_blocks), len(free_blocks)]` (which is `[allocated_bytes, reserved_bytes, num_free_blocks]`).\n(The buggy starter never splits oversized free blocks and never evicts cached free blocks when `cudaMalloc` hits `max_vram`!)", "py_name": "cuda_caching_alloc", "py_starter": "def cuda_caching_alloc(free_blocks, active_bytes, req_bytes, max_vram):\n    pool = list(free_blocks)\n    # Step 1: look for best-fit block >= req_bytes\n    candidates = [b for b in pool if b >= req_bytes]\n    if len(candidates) > 0:\n        best = min(candidates)\n        pool.remove(best)\n        # BUG 1: forgets to split `best` when best > req_bytes (wastes best - req_bytes)!\n        active_bytes += best\n        return [active_bytes, active_bytes + sum(pool), len(pool)]\n    # Step 2: try raw cudaMalloc without evicting pool\n    if active_bytes + sum(pool) + req_bytes <= max_vram:\n        active_bytes += req_bytes\n        return [active_bytes, active_bytes + sum(pool), len(pool)]\n    # BUG 2: forgets Step 3 (evict `pool = []` via release_cached_blocks and retry before OOM)!\n    return [-1, -1, -1]\n", "py_sol": "def cuda_caching_alloc(free_blocks, active_bytes, req_bytes, max_vram):\n    pool = list(free_blocks)\n    # Step 1: look for best-fit block >= req_bytes\n    candidates = [b for b in pool if b >= req_bytes]\n    if len(candidates) > 0:\n        best = min(candidates)\n        pool.remove(best)\n        if best > req_bytes:\n            pool.append(best - req_bytes)\n        active_bytes += req_bytes\n        return [active_bytes, active_bytes + sum(pool), len(pool)]\n    # Step 2: try raw cudaMalloc without evicting pool\n    if active_bytes + sum(pool) + req_bytes <= max_vram:\n        active_bytes += req_bytes\n        return [active_bytes, active_bytes + sum(pool), len(pool)]\n    # Step 3: OOM retry — release_cached_blocks (empty_cache) and retry cudaMalloc\n    pool = []\n    if active_bytes + req_bytes <= max_vram:\n        active_bytes += req_bytes\n        return [active_bytes, active_bytes, 0]\n    return [-1, -1, -1]\n", "cpp_name": "cuda_caching_alloc", "cpp_starter": "void cuda_caching_alloc(const int* free_blocks, int n_free, int active_bytes, int req_bytes, int max_vram, int* out_res) {\n    int pool_sum = 0;\n    int best_idx = -1;\n    for (int i = 0; i < n_free; i++) {\n        pool_sum += free_blocks[i];\n        if (free_blocks[i] >= req_bytes) {\n            if (best_idx == -1 || free_blocks[i] < free_blocks[best_idx]) {\n                best_idx = i;\n            }\n        }\n    }\n    if (best_idx != -1) {\n        int best = free_blocks[best_idx];\n        // BUG 1: does not split `best` when best > req_bytes!\n        out_res[0] = active_bytes + best;\n        out_res[1] = active_bytes + pool_sum;\n        out_res[2] = n_free - 1;\n        return;\n    }\n    if (active_bytes + pool_sum + req_bytes <= max_vram) {\n        out_res[0] = active_bytes + req_bytes;\n        out_res[1] = active_bytes + pool_sum + req_bytes;\n        out_res[2] = n_free;\n        return;\n    }\n    // BUG 2: forgets OOM retry after releasing cached free blocks!\n    out_res[0] = -1; out_res[1] = -1; out_res[2] = -1;\n}\n", "cpp_sol": "void cuda_caching_alloc(const int* free_blocks, int n_free, int active_bytes, int req_bytes, int max_vram, int* out_res) {\n    int pool_sum = 0;\n    int best_idx = -1;\n    for (int i = 0; i < n_free; i++) {\n        pool_sum += free_blocks[i];\n        if (free_blocks[i] >= req_bytes) {\n            if (best_idx == -1 || free_blocks[i] < free_blocks[best_idx]) {\n                best_idx = i;\n            }\n        }\n    }\n    if (best_idx != -1) {\n        int best = free_blocks[best_idx];\n        int new_n_free = (best > req_bytes) ? n_free : (n_free - 1);\n        out_res[0] = active_bytes + req_bytes;\n        out_res[1] = active_bytes + pool_sum;\n        out_res[2] = new_n_free;\n        return;\n    }\n    if (active_bytes + pool_sum + req_bytes <= max_vram) {\n        out_res[0] = active_bytes + req_bytes;\n        out_res[1] = active_bytes + pool_sum + req_bytes;\n        out_res[2] = n_free;\n        return;\n    }\n    if (active_bytes + req_bytes <= max_vram) {\n        out_res[0] = active_bytes + req_bytes;\n        out_res[1] = active_bytes + req_bytes;\n        out_res[2] = 0;\n        return;\n    }\n    out_res[0] = -1; out_res[1] = -1; out_res[2] = -1;\n}\n", "hint": "Fix 1 (splitting): in Step 1, if `best > req_bytes`, append `best - req_bytes` back to `pool`, and add `req_bytes` (not `best`) to `active_bytes`. Fix 2 (OOM retry): at the end, clear `pool = []` and check `if active_bytes + req_bytes <= max_vram:`; if so, add `req_bytes` to `active_bytes` and return `[active_bytes, active_bytes, 0]`.", "tests": [{"a": "[[10, 4], 20, 6, 100]", "e": "[26, 34, 2]"}, {"a": "[[4, 4, 4], 20, 8, 36]", "e": "[28, 28, 0]"}, {"a": "[[4, 4], 20, 8, 50]", "e": "[28, 36, 2]"}, {"a": "[[8], 10, 8, 50]", "e": "[18, 18, 0]", "h": 1}, {"a": "[[4, 4], 30, 12, 40]", "e": "[-1, -1, -1]", "h": 1}], "v": [["free_blocks / pool (list[int])", "Sizes of cached idle VRAM blocks currently held in `CUDACachingAllocator`'s free list."], ["active_bytes (int)", "VRAM currently occupied by live tensors (`torch.cuda.memory_allocated()`)."], ["req_bytes (int)", "Size of the new tensor allocation request."], ["max_vram (int)", "Total physical VRAM available on the GPU."], ["candidates (list[int])", "Cached free blocks large enough (`>= req_bytes`) to satisfy the request without calling `cudaMalloc`."], ["best (int)", "Smallest cached free block `>= req_bytes` (best-fit policy minimizes fragmentation)."]], "lines_py": [["def cuda_caching_alloc(free_blocks, active_bytes, req_bytes, max_vram):", "Models `CUDACachingAllocator::malloc` in PyTorch: best-fit lookup, block splitting, and OOM cache eviction."], ["    pool = list(free_blocks)", "Copies the list of idle cached block sizes currently in `CUDACachingAllocator`'s free pool."], ["    # Step 1: look for best-fit block >= req_bytes", "Comment marking Step 1: fast free-pool lookup (no CUDA driver call)."], ["    candidates = [b for b in pool if b >= req_bytes]", "Finds all cached free blocks large enough (`>= req_bytes`) to fit the request."], ["    if len(candidates) > 0:", "Pool Hit branch: at least one cached free block can satisfy `req_bytes`."], ["        best = min(candidates)", "Best-fit rule: selects the smallest block `>= req_bytes` to minimize internal fragmentation."], ["        pool.remove(best)", "Removes `best` from the idle free pool."], ["        if best > req_bytes:", "THE FIX #1 (Block splitting): Checks if `best` is larger than `req_bytes`."], ["            pool.append(best - req_bytes)", "Splits `best` into `req_bytes` (for the tensor) and `best - req_bytes` (put back into `pool` as a free remainder block)!"], ["        active_bytes += req_bytes", "Increases `memory_allocated()` by `req_bytes` (`memory_reserved()` stays `active_bytes + sum(pool)`)."], ["        return [active_bytes, active_bytes + sum(pool), len(pool)]", "Returns `[allocated_bytes, reserved_bytes, num_free_blocks]` after the pool hit."], ["    # Step 2: try raw cudaMalloc without evicting pool", "Comment marking Step 2: pool miss, attempt `cudaMalloc` using unreserved GPU memory."], ["    if active_bytes + sum(pool) + req_bytes <= max_vram:", "Checks if `reserved_bytes + req_bytes` fits within physical `max_vram`."], ["        active_bytes += req_bytes", "Allocates `req_bytes` from the CUDA driver and adds it to `active_bytes`."], ["        return [active_bytes, active_bytes + sum(pool), len(pool)]", "Returns updated stats with existing `pool` blocks preserved."], ["    # Step 3: OOM retry — release_cached_blocks (empty_cache) and retry cudaMalloc", "Comment marking Step 3: automatic OOM recovery inside `CUDACachingAllocator`."], ["    pool = []", "THE FIX #2 (`release_cached_blocks()`): Frees all idle cached blocks back to the CUDA driver so fragmented VRAM is reclaimed!"], ["    if active_bytes + req_bytes <= max_vram:", "Retries `cudaMalloc(req_bytes)` now that `pool` has been evicted."], ["        active_bytes += req_bytes", "Allocation succeeds on retry: adds `req_bytes` to `active_bytes`."], ["        return [active_bytes, active_bytes, 0]", "Returns `[active_bytes, active_bytes, 0]` (`reserved == allocated`, `0` free blocks)."], ["    return [-1, -1, -1]", "True `CUDA out of memory`: even after releasing all cached blocks, `active_bytes + req_bytes > max_vram`."]], "lines_cpp": [["void cuda_caching_alloc(const int* free_blocks, int n_free, int active_bytes, int req_bytes, int max_vram, int* out_res) {", "Models `CUDACachingAllocator::malloc` in PyTorch (`CUDACachingAllocator.cpp`): best-fit search, block splitting, and OOM cache eviction."], ["    int pool_sum = 0;", "Tracks the sum of all idle cached blocks currently in the free pool (`reserved - allocated`)."], ["    int best_idx = -1;", "Index of the smallest free block `>= req_bytes` (`-1` means no suitable block found yet)."], ["    for (int i = 0; i < n_free; i++) {", "Scans the free pool (`free_blocks[0 .. n_free-1]`)."], ["        pool_sum += free_blocks[i];", "Adds `free_blocks[i]` to total cached pool bytes."], ["        if (free_blocks[i] >= req_bytes) {", "Checks if block `i` is large enough to satisfy `req_bytes`."], ["            if (best_idx == -1 || free_blocks[i] < free_blocks[best_idx]) {", "Best-fit rule: picks block `i` if it is the first fit or smaller than the best fit seen so far."], ["                best_idx = i;", "Updates `best_idx` to point to this tighter-fitting free block."], ["            }", "Closes the best-fit comparison."], ["        }", "Closes the `>= req_bytes` check."], ["    }", "Ends the free-pool scan."], ["    if (best_idx != -1) {", "Step 1 (Pool Hit): A cached block `>= req_bytes` was found in `free_blocks`!"], ["        int best = free_blocks[best_idx];", "Reads the size `best` of the chosen cached block."], ["        int new_n_free = (best > req_bytes) ? n_free : (n_free - 1);", "THE FIX #1 (Block splitting): If `best > req_bytes`, splitting `best` into `req_bytes` (active) + `best - req_bytes` (free remainder) keeps the free block count at `n_free`!"], ["        out_res[0] = active_bytes + req_bytes;", "Allocated bytes increases by `req_bytes` (NOT `best`, because the remainder stays in the free pool!)."], ["        out_res[1] = active_bytes + pool_sum;", "Total reserved bytes (`active + free_pool`) stays unchanged on a pool hit."], ["        out_res[2] = new_n_free;", "Writes the updated count of free blocks in the pool."], ["        return;", "Returns immediately without calling the slow CUDA driver `cudaMalloc`."], ["    }", "Closes Step 1 (Pool Hit)."], ["    if (active_bytes + pool_sum + req_bytes <= max_vram) {", "Step 2 (Pool Miss, Unreserved VRAM Available): Checks if raw `cudaMalloc(req_bytes)` fits alongside existing `active_bytes + pool_sum`."], ["        out_res[0] = active_bytes + req_bytes;", "Increases allocated bytes by `req_bytes`."], ["        out_res[1] = active_bytes + pool_sum + req_bytes;", "Increases reserved bytes by the new `req_bytes` segment from `cudaMalloc`."], ["        out_res[2] = n_free;", "Existing cached free blocks remain untouched (`n_free`)."], ["        return;", "Returns after successful driver `cudaMalloc`."], ["    }", "Closes Step 2 (unreserved driver cudaMalloc path)."], ["    if (active_bytes + req_bytes <= max_vram) {", "THE FIX #2 (Step 3 — `release_cached_blocks()` OOM Retry): Evicts all cached free blocks (`pool_sum -> 0`) and retries `cudaMalloc(req_bytes)`!"], ["        out_res[0] = active_bytes + req_bytes;", "Allocated bytes becomes `active_bytes + req_bytes`."], ["        out_res[1] = active_bytes + req_bytes;", "Reserved bytes equals allocated bytes because all idle cached blocks were released (`0` free blocks left)."], ["        out_res[2] = 0;", "Free block count is now `0` after `release_cached_blocks()`."], ["        return;", "Returns success rescued by cache eviction!"], ["    }", "Closes Step 3 (OOM cache eviction and retry path)."], ["    out_res[0] = -1; out_res[1] = -1; out_res[2] = -1;", "True `CUDA out of memory`: even after releasing all cached blocks, `active_bytes + req_bytes > max_vram`."], ["}", "Ends `cuda_caching_alloc`."]]}, {"id": "autograd_graph_leak", "l": 6, "title": "6.2 Autograd Activation Graph Pinning in Metrics History (`loss.detach().item()`)", "real_bug": "Classic PyTorch GPU OOM: appending live `loss` Tensor with `grad_fn` to `history` pins forward activations every step", "desc": "In PyTorch, each training step produces a `loss` Tensor whose `grad_fn` holds pointers to all intermediate forward activations (`act_bytes` MB of VRAM) needed for `loss.backward()`. After `backward()` runs, those activations are freed ONLY when no live reference to the `loss` graph node remains!\nLook at `run_training_epoch_vram(step_losses, act_bytes_per_step)`:\n- Each step creates a loss node `{'val': val, 'act_bytes': act_bytes_per_step}`.\n- The buggy starter appends the **entire graph node** `loss_node` into `history`, pinning `act_bytes_per_step` in VRAM on every single step (`leaked_vram` grows by `act_bytes_per_step * num_steps`)!\nFix `run_training_epoch_vram` so that `history` appends ONLY the detached scalar value `loss_node['val']` (modeling `loss.detach().item()`), and `leaked_vram` only sums `act_bytes` for objects in `history` that are still graph nodes (`isinstance(x, dict)`), returning `[round(avg_loss, 6), leaked_vram]`.", "py_name": "run_training_epoch_vram", "py_starter": "def run_training_epoch_vram(step_losses, act_bytes_per_step):\n    history = []\n    for val in step_losses:\n        loss_node = {'val': val, 'act_bytes': act_bytes_per_step}\n        # BUG: appending live loss_node keeps grad_fn and act_bytes pinned in VRAM forever!\n        history.append(loss_node)\n    avg_loss = sum(x['val'] if isinstance(x, dict) else x for x in history) / len(history)\n    leaked_vram = sum(x['act_bytes'] for x in history if isinstance(x, dict))\n    return [round(avg_loss, 6), leaked_vram]\n", "py_sol": "def run_training_epoch_vram(step_losses, act_bytes_per_step):\n    history = []\n    for val in step_losses:\n        loss_node = {'val': val, 'act_bytes': act_bytes_per_step}\n        # FIX: detach scalar value (loss.detach().item()) so the autograd graph node is freed!\n        history.append(loss_node['val'])\n    avg_loss = sum(x['val'] if isinstance(x, dict) else x for x in history) / len(history)\n    leaked_vram = sum(x['act_bytes'] for x in history if isinstance(x, dict))\n    return [round(avg_loss, 6), leaked_vram]\n", "cpp_name": "run_training_epoch_vram", "cpp_starter": "void run_training_epoch_vram(const double* step_losses, int n_steps, int act_bytes_per_step, double* out_avg_loss, int* out_leaked_vram) {\n    double total_loss = 0.0;\n    int leaked_vram = 0;\n    for (int i = 0; i < n_steps; i++) {\n        double loss_val = step_losses[i];\n        int keep_grad_fn = 1; // BUG: stores live Autograd Node in history instead of detached scalar!\n        total_loss += loss_val;\n        if (keep_grad_fn) {\n            leaked_vram += act_bytes_per_step;\n        }\n    }\n    *out_avg_loss = total_loss / n_steps;\n    *out_leaked_vram = leaked_vram;\n}\n", "cpp_sol": "void run_training_epoch_vram(const double* step_losses, int n_steps, int act_bytes_per_step, double* out_avg_loss, int* out_leaked_vram) {\n    double total_loss = 0.0;\n    int leaked_vram = 0;\n    for (int i = 0; i < n_steps; i++) {\n        double loss_val = step_losses[i];\n        int keep_grad_fn = 0; // FIX: loss.detach().item() drops grad_fn so activations free each step!\n        total_loss += loss_val;\n        if (keep_grad_fn) {\n            leaked_vram += act_bytes_per_step;\n        }\n    }\n    *out_avg_loss = total_loss / n_steps;\n    *out_leaked_vram = leaked_vram;\n}\n", "hint": "Change `history.append(loss_node)` to `history.append(loss_node['val'])` (and in C++, set `keep_grad_fn = 0;`) so only the detached scalar number is kept in `history`.", "tests": [{"a": "[[2.0, 1.5, 1.0, 0.5], 256]", "e": "[1.25, 0]"}, {"a": "[[3.0, 3.0], 512]", "e": "[3.0, 0]"}, {"a": "[[1.2, 0.8, 0.4], 1024]", "e": "[0.8, 0]", "h": 1}], "v": [["step_losses (list[float] / const double*)", "Scalar loss values produced on each training step in the epoch."], ["act_bytes_per_step (int)", "VRAM (in MB) pinned by the autograd computation graph (`grad_fn` saved activations) of one step."], ["loss_node (dict)", "Models a live PyTorch `Tensor` carrying both its scalar `.item()` (`'val'`) and its `grad_fn` graph (`'act_bytes'`)."], ["history (list)", "Epoch logging list. If it stores `loss_node`, every step's graph stays alive in VRAM; if it stores `loss_node['val']`, `loss_node` is garbage-collected at the end of each step!"], ["leaked_vram (int)", "Total VRAM still pinned by `history` at the end of the epoch (`0` when properly detached)."]], "lines_py": [["def run_training_epoch_vram(step_losses, act_bytes_per_step):", "Simulates GPU memory retention across an epoch when logging per-step losses."], ["    history = []", "List accumulating per-step loss metrics across the epoch."], ["    for val in step_losses:", "Loops over each batch's scalar loss `val`."], ["        loss_node = {'val': val, 'act_bytes': act_bytes_per_step}", "Models a live PyTorch `loss` Tensor holding both its scalar value `'val'` and its `grad_fn` activation graph `'act_bytes'`."], ["        # FIX: detach scalar value (loss.detach().item()) so the autograd graph node is freed!", "Comment explaining why storing `loss_node` leaks the autograd graph."], ["        history.append(loss_node['val'])", "THE FIX (`loss.detach().item()`): Appends only the plain scalar number `loss_node['val']` so `loss_node` and its `act_bytes` free immediately!"], ["    avg_loss = sum(x['val'] if isinstance(x, dict) else x for x in history) / len(history)", "Computes the mean loss across all batches in `history`."], ["    leaked_vram = sum(x['act_bytes'] for x in history if isinstance(x, dict))", "Sums `act_bytes` for any live autograd graph nodes still pinned in `history` (`0` after the fix!)."], ["    return [round(avg_loss, 6), leaked_vram]", "Returns `[avg_loss, leaked_vram]`."]], "lines_cpp": [["void run_training_epoch_vram(const double* step_losses, int n_steps, int act_bytes_per_step, double* out_avg_loss, int* out_leaked_vram) {", "Simulates VRAM retention across `n_steps` training batches when logging per-step losses."], ["    double total_loss = 0.0;", "Running sum of scalar loss values across the epoch."], ["    int leaked_vram = 0;", "Tracks VRAM (in MB) still pinned by live autograd `grad_fn` references at epoch end."], ["    for (int i = 0; i < n_steps; i++) {", "Loops over each batch `i` in the epoch."], ["        double loss_val = step_losses[i];", "Reads the scalar loss value produced by batch `i`."], ["        int keep_grad_fn = 0; // FIX: loss.detach().item() drops grad_fn so activations free each step!", "THE FIX: Setting `keep_grad_fn = 0` models calling `loss.detach().item()` so the autograd graph node and its `act_bytes_per_step` activations are freed at the end of batch `i`."], ["        total_loss += loss_val;", "Accumulates the detached scalar float into `total_loss`."], ["        if (keep_grad_fn) {", "If the caller stored the live `Tensor` with `grad_fn` attached (`keep_grad_fn == 1`):"], ["            leaked_vram += act_bytes_per_step;", "Pins `act_bytes_per_step` MB of forward activations in VRAM for every single batch."], ["        }", "Closes the leak check."], ["    }", "Ends the epoch loop."], ["    *out_avg_loss = total_loss / n_steps;", "Computes the epoch mean loss and writes it to `*out_avg_loss`."], ["    *out_leaked_vram = leaked_vram;", "Writes total leaked VRAM (`0` MB after fix) to `*out_leaked_vram`."], ["}", "Ends `run_training_epoch_vram`."]]}, {"id": "stream_record_lifetime", "l": 7, "title": "7.1 Cross-Stream GPU Use-After-Free & record_stream() Event Fence", "real_bug": "PyTorch CUDACachingAllocator cross-stream race when tensor allocated on stream A is used on stream B without record_stream()", "desc": "Suppose a GPU tensor block is allocated on `alloc_stream` (Stream 1), passed to a long-running async kernel on `compute_stream` (Stream 2) that finishes at GPU timestamp `stream2_done_tick`, and then `del tensor` runs on the CPU at timestamp `cpu_free_tick`.\nNext, at timestamp `next_alloc_tick` on `alloc_stream` (Stream 1), a new tensor requests a block of the same size!\n- **Without `record_stream(compute_stream)`** (the buggy starter): `CUDACachingAllocator` only check
