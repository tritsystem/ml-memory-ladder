s `alloc_stream`, thinks the block is free at `cpu_free_tick`, and hands the block to the new tensor at `next_alloc_tick` EVEN WHEN `next_alloc_tick < stream2_done_tick` — overwriting the buffer while Stream 2's kernel is still running (silent GPU Use-After-Free)!\n- **With `record_stream(compute_stream)`**: The block is fenced until `safe_reuse_tick = max(cpu_free_tick, stream2_done_tick)`. At `next_alloc_tick`, the block can be reused (`reused_block = True`) ONLY if `next_alloc_tick >= safe_reuse_tick`; otherwise the allocator MUST allocate a fresh block (`reused_block = False`) so Stream 2 is never corrupted!\nFix `can_reuse_stream_block(cpu_free_tick, stream2_done_tick, next_alloc_tick)` to return `[safe_reuse_tick, reused_block]`.", "py_name": "can_reuse_stream_block", "py_starter": "def can_reuse_stream_block(cpu_free_tick, stream2_done_tick, next_alloc_tick):\n    # BUG: forgets record_stream(stream2), so it ignores stream2_done_tick!\n    safe_reuse_tick = cpu_free_tick\n    reused_block = (next_alloc_tick >= safe_reuse_tick)\n    return [safe_reuse_tick, reused_block]\n", "py_sol": "def can_reuse_stream_block(cpu_free_tick, stream2_done_tick, next_alloc_tick):\n    # FIX (record_stream): block cannot be reused until BOTH cpu_free_tick AND stream2_done_tick have passed!\n    safe_reuse_tick = max(cpu_free_tick, stream2_done_tick)\n    reused_block = (next_alloc_tick >= safe_reuse_tick)\n    return [safe_reuse_tick, reused_block]\n", "cpp_name": "can_reuse_stream_block", "cpp_starter": "void can_reuse_stream_block(int cpu_free_tick, int stream2_done_tick, int next_alloc_tick, int* out_res) {\n    // BUG: ignores stream2_done_tick (missing record_stream)!\n    int safe_reuse_tick = cpu_free_tick;\n    int reused_block = (next_alloc_tick >= safe_reuse_tick) ? 1 : 0;\n    out_res[0] = safe_reuse_tick;\n    out_res[1] = reused_block;\n}\n", "cpp_sol": "void can_reuse_stream_block(int cpu_free_tick, int stream2_done_tick, int next_alloc_tick, int* out_res) {\n    int safe_reuse_tick = (cpu_free_tick > stream2_done_tick) ? cpu_free_tick : stream2_done_tick;\n    int reused_block = (next_alloc_tick >= safe_reuse_tick) ? 1 : 0;\n    out_res[0] = safe_reuse_tick;\n    out_res[1] = reused_block;\n}\n", "hint": "Set `safe_reuse_tick = max(cpu_free_tick, stream2_done_tick)` (or the ternary max in C++) so the block is not reused while `next_alloc_tick < stream2_done_tick`.", "tests": [{"a": "[10, 50, 25]", "e": "[50, False]"}, {"a": "[10, 50, 50]", "e": "[50, True]"}, {"a": "[40, 20, 30]", "e": "[40, False]"}, {"a": "[40, 20, 45]", "e": "[40, True]", "h": 1}], "v": [["cpu_free_tick (int)", "Timestamp when Python `del x` returned the block to `CUDACachingAllocator` on Stream 1."], ["stream2_done_tick (int)", "Timestamp when the CUDA event recorded by `x.record_stream(stream_2)` actually finishes executing on the GPU."], ["next_alloc_tick (int)", "Timestamp when a subsequent allocation on Stream 1 asks `CUDACachingAllocator` for a block."], ["safe_reuse_tick (int)", "Earliest timestamp at which the block's VRAM is guaranteed not to be read/written by either stream (`max(cpu_free_tick, stream2_done_tick)`)."], ["reused_block (bool / int)", "`True` (`1`) if `next_alloc_tick >= safe_reuse_tick` (safe to reuse); `False` (`0`) if Stream 2 is still busy and a fresh block must be used instead."]], "lines_py": [["def can_reuse_stream_block(cpu_free_tick, stream2_done_tick, next_alloc_tick):", "Models `CUDACachingAllocator` cross-stream lifetime safety (`x.record_stream(stream2)`)."], ["    # FIX (record_stream): block cannot be reused until BOTH cpu_free_tick AND stream2_done_tick have passed!", "Comment explaining cross-stream event synchronization."], ["    safe_reuse_tick = max(cpu_free_tick, stream2_done_tick)", "THE FIX: Fences the block until the later of `cpu_free_tick` (Stream 1 free) and `stream2_done_tick` (Stream 2 CUDA event completion)."], ["    reused_block = (next_alloc_tick >= safe_reuse_tick)", "Allows reusing the block at `next_alloc_tick` ONLY if `next_alloc_tick >= safe_reuse_tick`."], ["    return [safe_reuse_tick, reused_block]", "Returns `[safe_reuse_tick, reused_block]`."]], "lines_cpp": [["void can_reuse_stream_block(int cpu_free_tick, int stream2_done_tick, int next_alloc_tick, int* out_res) {", "Models `CUDACachingAllocator` cross-stream lifetime tracking (`tensor.record_stream(stream2)`)."], ["    int safe_reuse_tick = (cpu_free_tick > stream2_done_tick) ? cpu_free_tick : stream2_done_tick;", "THE FIX (`record_stream`): The block is only safe to reuse after BOTH `cpu_free_tick` (on Stream 1) AND `stream2_done_tick` (CUDA event on Stream 2) have completed!"], ["    int reused_block = (next_alloc_tick >= safe_reuse_tick) ? 1 : 0;", "Checks if the new allocation request at `next_alloc_tick` occurs at or after `safe_reuse_tick`."], ["    out_res[0] = safe_reuse_tick;", "Writes `safe_reuse_tick` to `out_res[0]`."], ["    out_res[1] = reused_block;", "Writes `reused_block` (`1` = safe to reuse, `0` = must allocate fresh block so Stream 2 isn't corrupted) to `out_res[1]`."], ["}", "Ends `can_reuse_stream_block`."]]}, {"id": "pinned_alloc_cleanup", "l": 7, "title": "7.2 Page-Locked (Pinned) Host Allocation & mlock Failure Cleanup (DeepSpeed page_alloc.cpp)", "real_bug": "deepspeedai/DeepSpeed csrc/pin_memory/page_alloc.cpp (ds_page_aligned_alloc mlock failure cleanup)", "desc": "In `deepspeed/csrc/pin_memory/page_alloc.cpp`, `ds_page_aligned_alloc(size)` allocates page-aligned host RAM for fast GPU DMA transfers and then calls Linux's `mlock(ptr, size)` to page-lock (pin) it:\n- First, round `req_bytes` UP to a multiple of `page_size` (4096 bytes): `aligned_bytes = ((req_bytes + page_size - 1) // page_size) * page_size`.\n- Allocate `aligned_bytes` on the heap (`heap_used += aligned_bytes`).\n- Next, attempt `mlock`: it succeeds only if `aligned_bytes <= mlock_limit_bytes` (Linux's `RLIMIT_MEMLOCK`).\n- **If `mlock` fails (`aligned_bytes > mlock_limit_bytes`)**: you MUST `free(ptr)` (`heap_used -= aligned_bytes`) and return `[0, heap_used]` (`0` = `nullptr` in C++)! (The buggy starter forgets to `free(ptr)` when `mlock` fails, leaking `aligned_bytes` of heap RAM!)\n- **If `mlock` succeeds**: return `[aligned_bytes, heap_used]`.", "py_name": "ds_page_aligned_alloc", "py_starter": "def ds_page_aligned_alloc(req_bytes, page_size, mlock_limit_bytes, heap_used):\n    if req_bytes <= 0:\n        return [0, heap_used]\n    aligned_bytes = ((req_bytes + page_size - 1) // page_size) * page_size\n    # Step 1: allocate page-aligned host buffer on the heap\n    heap_used += aligned_bytes\n    # Step 2: attempt mlock(ptr, aligned_bytes)\n    if aligned_bytes > mlock_limit_bytes:\n        # BUG: mlock failed, but starter returns nullptr (0) without freeing the heap buffer!\n        return [0, heap_used]\n    return [aligned_bytes, heap_used]\n", "py_sol": "def ds_page_aligned_alloc(req_bytes, page_size, mlock_limit_bytes, heap_used):\n    if req_bytes <= 0:\n        return [0, heap_used]\n    aligned_bytes = ((req_bytes + page_size - 1) // page_size) * page_size\n    # Step 1: allocate page-aligned host buffer on the heap\n    heap_used += aligned_bytes\n    # Step 2: attempt mlock(ptr, aligned_bytes)\n    if aligned_bytes > mlock_limit_bytes:\n        heap_used -= aligned_bytes\n        return [0, heap_used]\n    return [aligned_bytes, heap_used]\n", "cpp_name": "ds_page_aligned_alloc", "cpp_starter": "void ds_page_aligned_alloc(int req_bytes, int page_size, int mlock_limit_bytes, int heap_used, int* out_res) {\n    if (req_bytes <= 0) {\n        out_res[0] = 0; out_res[1] = heap_used; return;\n    }\n    int aligned_bytes = ((req_bytes + page_size - 1) / page_size) * page_size;\n    heap_used += aligned_bytes; // posix_memalign(&ptr, page_size, aligned_bytes)\n    if (aligned_bytes > mlock_limit_bytes) {\n        // BUG: mlock(ptr, aligned_bytes) != 0, returns nullptr without free(ptr)!\n        out_res[0] = 0;\n        out_res[1] = heap_used;\n        return;\n    }\n    out_res[0] = aligned_bytes;\n    out_res[1] = heap_used;\n}\n", "cpp_sol": "void ds_page_aligned_alloc(int req_bytes, int page_size, int mlock_limit_bytes, int heap_used, int* out_res) {\n    if (req_bytes <= 0) {\n        out_res[0] = 0; out_res[1] = heap_used; return;\n    }\n    int aligned_bytes = ((req_bytes + page_size - 1) / page_size) * page_size;\n    heap_used += aligned_bytes; // posix_memalign(&ptr, page_size, aligned_bytes)\n    if (aligned_bytes > mlock_limit_bytes) {\n        heap_used -= aligned_bytes; // free(ptr) on mlock failure before early return\n        out_res[0] = 0;\n        out_res[1] = heap_used;\n        return;\n    }\n    out_res[0] = aligned_bytes;\n    out_res[1] = heap_used;\n}\n", "hint": "Inside `if aligned_bytes > mlock_limit_bytes:`, add `heap_used -= aligned_bytes` (`free(ptr)`) right before returning `[0, heap_used]`.", "tests": [{"a": "[1000, 4096, 8192, 0]", "e": "[4096, 4096]"}, {"a": "[5000, 4096, 4096, 1024]", "e": "[0, 1024]"}, {"a": "[4096, 4096, 4096, 0]", "e": "[4096, 4096]"}, {"a": "[0, 4096, 4096, 512]", "e": "[0, 512]", "h": 1}], "v": [["req_bytes (int)", "Unaligned byte count requested for a pinned host staging buffer."], ["page_size (int)", "OS virtual memory page size in bytes (typically `4096` bytes on x86_64 Linux)."], ["mlock_limit_bytes (int)", "Maximum bytes the process is allowed to page-lock (`RLIMIT_MEMLOCK`)."], ["heap_used (int)", "Total heap bytes currently allocated by the process."], ["aligned_bytes (int)", "`req_bytes` rounded up to a whole number of OS pages (`((req_bytes + page_size - 1) // page_size) * page_size`)."]], "lines_py": [["def ds_page_aligned_alloc(req_bytes, page_size, mlock_limit_bytes, heap_used):", "Models `ds_page_aligned_alloc` in `deepspeed/csrc/pin_memory/page_alloc.cpp`."], ["    if req_bytes <= 0:", "Guards against zero or negative allocation requests."], ["        return [0, heap_used]", "Returns `0` (`nullptr`) without changing `heap_used`."], ["    aligned_bytes = ((req_bytes + page_size - 1) // page_size) * page_size", "Rounds `req_bytes` UP to a whole multiple of `page_size` (`4096` bytes)."], ["    # Step 1: allocate page-aligned host buffer on the heap", "Comment marking the heap allocation step (`posix_memalign`)."], ["    heap_used += aligned_bytes", "Reserves `aligned_bytes` on the CPU heap."], ["    # Step 2: attempt mlock(ptr, aligned_bytes)", "Comment marking the `mlock` page-locking syscall."], ["    if aligned_bytes > mlock_limit_bytes:", "Detects when `mlock` fails because `aligned_bytes` exceeds `mlock_limit_bytes` (`RLIMIT_MEMLOCK`)."], ["        heap_used -= aligned_bytes", "THE FIX: Calls `free(ptr)` (`heap_used -= aligned_bytes`) before returning `0` (`nullptr`) on `mlock` failure!"], ["        return [0, heap_used]", "Returns `[0, heap_used]` with zero leaked heap bytes."], ["    return [aligned_bytes, heap_used]", "Pinning succeeded: returns `[aligned_bytes, heap_used]`."]], "lines_cpp": [["void ds_page_aligned_alloc(int req_bytes, int page_size, int mlock_limit_bytes, int heap_used, int* out_res) {", "Models `ds_page_aligned_alloc` in `deepspeed/csrc/pin_memory/page_alloc.cpp`."], ["    if (req_bytes <= 0) {", "Rejects zero or negative byte allocation requests."], ["        out_res[0] = 0; out_res[1] = heap_used; return;", "Returns `0` (`nullptr`) and leaves `heap_used` unchanged."], ["    }", "Closes the `req_bytes <= 0` guard."], ["    int aligned_bytes = ((req_bytes + page_size - 1) / page_size) * page_size;", "Rounds `req_bytes` UP to the next multiple of `page_size` (`4096` bytes) for page-aligned DMA."], ["    heap_used += aligned_bytes; // posix_memalign(&ptr, page_size, aligned_bytes)", "Allocates `aligned_bytes` on the CPU heap."], ["    if (aligned_bytes > mlock_limit_bytes) {", "Checks if `mlock(ptr, aligned_bytes)` fails because `aligned_bytes` exceeds Linux's `RLIMIT_MEMLOCK` cap."], ["        heap_used -= aligned_bytes; // free(ptr) on mlock failure before early return", "THE FIX: Frees the heap buffer (`free(ptr)`) before returning `nullptr` so the failed pin attempt does not leak `aligned_bytes`!"], ["        out_res[0] = 0;", "Writes `0` (`nullptr`) to `out_res[0]`."], ["        out_res[1] = heap_used;", "Writes restored `heap_used` (zero leaked bytes) to `out_res[1]`."], ["        return;", "Exits early on `mlock` failure."], ["    }", "Closes the `mlock` failure branch."], ["    out_res[0] = aligned_bytes;", "Pinning succeeded: returns `aligned_bytes` (non-null pinned buffer)."], ["    out_res[1] = heap_used;", "Writes `heap_used` (including the live pinned buffer) to `out_res[1]`."], ["}", "Ends `ds_page_aligned_alloc`."]]}, {"id": "dynamic_cache_reset", "l": 8, "title": "8.1 DynamicCache & QuantizedLayer reset() Resurrection Bug (Transformers #48509 / #48809)", "real_bug": "huggingface/transformers#48509 & #48809 (DynamicLayer.reset & QuantizedLayer.reset leaving is_initialized=True and stale zero/quantized tokens)", "desc": "In `huggingface/transformers`, `DynamicLayer` (and its subclass `QuantizedLayer`) stores past keys in `keys` (and quantized history in `quantized_keys`), with boolean flag `is_initialized`.\nWhen `update(new_keys)` runs:\n- If `not is_initialized`: it initializes the cache fresh (`keys = list(new_keys)`, `quantized_keys = list(new_keys)`, `is_initialized = True`).\n- If `is_initialized`: it concatenates `new_keys` onto the existing history (`keys = quantized_keys + list(new_keys)` for `QuantizedLayer`, or `keys = keys + list(new_keys)`).\nLook at what the buggy inherited `CacheLayerMixin.reset()` did on `DynamicLayer` / `QuantizedLayer`:\nIt only zeroed `keys` in-place (`keys = [0] * len(keys)`) and left `quantized_keys` and `is_initialized = True` untouched! So after `reset()`, calling `update(prompt2_keys)` saw `is_initialized == True` and concatenated `prompt2_keys` onto the old conversation's `quantized_keys` (or stale zeros)!\nFix `reset_and_update_dynamic_cache(prompt1_keys, prompt2_keys, is_quantized)` so that the `reset()` step properly sets `keys = []`, `quantized_keys = []`, and `is_initialized = False` before `prompt2_keys` is updated, returning `[len(keys), keys]`.", "py_name": "reset_and_update_dynamic_cache", "py_starter": "def reset_and_update_dynamic_cache(prompt1_keys, prompt2_keys, is_quantized):\n    # Conversation 1: update cache with prompt1_keys\n    keys = list(prompt1_keys)\n    quantized_keys = list(prompt1_keys) if is_quantized else []\n    is_initialized = True\n    # BUG (transformers#48509): inherited reset() zeroes `keys` in-place, leaves is_initialized=True and quantized_keys intact!\n    keys = [0] * len(keys)\n    # Conversation 2: update cache with prompt2_keys\n    if not is_initialized:\n        keys = list(prompt2_keys)\n        quantized_keys = list(prompt2_keys) if is_quantized else []\n        is_initialized = True\n    else:\n        base = quantized_keys if is_quantized else keys\n        keys = base + list(prompt2_keys)\n    return [len(keys), keys]\n", "py_sol": "def reset_and_update_dynamic_cache(prompt1_keys, prompt2_keys, is_quantized):\n    # Conversation 1: update cache with prompt1_keys\n    keys = list(prompt1_keys)\n    quantized_keys = list(prompt1_keys) if is_quantized else []\n    is_initialized = True\n    # FIX (DynamicLayer.reset): drop state and mark is_initialized = False instead of zeroing in-place!\n    keys = []\n    quantized_keys = []\n    is_initialized = False\n    # Conversation 2: update cache with prompt2_keys\n    if not is_initialized:\n        keys = list(prompt2_keys)\n        quantized_keys = list(prompt2_keys) if is_quantized else []\n        is_initialized = True\n    else:\n        base = quantized_keys if is_quantized else keys\n        keys = base + list(prompt2_keys)\n    return [len(keys), keys]\n", "cpp_name": "reset_and_update_dynamic_cache", "cpp_starter": "void reset_and_update_dynamic_cache(const int* p1, int len1, const int* p2, int len2, int is_quantized, int* out_len, int* out_keys) {\n    int keys[32], q_keys[32];\n    int cur_len = len1;\n    for (int i = 0; i < len1; i++) { keys[i] = p1[i]; q_keys[i] = p1[i]; }\n    int is_initialized = 1;\n    // BUG (transformers#48509): reset() zeroes keys in-place, keeps cur_len and is_initialized=1!\n    for (int i = 0; i < cur_len; i++) { keys[i] = 0; }\n    // Conversation 2 update(p2):\n    if (!is_initialized) {\n        cur_len = len2;\n        for (int i = 0; i < len2; i++) { out_keys[i] = p2[i]; }\n    } else {\n        for (int i = 0; i < cur_len; i++) { out_keys[i] = is_quantized ? q_keys[i] : keys[i]; }\n        for (int i = 0; i < len2; i++) { out_keys[cur_len + i] = p2[i]; }\n        cur_len = cur_len + len2;\n    }\n    *out_len = cur_len;\n}\n", "cpp_sol": "void reset_and_update_dynamic_cache(const int* p1, int len1, const int* p2, int len2, int is_quantized, int* out_len, int* out_keys) {\n    int keys[32], q_keys[32];\n    int cur_len = len1;\n    for (int i = 0; i < len1; i++) { keys[i] = p1[i]; q_keys[i] = p1[i]; }\n    int is_initialized = 1;\n    // FIX (DynamicLayer.reset): reset cur_len = 0 and is_initialized = 0!\n    cur_len = 0;\n    is_initialized = 0;\n    // Conversation 2 update(p2):\n    if (!is_initialized) {\n        cur_len = len2;\n        for (int i = 0; i < len2; i++) { out_keys[i] = p2[i]; }\n    } else {\n        for (int i = 0; i < cur_len; i++) { out_keys[i] = is_quantized ? q_keys[i] : keys[i]; }\n        for (int i = 0; i < len2; i++) { out_keys[cur_len + i] = p2[i]; }\n        cur_len = cur_len + len2;\n    }\n    *out_len = cur_len;\n}\n", "hint": "In the reset step, replace `keys = [0] * len(keys)` with `keys = []`, `quantized_keys = []`, and `is_initialized = False` (and in C++, set `cur_len = 0; is_initialized = 0;`).", "tests": [{"a": "[[11, 12, 13, 14, 15, 16], [21, 22, 23], False]", "e": "[3, [21, 22, 23]]"}, {"a": "[[11, 12, 13, 14, 15, 16], [21, 22, 23], True]", "e": "[3, [21, 22, 23]]"}, {"a": "[[99], [1, 2], True]", "e": "[2, [1, 2]]"}, {"a": "[[5, 6], [7], False]", "e": "[1, [7]]", "h": 1}], "v": [["prompt1_keys (list[int] / const int*)", "Key tokens stored in the KV-cache during Conversation 1 (before `.reset()`)."], ["prompt2_keys (list[int] / const int*)", "Key tokens arriving at the start of Conversation 2 (after `.reset()`)."], ["is_quantized (bool / int)", "Whether the cache layer is a `QuantizedLayer` (which stores past tokens in `_quantized_keys`) or a plain `DynamicLayer`."], ["keys (list[int])", "`self.keys` tensor on `DynamicLayer`. In `DynamicLayer`, `get_seq_length()` is `len(keys)` (`keys.shape[-2]`)!"], ["quantized_keys (list[int])", "`self._quantized_keys` on `QuantizedLayer`. Untouched by `self.keys.zero_()`, so leaving `is_initialized=True` resurrected Conversation 1's keys!"], ["is_initialized (bool / int)", "Flag telling `update()` whether the layer already holds valid history (`True`) or is empty (`False`)."]], "lines_py": [["def reset_and_update_dynamic_cache(prompt1_keys, prompt2_keys, is_quantized):", "Models `DynamicLayer.reset()` and `QuantizedLayer.reset()` in `huggingface/transformers#48509` / `#48809`."], ["    # Conversation 1: update cache with prompt1_keys", "Comment marking Conversation 1 filling the KV-cache."], ["    keys = list(prompt1_keys)", "Stores Conversation 1's key tokens into `keys` (`self.keys`)."], ["    quantized_keys = list(prompt1_keys) if is_quantized else []", "For `QuantizedLayer`, also stores quantized keys in `quantized_keys` (`self._quantized_keys`)."], ["    is_initialized = True", "Marks the cache layer initialized (`self.is_initialized = True`)."], ["    # FIX (DynamicLayer.reset): drop state and mark is_initialized = False instead of zeroing in-place!", "Comment explaining why `self.keys.zero_()` corrupted `DynamicLayer` and `QuantizedLayer`."], ["    keys = []", "THE FIX (Part 1): Drops `self.keys` (`None` / `[]`) instead of zeroing in-place so `get_seq_length()` becomes `0`."], ["    quantized_keys = []", "THE FIX (Part 2): Clears `quantized_keys` so pre-reset tokens are not retained."], ["    is_initialized = False", "THE FIX (Part 3): Resets `is_initialized = False` so Conversation 2 takes the fresh initialization branch!"], ["    # Conversation 2: update cache with prompt2_keys", "Comment marking Conversation 2 calling `update(prompt2_keys)` after `reset()`."], ["    if not is_initialized:", "Fresh initialization branch taken when `is_initialized` is `False`."], ["        keys = list(prompt2_keys)", "Sets `keys` to contain ONLY Conversation 2's `prompt2_keys`."], ["        quantized_keys = list(prompt2_keys) if is_quantized else []", "Initializes `quantized_keys` cleanly for Conversation 2."], ["        is_initialized = True", "Marks the layer initialized for Conversation 2."], ["    else:", "Append branch (wrongly taken after `reset()` when `is_initialized` was left `True`!)."], ["        base = quantized_keys if is_quantized else keys", "Selects `_quantized_keys` (resurrecting Conversation 1!) or `keys` (stale zeros)."], ["        keys = base + list(prompt2_keys)", "Concatenates Conversation 2's keys onto the stale prefix."], ["    return [len(keys), keys]", "Returns `[get_seq_length(), keys]`."]], "lines_cpp": [["void reset_and_update_dynamic_cache(const int* p1, int len1, const int* p2, int len2, int is_quantized, int* out_len, int* out_keys) {", "Models `DynamicLayer.reset()` and `QuantizedLayer.reset()` in `huggingface/transformers#48509` / `#48809`."], ["    int keys[32], q_keys[32];", "Backing arrays modeling `self.keys` and `self._quantized_keys`."], ["    int cur_len = len1;", "After Conversation 1, the dynamic sequence length is `len1`."], ["    for (int i = 0; i < len1; i++) { keys[i] = p1[i]; q_keys[i] = p1[i]; }", "Stores Conversation 1's keys into `keys` and (for `QuantizedLayer`) `q_keys`."], ["    int is_initialized = 1;", "Marks the cache layer initialized (`self.is_initialized = True`)."], ["    // FIX (DynamicLayer.reset): reset cur_len = 0 and is_initialized = 0!", "Comment explaining why ] * window_size` using a circular write cursor `cursor = step % window_size` and tracks `count` (how many total items have been written so far).\nWhen `stream1` writes `len(stream1)` values, we save a checkpoint (`state_dict`), load it into a fresh ring buffer, and write `stream2`.\nIn your `TorchMetrics` `Running` finding, `state_dict` saved `buf` (`val_list`), but **forgot to save the write position / count**, so after loading the checkpoint, `count` reset to `0` (and `cursor` reset to `0`), overwriting `buf[0]` instead of continuing at `len(stream1) % window_size`!\nFix `resume_ring_buffer(window_size, stream1, stream2)` so the checkpoint saves and restores BOTH `'buf'` and `'count'`, and return `[buf, sum(buf[:min(count, window_size)])]`.", "py_name": "resume_ring_buffer", "py_starter": "def write_ring(state, x, window_size):\n    idx = state['count'] % window_size\n    state['buf'][idx] = x\n    state['count'] += 1\n\ndef resume_ring_buffer(window_size, stream1, stream2):\n    ring1 = {'buf': [0] * window_size, 'count': 0}\n    for x in stream1:\n        write_ring(ring1, x, window_size)\n    # BUG (TorchMetrics Running): saves 'buf' in state_dict, but forgets 'count' (the ring cursor)!\n    state_dict = {'buf': list(ring1['buf'])}\n    # Fresh ring buffer on resume:\n    ring2 = {'buf': [0] * window_size, 'count': 0}\n    ring2.update(state_dict)\n    for x in stream2:\n        write_ring(ring2, x, window_size)\n    valid = min(ring2['count'], window_size)\n    return [ring2['buf'], sum(ring2['buf'][:valid])]\n", "py_sol": "def write_ring(state, x, window_size):\n    idx = state['count'] % window_size\n    state['buf'][idx] = x\n    state['count'] += 1\n\ndef resume_ring_buffer(window_size, stream1, stream2):\n    ring1 = {'buf': [0] * window_size, 'count': 0}\n    for x in stream1:\n        write_ring(ring1, x, window_size)\n    # FIX: persist BOTH the backing array 'buf' AND the write cursor 'count' in state_dict!\n    state_dict = {'buf': list(ring1['buf']) /* Fast offline Python-subset & C++ transpiler so tests also run instantaneously even without internet! */
function transpilePyToJs(pyCode, fnName){
  var lines = pyCode.replace(/\r\n/g, '\n').split('\n');
  var out = [];
  var stack = [0];
  for(var i=0;i<lines.length;i++){
    var raw = lines[i];
    var stripped = raw.replace(/#.*$/, '');
    if(!stripped.trim()) continue;
    var indent = stripped.match(/^\s*/)[0].length;
    var s = stripped.trim();
    while(stack.length > 1 && indent < stack[stack.length-1]){
      stack.pop();
      out.push('}');
    }
    if(/^def\s+/.test(s)){
      var m = s.match(/^def\s+([A-Za-z0-9_]+)\s*\(([^)]*)\)\s*:/);
      if(!m) throw new Error('Syntax error on line '+(i+1)+': '+s);
      out.push('function '+m[1]+'('+m[2]+') {');
      stack.push(indent + 4);
      continue;
    }
    if(/^(if|elif|while|for|else)\b/.test(s)){
      var mIf = s.match(/^if\s+(.*):$/);
      if(mIf){
        out.push('if (' + pyExprToJs(mIf[1]) + ') {');
        stack.push(indent + 4);
        continue;
      }
      var mElif = s.match(/^elif\s+(.*):$/);
      if(mElif){
        out.push('else if (' + pyExprToJs(mElif[1]) + ') {');
        stack.push(indent + 4);
        continue;
      }
      if(/^else\s*:$/.test(s)){
        out.push('else {');
        stack.push(indent + 4);
        continue;
      }
      var mWh = s.match(/^while\s+(.*):$/);
      if(mWh){
        out.push('while (' + pyExprToJs(mWh[1]) + ') {');
        stack.push(indent + 4);
        continue;
      }
      var fm = s.match(/^for\s+([A-Za-z0-9_]+)\s+in\s+range\((.+)\)\s*:$/);
      if(fm){
        var v = fm[1], rarg = pyExprToJs(fm[2]);
        out.push('for (var '+v+' = 0; '+v+' < ('+rarg+'); '+v+'++) {');
        stack.push(indent + 4);
        continue;
      }
      var fm2 = s.match(/^for\s+([A-Za-z0-9_]+)\s+in\s+(.*):$/);
      if(fm2){
        var v2 = fm2[1], coll = pyExprToJs(fm2[2]), idxv = '_i_'+i;
        out.push('var _c_'+i+' = '+coll+'; for (var '+idxv+' = 0; '+idxv+' < _c_'+i+'.length; '+idxv+'++) { var '+v2+' = _c_'+i+'['+idxv+'];');
        stack.push(indent + 4);
        continue;
      }
    }
    if(/^return\b/.test(s)){
      var rexpr = s.replace(/^return\s*/, '');
      out.push('return ' + pyExprToJs(rexpr) + ';');
      continue;
    }
    /* slice assignment or regular statement */
    var assignM = s.match(/^([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)$/);
    if(assignM){
      out.push('var ' + assignM[1] + ' = ' + pyExprToJs(assignM[2]) + ';');
    } else {
      out.push(pyExprToJs(s) + ';');
    }
  }
  while(stack.length > 1){ stack.pop(); out.push('}'); }
  return out.join('\n');
}

function replaceCall(str, fnName, replacer){
  var rx = new RegExp('\\b' + fnName + '\\(');
  var guard = 0;
  while(guard++ < 40){
    var m = rx.exec(str);
    if(!m) break;
    var start = m.index;
    var openIdx = start + m[0].length - 1;
    var depth = 1, i = openIdx + 1;
    for(; i < str.length && depth > 0; i++){
      if(str[i] === '(') depth++;
      else if(str[i] === ')') depth--;
    }
    if(depth !== 0) break;
    var inner = str.slice(openIdx + 1, i - 1);
    var args = [], cur = '', d = 0;
    for(var j = 0; j < inner.length; j++){
      var ch = inner[j];
      if(ch === '(' || ch === '[' || ch === '{') d++;
      else if(ch === ')' || ch === ']' || ch === '}') d--;
      if(ch === ',' && d === 0){ args.push(cur.trim()); cur = ''; }
      else cur += ch;
    }
    if(cur.trim() || args.length > 0) args.push(cur.trim());
    var rep = replacer(args, inner);
    str = str.slice(0, start) + rep + str.slice(i);
  }
  return str;
}

function pyExprToJs(e){
  e = e.trim();
  /* Handle `[0] * count` or `storage + [0] * (n)` */
  e = e.replace(/\[0\]\s*\*\s*\(([^)]+)\)/g, '_zeros($1)');
  e = e.replace(/\[0\]\s*\*\s*([A-Za-z0-9_]+)/g, '_zeros($1)');
  /* Handle list comprehensions: `[expr for v in range(n)]` or `[b for b in pool if b >= req_bytes]` */
  var lcRange = e.match(/^\[\s*(.+?)\s+for\s+([A-Za-z0-9_]+)\s+in\s+range\((.+)\)\s*\]$/);
  if(lcRange){
    return '_lcRange(' + pyExprToJs(lcRange[3]) + ', function(' + lcRange[2] + '){ return ' + pyExprToJs(lcRange[1]) + '; })';
  }
  var lcFilt = e.match(/^\[\s*([A-Za-z0-9_]+)\s+for\s+([A-Za-z0-9_]+)\s+in\s+([A-Za-z0-9_]+)\s+if\s+(.+?)\s*\]$/);
  if(lcFilt){
    return lcFilt[3] + '.filter(function(' + lcFilt[2] + '){ return ' + pyExprToJs(lcFilt[4]) + '; })';
  }
  /* Handle `sum(x['val'] if isinstance(x, dict) else x for x in history)` */
  if(/sum\(x\['val'\]\s+if\s+isinstance\(x,\s*dict\)\s+else\s+x\s+for\s+x\s+in\s+history\)/.test(e)){
    e = e.replace(/sum\(x\['val'\]\s+if\s+isinstance\(x,\s*dict\)\s+else\s+x\s+for\s+x\s+in\s+history\)/g,
      '_sumHistVal(history)');
  }
  if(/sum\(x\['act_bytes'\]\s+for\s+x\s+in\s+history\s+if\s+isinstance\(x,\s*dict\)\)/.test(e)){
    e = e.replace(/sum\(x\['act_bytes'\]\s+for\s+x\s+in\s+history\s+if\s+isinstance\(x,\s*dict\)\)/g,
      '_sumHistAct(history)');
  }
  /* Handle slice `a[b : c]` or `a[:c]` */
  e = e.replace(/([A-Za-z0-9_\]\['"]+)\[\s*:\s*([^\]]+)\]/g, '$1.slice(0, $2)');
  e = e.replace(/([A-Za-z0-9_\]\['"]+)\[([^:\]]+)\s*:\s*([^\]]+)\]/g, '$1.slice($2, $3)');
  /* Handle ternary `A if COND else B` */
  var tern = e.match(/^(.+?)\s+if\s+(.+?)\s+else\s+(.+)$/);
  if(tern){
    return '((' + pyExprToJs(tern[2]) + ') ? (' + pyExprToJs(tern[1]) + ') : (' + pyExprToJs(tern[3]) + '))';
  }
  /* Floor division `a // b` */
  e = e.replace(/(\([^)]+\)|[A-Za-z0-9_]+)\s*\/\/\s*([A-Za-z0-9_]+)/g, 'Math.floor($1 / $2)');
  e = e.replace(/\bis\s+None\b/g, '=== null');
  e = e.replace(/\bis\s+not\s+None\b/g, '!== null');
  e = e.replace(/\bNone\b/g, 'null');
  e = e.replace(/\bTrue\b/g, 'true');
  e = e.replace(/\bFalse\b/g, 'false');
  e = e.replace(/\band\b/g, '&&');
  e = e.replace(/\bor\b/g, '||');
  e = e.replace(/\bnot\s+/g, '!');
  e = replaceCall(e, 'len', function(a, inner){ return '(' + inner + ').length'; });
  e = replaceCall(e, 'list', function(a, inner){ return '(' + inner + ').slice()'; });
  e = replaceCall(e, 'sum', function(a, inner){ return '_sum(' + inner + ')'; });
  e = replaceCall(e, 'max', function(a, inner){ return '_max(' + inner + ')'; });
  e = replaceCall(e, 'min', function(a, inner){ return '_min(' + inner + ')'; });
  e = replaceCall(e, 'round', function(a, inner){ return '_round(' + a[0] + ', ' + a[1] + ')'; });
  e = e.replace(/\.append\(/g, '.push(');
  e = e.replace(/\.remove\(/g, '._removeVal(');
  e = e.replace(/\.update\(/g, '._updateDict(');
  /* List concatenation `base + list(prompt2_keys)` or `storage + _zeros(...)` */
  e = e.replace(/\b(storage|base)\s*\+\s*/g, '$1.concat(');
  if(/\b(storage|base)\.concat\(/.test(e)) e = e + ')';
  return e;
}

var JS_HELPERS =
  "Array.prototype._removeVal = function(v){ var i = this.indexOf(v); if(i>=0) this.splice(i,1); };\n" +
  "Object.prototype._updateDict = function(o){ if(o) for(var k in o) if(Object.prototype.hasOwnProperty.call(o,k)) this[k] = o[k]; };\n" +
  "function _zeros(n){ var a=[]; for(var i=0;i<n;i++) a.push(0); return a; }\n" +
  "function _sum(a){ var s=0; for(var i=0;i<a.length;i++) s+=a[i]; return s; }\n" +
  "function _max(a,b){ if(arguments.length>1) return a>b?a:b; var m=a[0]; for(var i=1;i<a.length;i++) if(a[i]>m) m=a[i]; return m; }\n" +
  "function _min(a,b){ if(arguments.length>1) return a<b?a:b; var m=a[0]; for(var i=1;i<a.length;i++) if(a[i]<m) m=a[i]; return m; }\n" +
  "function _round(v,d){ var p=Math.pow(10,d); return Math.round(v*p)/p; }\n" +
  "function _lcRange(n,fn){ var a=[]; for(var i=0;i<n;i++) a.push(fn(i)); return a; }\n" +
  "function _sumHistVal(h){ var s=0; for(var i=0;i<h.length;i++){ var x=h[i]; s += (x && typeof x==='object') ? x.val : x; } return s; }\n" +
  "function _sumHistAct(h){ var s=0; for(var i=0;i<h.length;i++){ var x=h[i]; if(x && typeof x==='object') s += x.act_bytes; } return s; }\n";

function runPyFastJs(ex, code){
  var jsBody = JS_HELPERS + transpilePyToJs(code, ex.py_name) + "\nreturn " + ex.py_name + ";";
  var fn = (new Function(jsBody))();
  return gradeFn(fn, ex.tests);
}

function transpileCppToJsBrowser(cppCode){
  var src = cppCode.replace(/\/\/[^\n]*/g, '');
  src = src.replace(/\b(void|int\s*\*|int|long\s+long|double)\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(([^)]*)\)\s*\{/g, function(_, ret, name, params){
    var pnames = [];
    var ps = params.split(',');
    for(var i=0;i<ps.length;i++){
      var p = ps[i].trim();
      if(!p) continue;
      var toks = p.match(/[A-Za-z_][A-Za-z0-9_]*/g);
      if(toks) pnames.push(toks[toks.length-1]);
    }
    return 'function ' + name + '(' + pnames.join(', ') + ') {';
  });
  src = src.replace(/\bint\s+([A-Za-z_][A-Za-z0-9_]*)\s*\[\s*\d+\s*\]\s*,\s*([A-Za-z_][A-Za-z0-9_]*)\s*\[\s*\d+\s*\]\s*;/g, 'var $1 = [], $2 = [];');
  src = src.replace(/\bint\s+([A-Za-z_][A-Za-z0-9_]*)\s*\[\s*\d+\s*\]\s*=\s*\{\s*([^}]+)\s*\}\s*;/g, 'var $1 = [$2];');
  src = src.replace(/\bint\s+([A-Za-z_][A-Za-z0-9_]*)\s*\[\s*\d+\s*\]\s*;/g, 'var $1 = [];');
  src = src.replace(/\(\s*long\s+long\s*\)/g, '');
  src = src.replace(/\b(long\s+long|int\s*\*|int|double)\s+/g, 'var ');
  src = src.replace(/\(\*([A-Za-z_][A-Za-z0-9_]*)\)/g, '$1[0]');
  src = src.replace(/\*([A-Za-z_][A-Za-z0-9_]*)/g, '$1[0]');
  var addrMatches = src.match(/&([A-Za-z_][A-Za-z0-9_]*)/g) || [];
  var seen = {};
  for(var k=0;k<addrMatches.length;k++){
    var v = addrMatches[k].slice(1);
    if(seen[v]) continue;
    seen[v] = 1;
    src = src.replace(new RegExp('\\bvar\\s+' + v + '\\s*=\\s*([^;]+);', 'g'), 'var ' + v + ' = [$1];');
    src = src.replace(new RegExp('&' + v + '\\b', 'g'), v);
    src = src.replace(new RegExp('\\b' + v + '\\b(?!\\s*\\[)(?!\\s*=)', 'g'), v + '[0]');
    src = src.split('var ' + v + '[0]').join('var ' + v);
    src = src.replace(new RegExp('(step_ada|write_ring)\\(([^)]*)\\b' + v + '\\[0\\]', 'g'), '$1($2' + v);
    src = src.replace(new RegExp('(step_ada|write_ring)\\(([^)]*)\\b' + v + '\\[0\\]', 'g'), '$1($2' + v);
  }
  src = src.replace(/\bNULL\b/g, 'null');
  /* Preserve C++ integer division semantics in JS for page rounding and overflow bounds */
  src = src.replace(/\(\s*\(\s*req_bytes\s*\+\s*page_size\s*-\s*1\s*\)\s*\/\s*page_size\s*\)/g, 'Math.floor((req_bytes + page_size - 1) / page_size)');
  src = src.replace(/uint32_max\s*\/\s*elem_bytes/g, 'Math.floor(uint32_max / elem_bytes)');
  return src;
}

function wrapCppAdapter(ex, fn){
  var id = ex.id;
  return function(){
    var a = Array.prototype.slice.call(arguments);
    if(id === 'null_guard'){
      var buf = [];
      var rc = fn(a[0], a[1], a[2], a[3], buf);
      return rc === 1 ? buf.slice(0, a[0]) : null;
    }
    if(id === 'compound_guard'){
      var st = [0,0,0];
      fn(a[0], a[0].length, a[1], st);
      return [st[0] === 1, st[1], st[2]];
    }
    if(id === 'reassigned_leak'){
      var r3 = [0,0,0];
      fn(a[0], a[1], a[2], a[3], r3);
      return r3;
    }
    if(id === 'early_exit_uaf'){
      var r3u = [0,0,0];
      fn(a[0], a[1], r3u);
      return r3u;
    }
    if(id === 'loop_scratch_leak'){
      var r2 = [0,0];
      fn(a[0], a[0].length, r2);
      return r2;
    }
    if(id === 'tensor_view_uaf'){
      var sl = [];
      fn(a[0], a[0].length, a[1], a[2], a[3], a[4], a[5], sl);
      if(sl.indexOf(-999999) >= 0) return sl;
      return sl.slice(0, a[5]);
    }
    if(id === 'alloc_overflow'){
      /* Simulate 32-bit unsigned bitmask cleanly in JS using Math.imul / modulo */
      return fn(a[0], a[1], a[2], a[3]);
    }
    if(id === 'kv_dtype_memcpy'){
      var dtMap = {'fp32':0, 'fp16':1, 'bf16':2};
      var cv = a[0].slice();
      var rc2 = fn(cv, dtMap[a[1]], a[2], dtMap[a[3]], a[4]);
      if(rc2 === -999) return 'ABORT_BYTE_WIDTH_MISMATCH';
      if(rc2 === -888) return 'CORRUPT_RAW_BITS';
      return cv;
    }
    if(id === 'inplace_counter_alias'){
      var pos = [], ncl = [0];
      fn(a[0][0], a[1], pos, ncl);
      return [pos, ncl[0]];
    }
    if(id === 'persistent_buffer_state'){
      var op = [0], os = [0];
      fn(a[0], a[1], a[2], a[3], a[4], op, os);
      return [Math.round(op[0]*1e6)/1e6, os[0]];
    }
    if(id === 'cuda_pool_alloc'){
      var cr = [0,0,0];
      fn(a[0], a[0].length, a[1], a[2], a[3], cr);
      return cr;
    }
    if(id === 'autograd_graph_leak'){
      var al = [0], lv = [0];
      fn(a[0], a[0].length, a[1], al, lv);
      return [Math.round(al[0]*1e6)/1e6, lv[0]];
    }
    if(id === 'stream_record_lifetime'){
      var sr = [0,0];
      fn(a[0], a[1], a[2], sr);
      return [sr[0], sr[1] === 1];
    }
    if(id === 'pinned_alloc_cleanup'){
      var pr = [0,0];
      fn(a[0], a[1], a[2], a[3], pr);
      return pr;
    }
    if(id === 'dynamic_cache_reset'){
      var ol = [0], ok = [];
      fn(a[0], a[0].length, a[1], a[1].length, a[2]?1:0, ol, ok);
      return [ol[0], ok.slice(0, ol[0])];
    }
    if(id === 'ring_buffer_state_dict'){
      var ob = [], osum = [0];
      fn(a[0], a[1], a[1].length, a[2], a[2].length, ob, osum);
      return [ob.slice(0, a[0]), osum[0]];
    }
    return fn.apply(null, a);
  };
}

function eqVal(a, b){
  if(typeof a === 'boolean' || typeof b === 'boolean') return a === b;
  if(typeof a === 'number' && typeof b === 'number') return Math.abs(a - b) <= 1e-6 * Math.max(1, Math.abs(b));
  if(Array.isArray(a) && Array.isArray(b)){
    if(a.length !== b.length) return false;
    for(var i=0;i<a.length;i++) if(!eqVal(a[i], b[i])) return false;
    return true;
  }
  return a === b;
}

function fmtVal(v){
  if(v === null) return 'None / NULL';
  if(v === undefined) return 'undefined';
  try{ return JSON.stringify(v); }catch(e){ return String(v); }
}

function pyLitToJs(s){
  return s.replace(/\bNone\b/g, 'null').replace(/\bTrue\b/g, 'true').replace(/\bFalse\b/g, 'false');
}

function gradeFn(fn, tests){
  var results = [], allPass = true;
  for(var i=0;i<tests.length;i++){
    var t = tests[i], r = {hidden: !!t.h, pass: false, a: t.a};
    try{
      var args = (new Function('return (' + pyLitToJs(t.a) + ')'))();
      var exp = (new Function('return (' + pyLitToJs(t.e) + ')'))();
      r.e = fmtVal(exp);
      var got = fn.apply(null, args);
      r.got = fmtVal(got);
      r.pass = eqVal(got, exp);
    }catch(err){
      r.err = String(err && err.message || err);
    }
    if(!r.pass) allPass = false;
    results.push(r);
  }
  return {ok: allPass, err: null, results: results};
}

function runExercise(ex, code, cb){
  if(S.lang === 'cpp'){
    try{
      /* Fix 32-bit bitwise `& uint32_max` in JS where `|` / `&` are signed 32-bit: use modulo `(uint32_max + 1)` */
      var jsSrc = transpileCppToJsBrowser(code).replace(/\(([^)]+\*[^)]+)\)\s*&\s*uint32_max/g, '(($1) % (uint32_max + 1))');
      var rawFn = (new Function(jsSrc + '\nreturn ' + ex.cpp_name + ';'))();
      var wrapped = wrapCppAdapter(ex, rawFn);
      cb(gradeFn(wrapped, ex.tests));
    }catch(err){
      cb({ok:false, err:'C++ compile/runtime error: ' + String(err && err.message || err), results:[]});
    }
    return;
  }
  /* Python mode: try fast zero-latency in-page evaluator first; fall back to Pyodide Web Worker if custom Python syntax is used */
  try{
    var fastCode = code.replace(/\(([^)]+\*[^)]+)\)\s*&\s*uint32_max/g, '(($1) % (uint32_max + 1))');
    cb(runPyFastJs(ex, fastCode));
  }catch(fastErr){
    ensurePy();
    if(PYERR){
      cb({ok:false, err:'Python error: ' + String(fastErr && fastErr.message || fastErr), results:[]});
      return;
    }
    var pyScript = "import json\n" + code + "\n_res = []\n_ok = True\nfor _t in " + JSON.stringify(ex.tests) + ":\n" +
      "    try:\n" +
      "        _a = eval(_t['a'])\n" +
      "        _e = eval(_t['e'])\n" +
      "        _g = " + ex.py_name + "(*_a)\n" +
      "        _p = (_g == _e)\n" +
      "        if not _p: _ok = False\n" +
      "        _res.append({'hidden': bool(_t.get('h')), 'pass': bool(_p), 'a': _t['a'], 'e': json.dumps(_e), 'got': json.dumps(_g)})\n" +
      "    except Exception as _ex:\n" +
      "        _ok = False\n" +
      "        _res.append({'hidden': bool(_t.get('h')), 'pass': False, 'a': _t['a'], 'e': _t['e'], 'err': str(_ex)})\n" +
      "json.dumps({'ok': _ok, 'err': None, 'results': _res})\n";
    PYQ.push({
      script: pyScript,
      cb: function(d){
        if(d.fallback || d.err) cb({ok:false, err:'Python error: ' + String(d.err || fastErr), results:[]});
        else cb(JSON.parse(d.res));
      }
    });
    pyNext();
  }
}

function fmtResults(r){
  if(r.err)return '<div class="res f">'+esc(r.err)+'</div>';
  var h='',p=0;
  for(var i=0;i<r.results.length;i++){
    var t=r.results[i];if(t.pass)p++;
    if(t.pass)h+='<div class="res p">&#10003; '+(t.hidden?'hidden edge-case test':'test')+' '+(i+1)+' passed</div>';
    else if(t.hidden)h+='<div class="res f">&#10007; Hidden test '+(i+1)+' failed (checks boundary conditions like OOM, 0 items, or 32-bit wraparound).</div>';
    else h+='<div class="res f">&#10007; Test '+(i+1)+' failed:<br>&nbsp;&nbsp;input: <code>'+esc(t.a)+'</code><br>&nbsp;&nbsp;expected: <code>'+esc(t.e)+'</code><br>&nbsp;&nbsp;you got: <code>'+esc(t.err?('CRASH: '+t.err):t.got)+'</code></div>';
  }
  return '<div class="res"><b>'+p+'/'+r.results.length+' tests pass</b></div>'+h;
}

function renderCode(){
  if(S.view && S.view !== 'list'){
    var e = exById(S.view);
    if(e) return renderEx(e);
  }
  var h = header() + '<div class="card small">Switch freely between <b>Python</b> and <b>C++</b> on any exercise. Every exercise starts with a real low-level memory, GPU allocator, or KV-cache bug that FAILS the tests (RED). Fix the bug to turn all visible and hidden tests GREEN, and inspect every line of code and every variable below!' + langBar() + '</div>';
  var nx = nextEx();
  if(nx) h += '<button class="go" data-ex="'+nx.id+'">Continue Next Unsolved Lab: '+esc(nx.title)+'</button>';
  for(var l=1;l<=NLEV;l++){
    var n=0,d=0;
    h += '<div class="card"><b>Level '+l+': '+esc(L[l-1])+'</b>';
    for(var i=0;i<EX.length;i++){
      if(EX[i].l !== l) continue;
      n++;
      var ok = exSolved(EX[i].id);
      if(ok) d++;
      h += '<button data-ex="'+EX[i].id+'">'+(ok?'&#10003; ':'&#9654; ')+esc(EX[i].title)+' <span class="tag bug">'+esc(EX[i].real_bug.split(' ')[0])+'</span></button>';
    }
    h += '<div class="small">'+d+'/'+n+' solved in this level</div></div>';
  }
  app.innerHTML = h;
  wireTabs();
  wireLang(renderCode);
  var bs = app.querySelectorAll('button[data-ex]');
  for(var k=0;k<bs.length;k++){
    (function(b){b.onclick=function(){S.view=b.getAttribute('data-ex');save();render();window.scrollTo(0,0);};})(bs[k]);
  }
}

function renderEx(ex){
  var isPy = (S.lang === 'py');
  var dk = ex.id + ':' + S.lang;
  var st = S.code[ex.id] || {ok:0, tries:0, peek:0};
  var starter = isPy ? ex.py_starter : ex.cpp_starter;
  var sol = isPy ? ex.py_sol : ex.cpp_sol;
  var draft = (S.drafts && S.drafts[dk] !== undefined) ? S.drafts[dk] : starter;

  var h = header() + '<div class="card">' +
    '<div class="small"><span class="tag">Level '+ex.l+'</span><span class="tag bug">'+esc(ex.real_bug)+'</span>'+(st.ok?'<span class="tag" style="color:#4cc38a">&#10003; solved</span>':'')+'</div>' +
    langBar() +
    '<p class="q">'+esc(ex.title)+'</p>' +
    '<p style="white-space:pre-line">'+esc(ex.desc)+'</p>' +
    '<textarea id="ta" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" wrap="off"></textarea>' +
    '<div class="row"><button class="go" id="run">Run Tests ('+(isPy?'Python':'C++')+')</button><button id="hint">Hint</button></div>' +
    '<div class="row"><button id="show">Show Answer &amp; Full Line-by-Line Guide</button><button id="reset">Reset to Buggy Starter</button></div>' +
    '<div id="out"></div>' +
    '<div style="margin-top:12px">' + explainHtml(ex, false) + '</div>' +
    '</div><button id="back">Back to All 16 Code Labs</button>';
  app.innerHTML = h;
  wireTabs();
  wireLang(function(){renderEx(ex);});
  var m = document.getElementById('menu'); if(m) m.onclick = menu;
  var ta = document.getElementById('ta');
  ta.value = draft;
  ta.oninput = function(){if(!S.drafts)S.drafts={};S.drafts[dk]=ta.value;save();};
  var out = document.getElementById('out');
  document.getElementById('run').onclick = function(){
    runExercise(ex, ta.value, function(r){
      var c = S.code[ex.id] || {ok:0, tries:0, peek:0};
      c.tries = (c.tries||0) + 1;
      var msg = fmtResults(r);
      if(r.ok){
        c.ok = 1; S.code[ex.id] = c; S.stats.ans++; S.stats.right++;
        msg = '<div class="why"><b>All visible &amp; hidden tests pass!</b> You fixed the bug cleanly.</div>' + msg +
          '<button class="go" id="nx">'+(nextEx()?'Next Unsolved Exercise':'Back to Exercise List')+'</button>';
      } else {
        S.code[ex.id] = c;
        msg += '<div class="small" style="margin-top:6px">Remember: the starter code has the real bug so it fails on purpose! Tap <b>Hint</b> or expand <b>1. What Every Variable Means</b> &amp; <b>2. Line-by-Line Code Walkthrough</b> below.</div>';
      }
      out.innerHTML = msg;
      save();
      var nx = document.getElementById('nx');
      if(nx) nx.onclick = function(){var n=nextEx();S.view=n?n.id:'list';save();render();window.scrollTo(0,0);};
    });
  };
  document.getElementById('hint').onclick = function(){
    out.innerHTML = '<div class="why"><b>Hint:</b> '+esc(ex.hint)+'</div>' + out.innerHTML;
  };
  document.getElementById('show').onclick = function(){
    var c = S.code[ex.id] || {ok:0, tries:0, peek:0}; c.peek = 1; S.code[ex.id] = c; save();
    out.innerHTML = '<div class="why idk"><b>Reference Fix ('+(isPy?'Python':'C++')+'):</b><pre class="sol">'+esc(sol)+'</pre>' +
      '<button id="copyfix" class="go" style="margin-top:6px">Load Fix Into Editor &amp; Run</button></div>' + explainHtml(ex, true);
    var cf = document.getElementById('copyfix');
    if(cf) cf.onclick = function(){ ta.value = sol; ta.oninput(); document.getElementById('run').onclick(); };
  };
  document.getElementById('reset').onclick = function(){
    ta.value = starter; ta.oninput(); out.innerHTML = '';
  };
  document.getElementById('back').onclick = function(){
    S.view = 'list'; save(); render();
  };
}

function renderGuide(){
  var h = header() + '<div class="card"><b>Complete Interactive Reference &amp; Study Guide (All 8 Levels, 16 C++ &amp; Python Fixes)</b>' +
    '<div class="small" style="margin-top:4px">Every exercise below shows both the buggy starter and the verified fix in C++ and Python, with every variable and every single line of code explained.</div></div>';
  for(var i=0;i<EX.length;i++){
    var ex = EX[i];
    h += '<div class="card">' +
      '<div class="small"><span class="tag">Level '+ex.l+': '+esc(L[ex.l-1])+'</span><span class="tag bug">'+esc(ex.real_bug)+'</span></div>' +
      '<p class="q">'+esc(ex.title)+'</p>' +
      '<p style="white-space:pre-line">'+esc(ex.desc)+'</p>' +
      '<details open class="why"><summary><b>Python Fix (Reference Solution)</b></summary><pre class="sol">'+esc(ex.py_sol)+'</pre></details>' +
      '<details open class="why"><summary><b>C++ Fix (Reference Solution)</b></summary><pre class="sol">'+esc(ex.cpp_sol)+'</pre></details>' +
      explainHtml(ex, true) +
      '<button class="go" data-goex="'+ex.id+'">Open This Lab in the Interactive Code Runner</button>' +
    '</div>';
  }
  app.innerHTML = h;
  wireTabs();
  var m = document.getElementById('menu'); if(m) m.onclick = menu;
  var bs = app.querySelectorAll('button[data-goex]');
  for(var k=0;k<bs.length;k++){
    (function(b){b.onclick=function(){S.mode='code';S.view=b.getAttribute('data-goex');save();render();window.scrollTo(0,0);};})(bs[k]);
  }
}

function schedule(id,gap){S.due.push({id:id,at:S.n+gap});}

function checkLevelUp(){
  if(S.level<NLEV&&mastered(S.level)>=PER-1){
    S.level++;if(S.level>S.top)S.top=S.level;
    return 'Level up! Now Level '+S.level+': '+esc(L[S.level-1])+'.';
  }
  if(S.level===NLEV&&mastered(NLEV)>=PER-1&&!S.done){
    S.done=true;return 'You mastered all '+NLEV+' levels! Questions now mix across all levels for spaced repetition.';
  }
  return '';
}

function answer(o){
  if(answered)return;answered=true;
  var q=BANK[cur.id],id=cur.id,b=bx(id),good=(o===0),idk=(o===-1);
  S.n++;S.stats.ans++;
  var btns=document.querySelectorAll('#opts button'),i;
  for(i=0;i<btns.length;i++){
    var v=parseInt(btns[i].getAttribute('data-o'),10);
    btns[i].disabled=true;
    if(v===0)btns[i].className+=' ok';
    else if(v===o&&!good)btns[i].className+=' bad';
  }
  var msg,cls='';
  if(good){
    S.stats.right++;
    if(b<0)S.box[id]=2;else S.box[id]=Math.min(9,b+1);
    if(b>=0&&b<2)schedule(id,10);
    msg='Correct! ';
  }else{
    S.box[id]=0;schedule(id,3);
    if(idk){S.stats.idk++;cls=' idk';msg='No problem &mdash; here is how it works: ';}
    else{cls=' bad';msg='Not quite. ';}
    msg+='The right answer is: <b>'+esc(q.o[0])+'</b>.<br><br>';
  }
  var extra=!good?'<div class="small" style="margin-top:6px">Scheduled for spaced-repetition review in 3 questions.</div>':'';
  var lvlmsg=checkLevelUp();
  document.getElementById('fb').innerHTML='<div class="why'+cls+'">'+msg+esc(q.w)+extra+'</div>'+
    (lvlmsg?'<div class="why" style="margin-top:8px"><b>'+lvlmsg+'</b></div>':'')+
    '<button class="go" id="next">Next Question</button>';
  document.getElementById('next').onclick=function(){cur=null;save();render();};
  save();
}

function menu(){
  var h='<h1>All 8 Ladder Levels</h1><div class="card">',i;
  for(i=1;i<=NLEV;i++){
    h+='<div style="margin:6px 0">'+(i===S.level?'&#9654; ':'')+'<b>'+i+'.</b> '+esc(L[i-1])+' <span class="small">('+mastered(i)+'/'+PER+' quiz mastered)</span></div>';
  }
  h+='</div><div class="card small">Jump directly to any level: <select id="jmp">';
  for(i=1;i<=NLEV;i++)h+='<option value="'+i+'"'+(i===S.level?' selected':'')+'>'+escapeHtml(L[i-1])+'</option>';
  h+='</select><button class="go" id="go">Jump to Level</button><button id="rst">Reset All Progress</button></div><button class="go" id="back">Back</button>';
  app.innerHTML=h;
  document.getElementById('go').onclick=function(){S.level=parseInt(document.getElementById('jmp').value,10);cur=null;save();render();};
  document.getElementById('back').onclick=function(){render();};
  document.getElementById('rst').onclick=function(){
    if(confirm('Reset all quiz and code progress?')){
      S={level:1,top:1,box:{},due:[],n:0,stats:{ans:0,right:0,idk:0},done:false,code:{},drafts:{},mode:'quiz',view:'list',lang:'py'};
      cur=null;save();render();
    }
  };
}
function escapeHtml(s){return esc(s);}

function render(){
  if(S.mode==='code')return renderCode();
  if(S.mode==='guide')return renderGuide();
  if(!cur){var id=pick();cur={id:id,order:shuffle([0,1,2,3])};answered=false;}
  var q=BANK[cur.id],h=header();
  var again=(bx(cur.id)>=0&&bx(cur.id)<2)?'<span class="tag">spaced review</span>':'';
  h+='<div class="card"><div class="small">'+again+'<span class="tag">Level '+q.l+': '+esc(L[q.l-1])+'</span></div><p class="q">'+esc(q.q)+'</p><div id="opts">';
  for(var i=0;i<4;i++)h+='<button data-o="'+cur.order[i]+'">'+esc(q.o[cur.order[i]])+'</button>';
  h+='<button class="idk" data-o="-1">I don\'t know yet (explain it to me in plain words)</button></div><div id="fb"></div></div>';
  app.innerHTML=h;
  var b=document.querySelectorAll('#opts button');
  for(var k=0;k<b.length;k++){(function(el){el.onclick=function(){answer(parseInt(el.getAttribute('data-o'),10));};})(b[k]);}
  var m=document.getElementById('menu');if(m)m.onclick=menu;
  wireTabs();
}

load();
if(!S.code)S.code={};if(!S.drafts)S.drafts={};if(!S.mode)S.mode='quiz';if(!S.view)S.view='list';if(!S.lang)S.lang='py';
render();
})();
</script></body></html>
